<!DOCTYPE html>

<head>

<title>회로·아두이노 가상 실험실</title>
<style>
  :root {
    --bg: #f4f6fa; --panel: #ffffff; --ink: #1c2733; --sub: #5a6b7d;
    --accent: #1f6fd6; --accent2: #d64545; --ok: #1e8f4e;
    --border: #d7dee8; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body { font-family: "Segoe UI", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--ink); padding: 12px; font-size: 15px; }

  header h1 { font-size: 1.25em; }
  header .spacer { flex: 1; }
  a.home { text-decoration: none; color: var(--sub); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-size: 0.9em; white-space: nowrap; }
  button { font-size: 1em; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  body.projector { font-size: 19px; }
  body.projector button { padding: 12px 18px; }
  noscript { display: block; padding: 20px; }
</style>
</head>

<header>
  <a class="home" href="../../index.html">🏠 홈</a>

</header>

<div id="tabs" hidden></div>
<div id="freeLab"></div>
<noscript>이 실험실은 JavaScript가 필요합니다.</noscript>

<script>document.getElementById("projectorBtn").addEventListener("click", () => document.body.classList.toggle("projector"));</script>
<script src="arduino.js?v=2"></script>
<script src="lab.js?v=2"></script>
</body>
