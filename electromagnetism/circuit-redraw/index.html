<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회로 변형 실험실 — 점을 합쳐 다시 그리기</title>
<style>
  :root {
    --bg: #f4f6fa; --panel: #ffffff; --ink: #1c2733; --sub: #5a6b7d;
    --accent: #1f6fd6; --accent2: #d64545; --ok: #1e8f4e;
    --border: #d7dee8; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink);
    padding: 12px; font-size: 15px;
  }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  header h1 { font-size: 1.25em; }
  header .spacer { flex: 1; }
  a.home { text-decoration:none; color:var(--sub); border:1px solid var(--border); padding:6px 12px; border-radius:8px; font-size:0.9em; white-space:nowrap; }

  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button { flex: 0 0 auto; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 1em; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .layout { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .sim-col { flex: 2 1 480px; display: flex; flex-direction: column; gap: 12px; }
  .side-col { flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px; }

  #sceneWrap { position: relative; width: 100%; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden; background: radial-gradient(circle at 50% 30%, #16233a, #060a12 75%); }
  #sceneWrap canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hoverHint { position:absolute; left:8px; bottom:8px; color:#9fb3d9; font-size:0.78em; background:rgba(6,10,18,0.55); padding:4px 8px; border-radius:6px; pointer-events:none; }
  #hoverHint:empty { display: none; }
  #simError { position:absolute; left:8px; right:8px; top:8px; color:#fff; background:rgba(214,69,69,0.92); padding:6px 10px; border-radius:6px; font-size:0.82em; white-space:pre-wrap; }

  .scenario-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .scenario-picker button { flex: 1 1 30%; min-width: 120px; padding: 8px 6px; font-size: 0.86em; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  .scenario-picker button.active { background: #eaf1fd; border-color: var(--accent); color: var(--accent); font-weight: 700; }

  .param { margin-bottom: 10px; }
  .param label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; font-size: 0.92em; }
  .param label .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  .param input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--sub); font-size: 0.83em; margin-top: 2px; line-height: 1.5; }

  button { font-size: 1em; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.warn { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .controls-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.82em; color: var(--sub); margin-top: 8px; }
  .legend:empty { display: none; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .swatch.bar { border-radius: 2px; }

  table.readout { width: 100%; border-collapse: collapse; font-size: 0.92em; }
  table.readout td { padding: 4px 2px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  table.readout td:first-child { color: var(--sub); }
  table.readout td:last-child { text-align: right; font-weight: 700; }

  details { margin-top: 6px; }
  summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
  .formula-body { padding: 8px 2px; line-height: 1.8; font-size: 0.92em; }
  .formula-body .eq { font-size: 1.08em; text-align: center; margin: 6px 0; font-family: Georgia, serif; }
  .note { border-left: 3px solid var(--accent); background: #eef4fd; padding: 8px 10px; border-radius: 6px; font-size: 0.86em; margin-top: 8px; line-height: 1.6; }
  .note:empty { display: none; }
  .misconception { border-left: 3px solid var(--accent2); background: #fdeeee; padding: 8px 10px; border-radius: 6px; font-size: 0.86em; margin-top: 8px; line-height: 1.6; }

  canvas.chart { width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 6px; }

  body.projector { font-size: 19px; }
  body.projector button { padding: 12px 18px; }
  body.projector .scenario-picker button { font-size: 1em; padding: 12px 8px; }

  @media (max-width: 720px) {
    body { font-size: 16px; padding: 8px; }
    .layout { flex-direction: column; }
    .sim-col, .side-col { flex: 1 1 100%; }
    button { padding: 11px 14px; }
    input[type=range] { height: 26px; }
  }
/* ---- 레시피 입력 extra_css ---- */

<header>
  <a class="home" href="../index.html">🏠 홈</a>

      api.camera.position.set(cp[0], cp[1], cp[2]);
      api.renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
      api.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      wrap.insertBefore(api.renderer.domElement, wrap.firstChild);
      api.controls = new T.OrbitControls(api.camera, api.renderer.domElement);
      api.controls.enableDamping = true;
      api.controls.dampingFactor = 0.08;
      api.controls.target.set(0, 0, 0);
      api.scene.add(new T.AmbientLight(0xffffff, 0.55));
      const dl = new T.DirectionalLight(0xffffff, 0.9);
      dl.position.set(20, 30, 15);
      api.scene.add(dl);
      if (sc.grid !== false) api.scene.add(new T.GridHelper(api.boxHalf * 2, 16, 0x3a5a8a, 0x1f3352));
      if (sc.axes !== false) api.scene.add(new T.AxesHelper(api.boxHalf * 0.6));
    } else {
      api.canvas = document.createElement("canvas");
      wrap.insertBefore(api.canvas, wrap.firstChild);
      api.ctx = api.canvas.getContext("2d");
    }
    window.addEventListener("resize", onResize);
    onResize();
    return true;
  }

  function onResize() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    api.width = w; api.height = h;
    if (api.renderer) {
      api.camera.aspect = w / h;
      api.camera.updateProjectionMatrix();
      api.renderer.setSize(w, h);
    } else if (api.canvas) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      api.canvas.width = Math.round(w * dpr);
      api.canvas.height = Math.round(h * dpr);
      api.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (ui.scenarioId) call("update");
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    if (api.controls) api.controls.update();
    call("frame", 1 / 60);
    if (api.renderer) api.renderer.render(api.scene, api.camera);
  }

  /* ---------- UI ---------- */
  function renderTabs() {
    const box = $("tabs");
    box.innerHTML = "";
    box.hidden = C.tabs.length < 2;
    C.tabs.forEach(t => {
      const b = document.createElement("button");
      b.textContent = t.label;
      b.className = t.id === ui.tab ? "active" : "";
      b.addEventListener("click", () => switchTab(t.id));
      box.appendChild(b);
    });
  }

  function renderPicker() {
    const box = $("scenarioPicker");
    const list = scenariosOfTab(ui.tab);
    box.innerHTML = "";
    box.hidden = list.length < 2;
    list.forEach(s => {
      const b = document.createElement("button");
      b.textContent = s.name;
      b.className = s.id === ui.scenarioId ? "active" : "";
      b.addEventListener("click", () => selectScenario(s.id));
      box.appendChild(b);
    });
  }

  function sliderEl(p) {
    const div = document.createElement("div");
    div.className = "param";
    const label = document.createElement("label");
    label.textContent = p.label + " ";
    const val = document.createElement("span");
    val.className = "val"; val.id = "p_" + p.key + "_val"; val.dataset.unit = p.unit || "";
    val.textContent = fmtVal(P[p.key], p.unit);
    label.appendChild(val);
    const inp = document.createElement("input");
    inp.type = "range"; inp.id = "p_" + p.key;
    inp.min = p.min; inp.max = p.max; inp.step = p.step; inp.value = P[p.key];
    inp.addEventListener("input", () => {
      const v = parseFloat(inp.value);
      P[p.key] = v;
      val.textContent = fmtVal(v, p.unit);
      call("update");
    });
    div.append(label, inp);
    return div;
  }

  function choiceEl(c) {
    const row = document.createElement("div");
    row.className = "row"; row.style.marginBottom = "8px";
    if (c.label) { const l = document.createElement("b"); l.style.fontSize = "0.9em"; l.textContent = c.label; row.appendChild(l); }
    c.options.forEach(o => {
      const b = document.createElement("button");
      b.textContent = o.label;
      b.className = P[c.key] === o.value ? "primary" : "";
      b.addEventListener("click", () => {
        P[c.key] = o.value;
        row.querySelectorAll("button").forEach(x => x.className = "");
        b.className = "primary";
        call("update");
      });
      row.appendChild(b);
    });
    return row;
  }

  function renderControls() {
    const s = current();
    const body = $("scenarioBody");
    body.innerHTML = "";
    if (s.desc || s.section) {
      const p = document.createElement("p");
      p.className = "hint"; p.style.marginBottom = "10px";
      if (s.section) { const b = document.createElement("b"); b.textContent = s.section; p.appendChild(b); if (s.desc) p.appendChild(document.createTextNode(" — ")); }
      if (s.desc) p.appendChild(document.createTextNode(s.desc));
      body.appendChild(p);
    }
    (s.choices || []).forEach(c => body.appendChild(choiceEl(c)));
    (s.params || []).forEach(p => body.appendChild(sliderEl(p)));
    if (s.animated) {
      const st = document.createElement("div");
      st.className = "hint"; st.id = "wsStatus";
      st.textContent = s.status_hint || "";
      body.appendChild(st);
      const row = document.createElement("div");
      row.className = "controls-row";
      const play = document.createElement("button");
      play.id = "playBtn"; play.className = "primary";
      play.addEventListener("click", () => { ui.playing = !ui.playing; updatePlayButton(); });
      const reset = document.createElement("button");
      reset.textContent = "↺ 리셋";
      reset.addEventListener("click", () => { ui.playing = false; updatePlayButton(); call("reset"); call("update"); });
      row.append(play, reset);
      body.appendChild(row);
      updatePlayButton();
    }
    const cp = C.common_params;
    if (cp && s.use_common !== false) {
      const hr = document.createElement("hr");
      hr.style.cssText = "margin:10px 0;border:none;border-top:1px solid var(--border)";
      body.appendChild(hr);
      if (cp.title) { const b = document.createElement("b"); b.style.fontSize = "0.9em"; b.textContent = cp.title; body.appendChild(b); }
      cp.params.forEach(p => body.appendChild(sliderEl(p)));
    }
  }

  function updatePlayButton() {
    const b = $("playBtn");
    if (b) b.textContent = ui.playing ? "⏸ 일시정지" : "▶ 재생";
  }

  function renderFormula() {
    const s = current();
    const body = $("formulaBody");
    body.innerHTML = (s.formula || []).map(f =>
      (f.eq_html ? `<div class="eq">${f.eq_html}</div>` : "") + (f.text_html || "")
    ).join("");
  }

  function renderMisconception() {
    const s = current();
    const panel = $("misconceptionPanel");
    panel.innerHTML = "";
    panel.hidden = !s.misconception;
    if (!s.misconception) return;
    const box = document.createElement("div");
    box.className = "misconception";
    const b = document.createElement("b");
    b.textContent = s.misconception_title || "💡 흔한 오개념";
    box.append(b, document.createElement("br"), document.createTextNode(s.misconception));
    panel.appendChild(box);
  }

  function enterScenario() {
    ui.playing = false;
    const s = current();
    $("graphPanel").hidden = !s.chart;
    $("chartHint").innerHTML = "";
    api.custom.innerHTML = "";
    api.setReadout([]); api.setNote("");
    renderPicker(); renderControls(); renderFormula(); renderMisconception();
    call("enter");
    call("update");
  }

  function selectScenario(id) {
    ui.scenarioId = id;
    lastScenarioOfTab[ui.tab] = id;
    enterScenario();
  }

  function switchTab(tab) {
    ui.tab = tab;
    renderTabs();
    selectScenario(lastScenarioOfTab[tab] || scenariosOfTab(tab)[0].id);
  }

  function renderLegend() {
    const box = $("legend");
    (C.legend || []).forEach(l => {
      const span = document.createElement("span");
      const sw = document.createElement("i");
      sw.className = "swatch" + (l.shape === "bar" ? " bar" : "");
      sw.style.background = l.color;
      span.append(sw, document.createTextNode(l.label));
      box.appendChild(span);
    });
  }

  function runSelfTests() {
    if (!SIMOBJ || typeof SIMOBJ.tests !== "function") { console.log("물리 검증 항목 없음"); return; }
    let results = [];
    try { results = SIMOBJ.tests() || []; } catch (e) { showError("tests", e); return; }
    console.log("=== " + C.title + " 물리 검증 ===");
    let pass = 0;
    for (const [name, ok, detail] of results) {
      console.log(`[${ok ? "PASS" : "FAIL"}] ${name}${detail ? " — " + detail : ""}`);
      if (ok) pass++;
    }
    console.log(pass === results.length ? "모든 검증 통과" : "일부 검증 실패 — 콘솔 확인 필요");
    window.__wsSelfTest = { pass, total: results.length };
  }

  /* ---------- 시작 ---------- */
  $("readoutTitle").textContent = C.readout_title || "측정값";
  $("hoverHint").textContent = (C.scene && C.scene.hint != null) ? C.scene.hint
    : (C.renderer === "three" ? "마우스 드래그: 회전 · 휠: 확대/축소" : "");
  $("projectorBtn").addEventListener("click", () => document.body.classList.toggle("projector"));
  renderLegend();
  if (!SIMOBJ) showError("load", "sim_js에 SIM 객체가 정의되지 않았습니다");
  if (initRenderer()) {
    call("init");
    renderTabs();
    switchTab(ui.tab);
    animate();
  }
  runSelfTests();
})();
</script>

</body>
