<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>저항의 직렬연결과 병렬연결 가상 실험실</title>
<style>
  :root {
    --bg: #f4f6fa; --panel: #ffffff; --ink: #1c2733; --sub: #5a6b7d;
    --accent: #1f6fd6; --accent2: #d64545; --ok: #1e8f4e;
    --border: #d7dee8; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink);
    padding: 12px; font-size: 15px;
  }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  header h1 { font-size: 1.25em; }
  header .spacer { flex: 1; }
  a.home { text-decoration:none; color:var(--sub); border:1px solid var(--border); padding:6px 12px; border-radius:8px; font-size:0.9em; white-space:nowrap; }

  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button { flex: 0 0 auto; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 1em; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .layout { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .sim-col { flex: 2 1 480px; display: flex; flex-direction: column; gap: 12px; }
  .side-col { flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px; }

  #sceneWrap { position: relative; width: 100%; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden; background: radial-gradient(circle at 50% 30%, #16233a, #060a12 75%); }
  #sceneWrap canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hoverHint { position:absolute; left:8px; bottom:8px; color:#9fb3d9; font-size:0.78em; background:rgba(6,10,18,0.55); padding:4px 8px; border-radius:6px; pointer-events:none; }
  #hoverHint:empty { display: none; }
  #simError { position:absolute; left:8px; right:8px; top:8px; color:#fff; background:rgba(214,69,69,0.92); padding:6px 10px; border-radius:6px; font-size:0.82em; white-space:pre-wrap; }

  .scenario-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .scenario-picker button { flex: 1 1 30%; min-width: 120px; padding: 8px 6px; font-size: 0.86em; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  .scenario-picker button.active { background: #eaf1fd; border-color: var(--accent); color: var(--accent); font-weight: 700; }

  .param { margin-bottom: 10px; }
  .param label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; font-size: 0.92em; }
  .param label .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  .param input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--sub); font-size: 0.83em; margin-top: 2px; line-height: 1.5; }

  button { font-size: 1em; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.warn { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .controls-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.82em; color: var(--sub); margin-top: 8px; }
  .legend:empty { display: none; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .swatch.bar { border-radius: 2px; }

  table.readout { width: 100%; border-collapse: collapse; font-size: 0.92em; }
  table.readout td { padding: 4px 2px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  table.readout td:first-child { color: var(--sub); }
  table.readout td:last-child { text-align: right; font-weight: 700; }

  details { margin-top: 6px; }
  summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
  .formula-body { padding: 8px 2px; line-height: 1.8; font-size: 0.92em; }
  .formula-body .eq { font-size: 1.08em; text-align: center; margin: 6px 0; font-family: Georgia, serif; }
  .note { border-left: 3px solid var(--accent); background: #eef4fd; padding: 8px 10px; border-radius: 6px; font-size: 0.86em; margin-top: 8px; line-height: 1.6; }
  .note:empty { display: none; }
  .misconception { border-left: 3px solid var(--accent2); background: #fdeeee; padding: 8px 10px; border-radius: 6px; font-size: 0.86em; margin-top: 8px; line-height: 1.6; }

  canvas.chart { width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 6px; }

  body.projector { font-size: 19px; }
  body.projector button { padding: 12px 18px; }
  body.projector .scenario-picker button { font-size: 1em; padding: 12px 8px; }

  @media (max-width: 720px) {
    body { font-size: 16px; padding: 8px; }
    .layout { flex-direction: column; }
    .sim-col, .side-col { flex: 1 1 100%; }
    button { padding: 11px 14px; }
    input[type=range] { height: 26px; }
  }

</head>

<header>
  <a class="home" href="../../index.html">🏠 홈</a>

  <span class="spacer"></span>

</header>

<div class="tabs" id="tabs"></div>

<div id="freeLab" hidden></div>

<div class="layout">

  <div class="sim-col">
    <div class="panel">

        <div id="simError" hidden></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="panel" id="graphPanel" hidden>
      <canvas id="chartCanvas" class="chart" width="440" height="220"></canvas>
      <div class="hint" id="chartHint"></div>
    </div>
  </div>

  <div class="side-col">

    <div class="panel" id="scenarioPanel">
      <div class="scenario-picker" id="scenarioPicker"></div>
      <div id="scenarioBody"></div>
      <div id="customPanel"></div>
    </div>

    <div class="panel" id="readoutPanel">
      <b id="readoutTitle"></b>
      <table class="readout" id="readout"></table>
      <div class="note" id="readoutNote"></div>
    </div>

    <div class="panel">
      <details id="formulaDetails">
        <summary>📐 관련 공식 보기</summary>
        <div class="formula-body" id="formulaBody"></div>
      </details>
    </div>

    <div class="panel" id="misconceptionPanel"></div>

  </div>
</div>

/* 1. 회로 해석 — 노달 해석(전지=전압원+내부저항, 계기도 내부저항을 가진 소자) */

function buildNet(c) {

}

function evalCircuit(c) {
  const net = buildNet(c);

}

/* 2. 배치 계획 — 실물 배선과 회로도가 같은 좌표를 쓴다 (단위: 1 = 회로도 한 칸) */

  s0: [1, 3.4, 0, -1.1], s1: [5.2, 1.5, 1.1, 0], s3: [7.0, 6.5, -1.1, 0], b1: [8, 2.5, 0, 1.1], b2: [11, 2.5, 0, 1.1],

    const I = r.I, sp = Math.sign(I) * 1.8 * Math.tanh(Math.abs(I) * 3);
    if (Math.abs(I) < 1e-3) return;
    const gap = 0.55, n = Math.floor(p.len / gap), off = ((tsec * sp) % gap + gap) % gap;
    g.fillStyle = COL.dot;
    for (let i = 0; i < n; i++) {
      const ss = (i * gap + off) % p.len;
      if (p.items.some(it => ss > it.s - it.span / 2 - 0.05 && ss < it.s + it.span / 2 + 0.05)) continue;
      const q = ptAt(p, ss); g.beginPath(); g.arc(X(q.x), Y(q.y), 2.6, 0, 7); g.fill();

  });
  // 부품
  plan.parts.forEach(pt => {
    g.save(); g.translate(X(pt.x), Y(pt.y)); g.rotate(Math.atan2(pt.dy, pt.dx));
    const h = pt.span / 2 * s; g.lineWidth = 2.4;
    if (pt.kind === "res") {
      g.strokeStyle = COL.res; g.beginPath(); g.moveTo(-h, 0);
      for (let i = 0; i < 6; i++) g.lineTo(-h + (i + 0.5) * (2 * h / 6), (i % 2 ? 1 : -1) * 0.2 * s);
      g.lineTo(h, 0); g.stroke();
    } else if (pt.kind === "sw") {
      const closed = S.sw; g.strokeStyle = COL.part; g.fillStyle = COL.part;
      g.beginPath(); g.arc(-h, 0, 3.4, 0, 7); g.arc(h, 0, 3.4, 0, 7); g.fill();
      g.beginPath(); g.moveTo(-h, 0); g.lineTo(h * (closed ? 1 : 0.86), closed ? 0 : -0.55 * s); g.stroke();
    } else if (pt.kind === "bat") {

      g.strokeStyle = "#8ecae6"; g.lineWidth = 5; g.beginPath(); g.moveTo(0.15 * s, -0.22 * s); g.lineTo(0.15 * s, 0.22 * s); g.stroke();
    } else {
      const am = pt.kind === "am"; g.strokeStyle = am ? COL.am : COL.vm; g.fillStyle = "rgba(10,16,26,.85)";
      g.beginPath(); g.arc(0, 0, 0.4 * s, 0, 7); g.fill(); g.stroke();
      g.rotate(-Math.atan2(pt.dy, pt.dx)); g.fillStyle = am ? COL.am : COL.vm; g.font = "bold " + 0.42 * s + "px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(am ? "A" : "V", 0, 0.02 * s);

  const lab = (t, x, y, col) => { g.fillStyle = col || COL.text; g.fillText(t, X(x), Y(y)); };
  plan.parts.forEach(pt => {
    const vert = Math.abs(pt.dy) > 0.5, ox2 = vert ? 0.95 : 0, oy2 = vert ? 0 : -0.62;
    if (pt.kind === "bat") lab(c.emf.toFixed(1) + " V" + (c.r > 0 ? " (r=" + c.r.toFixed(1) + "Ω)" : ""), pt.x + 1.05, pt.y, "#ff9b9b");
    else if (pt.kind === "res") { const r = res.by[pt.id], nmR = (pt.id === "R1" ? "R₁=" + c.R1 : "R₂=" + c.R2) + "Ω"; lab(nmR, pt.x + ox2, pt.y + oy2, COL.res); if (!c.noMeter && r && !vert) lab(fmtV(r.V) + " · " + fmtA(r.I), pt.x, pt.y + oy2 - 0.42, COL.sub); }
    else if (pt.kind === "sw") lab(S.sw ? "스위치 닫힘" : "스위치 열림", pt.x, pt.y - 0.62, S.sw ? COL.part : COL.warn);
    else if (pt.kind === "am") { const a = res.by.AM; lab(fmtA(a.I), pt.x, pt.y + (vert ? 0.85 : 0.7), Math.abs(a.I) >= 3 ? COL.warn : COL.am); }
    else if (pt.kind === "vm") { const v = res.by.VM; lab(fmtV(v.V), pt.x, pt.y + (vert ? 0.85 : 0.7), COL.vm); }
  });
}

/* 4. 실물 배선(3D 실험대) */
const K3 = 2.2, WY = 0.85;
const DIGIT = [0x111111, 0x7b4a1e, 0xd62828, 0xf77f00, 0xfcbf49, 0x2a9d8f, 0x1d4ed8, 0x7b2cbf, 0x888888, 0xeeeeee];
const WIRE_COL = [0xe05555, 0x3f8fe0, 0xf1c453, 0x39b36b, 0xc77dff, 0xff9f43, 0x7fd1e8];
const wpos = (x, y, h) => [(x - 7) * K3, h === undefined ? WY : h, (y - 4) * K3];

function bandsOf(R) { return R >= 10 ? [Math.floor(R / 10), R % 10, 0] : [Math.floor(R), Math.round((R % 1) * 10), -1]; }

function buildBench(api, c, plan) {
  const T = api.THREE, root = S.bench; clearGroup(root); S.sprites = {}; S.hit = [];
  const mat = (col, o) => new T.MeshStandardMaterial(Object.assign({ color: col, roughness: 0.6, metalness: 0.1 }, o || {}));
  const board = new T.Mesh(new T.BoxGeometry(15.4 * K3, 0.5, 8.6 * K3), mat(0x233246)); board.position.set(0, -0.26, 0); root.add(board);
  const edge = new T.Mesh(new T.BoxGeometry(15.5 * K3, 0.12, 8.7 * K3), mat(0x3a4d68)); edge.position.set(0, -0.5, 0); root.add(edge);
  const label = (txt, col, x, y, z, sx) => { const sp = makeSprite(T, 256, 64, sx || 4.2, (sx || 4.2) / 4); sp.position.set(x, y, z); setSprite(sp, txt, col); root.add(sp); return sp; };
  plan.parts.forEach(pt => {
    const g = new T.Group(), p = wpos(pt.x, pt.y, 0), h = pt.span / 2 * K3;
    g.position.set(p[0], 0, p[2]); g.rotation.y = -Math.atan2(pt.dy, pt.dx);
    const post = (lx, col) => { const m = new T.Mesh(new T.CylinderGeometry(0.2, 0.2, WY, 12), mat(col || 0xcfd6df, { metalness: 0.6 })); m.position.set(lx, WY / 2, 0); g.add(m); };
    if (pt.kind === "res") {
      const bl = h * 1.25, body = new T.Mesh(new T.CylinderGeometry(0.5, 0.5, bl, 20), mat(0xe6d3a3)); body.rotation.z = Math.PI / 2; body.position.y = WY; g.add(body);
      const lead = new T.Mesh(new T.CylinderGeometry(0.07, 0.07, 2 * h, 8), mat(0xcfd6df, { metalness: 0.7 })); lead.rotation.z = Math.PI / 2; lead.position.y = WY; g.add(lead);
      const b = bandsOf(pt.id === "R1" ? c.R1 : c.R2), cols = [DIGIT[b[0]], DIGIT[b[1]], b[2] < 0 ? 0xd4af37 : DIGIT[b[2]], 0xd4af37];
      cols.forEach((col, i) => { const r = new T.Mesh(new T.CylinderGeometry(0.53, 0.53, 0.18, 20), mat(col)); r.rotation.z = Math.PI / 2; r.position.set(-bl * 0.36 + i * bl * 0.22 + (i === 3 ? bl * 0.1 : 0), WY, 0); g.add(r); });
      post(-h); post(h);
      const sp = label((pt.id === "R1" ? "R₁ " : "R₂ ") + (pt.id === "R1" ? c.R1 : c.R2) + " Ω", "#ffd1a1", p[0], 2.6, p[2]); S.sprites[pt.id] = sp;
    } else if (pt.kind === "sw") {
      const base = new T.Mesh(new T.BoxGeometry(2 * h + 0.6, 0.3, 1.6), mat(0x5b6577)); base.position.y = 0.15; g.add(base); base.userData.sw = true; S.hit.push(base);
      post(-h, 0xd9a441); post(h, 0xd9a441);
      const piv = new T.Group(); piv.position.set(-h, WY, 0); const lever = new T.Mesh(new T.BoxGeometry(2 * h, 0.16, 0.5), mat(0xd9a441, { metalness: 0.7 })); lever.position.x = h; piv.add(lever);
      const knob = new T.Mesh(new T.SphereGeometry(0.35, 14, 14), mat(0xb02a2a)); knob.position.set(2 * h - 0.2, 0.28, 0); piv.add(knob); knob.userData.sw = true; S.hit.push(knob, lever); lever.userData.sw = true;
      piv.rotation.z = S.sw ? 0 : 0.75; g.add(piv); S.lever = piv;
      S.sprites.SW = label("", "#ffd166", p[0], 2.4, p[2], 3.4);
    } else if (pt.kind === "bat") {
      const body = new T.Mesh(new T.CylinderGeometry(0.95, 0.95, 2 * h + 1.0, 24), mat(0x2b2f36)); body.rotation.z = Math.PI / 2; g.add(body); body.position.y = 1.0;
      const wrap = new T.Mesh(new T.CylinderGeometry(0.97, 0.97, h * 1.1, 24), mat(0xc9a227)); wrap.rotation.z = Math.PI / 2; wrap.position.set(h * 0.35, 1.0, 0); g.add(wrap);
      const cap = new T.Mesh(new T.CylinderGeometry(0.4, 0.4, 0.5, 16), mat(0xd0d6de, { metalness: 0.8 })); cap.rotation.z = Math.PI / 2; cap.position.set(-h - 0.75, 1.0, 0); g.add(cap);
      post(-h, 0xe05555); post(h, 0x3f8fe0);
      S.sprites.BAT = label("", "#ff9b9b", p[0] + 0.2, 3.2, p[2], 4.6);
      label("＋", "#ff7b7b", p[0], 0.1, p[2] - h - 0.3, 1.2); label("－", "#8ecae6", p[0], 0.1, p[2] + h + 0.3, 1.2);
    } else {
      const am = pt.kind === "am", col = am ? 0x1d6fa5 : 0x6a3fb5;
      const box = new T.Mesh(new T.BoxGeometry(1.7, 0.9, 1.7), mat(col)); box.position.y = 0.45; g.add(box);
      const scr = new T.Mesh(new T.BoxGeometry(1.2, 0.05, 0.9), mat(0x0b1620, { emissive: am ? 0x0a3a55 : 0x2a1a55 })); scr.position.y = 0.92; g.add(scr);
      post(-h, 0xe05555); post(h, 0x222222);

    }
    root.add(g);
  });
  plan.wires.forEach((w, wi) => {
    const col = WIRE_COL[wi % WIRE_COL.length], m = mat(col, { roughness: 0.4 });
    const pts = w.map(q => new T.Vector3(...wpos(q[0], q[1])));
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], len = a.distanceTo(b); if (len < 1e-3) continue;
      const cyl = new T.Mesh(new T.CylinderGeometry(0.14, 0.14, len, 10), m); cyl.position.copy(a).add(b).multiplyScalar(0.5);
      cyl.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), b.clone().sub(a).normalize()); root.add(cyl);
    }
    for (let i = 1; i < pts.length - 1; i++) { const j = new T.Mesh(new T.SphereGeometry(0.14, 10, 10), m); j.position.copy(pts[i]); root.add(j); }
  });
  plan.juncs.forEach(q => { const j = new T.Mesh(new T.SphereGeometry(0.26, 12, 12), mat(0xd0d6de, { metalness: 0.7 })); j.position.set(...wpos(q[0], q[1])); root.add(j); });
}

function refreshBench(c, res) {
  if (S.lever) S.lever.rotation.z = S.sw ? 0 : 0.75;
  const sp = S.sprites;
  if (sp.SW) setSprite(sp.SW, S.sw ? "스위치 닫힘" : "스위치 열림", S.sw ? "#ffd166" : "#ff8a8a");
  if (sp.BAT) setSprite(sp.BAT, "전지 " + c.emf.toFixed(1) + " V" + (c.r > 0 ? " (r=" + c.r.toFixed(1) + "Ω)" : ""), "#ff9b9b");
  if (sp.AM) { const a = res.by.AM; setSprite(sp.AM, fmtA(a.I), Math.abs(a.I) >= 3 ? "#ff6b6b" : "#7fe0ff"); }
  if (sp.VM) setSprite(sp.VM, fmtV(res.by.VM.V), "#d2b8ff");
}

function expKey(c) { return [c.topo, c.target, c.am, c.vm, c.R1, c.topo === "series" || c.topo === "parallel" ? c.R2 : 0].join("|"); }

/* 5. 비유 모형 — 물 파이프 / 높이 지형 (같은 회로 해석 결과로 구동) */
const HK = 0.7, HH = 1.2, NPART = 170, VMAX = 46;
const W_AREA = 1.0;   // 굵은 관(도선) 단면적 기준
const _arA = r => (r / 0.9) * (r / 0.9);

function flowPath(pts, areas, ref) {
  const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + pts[i].distanceTo(pts[i - 1]));
  return { pts, areas, cum, len: cum[cum.length - 1], ref, next: [] };
}
function slab(T, root, a, b, w, col, thick) {
  const d = b.clone().sub(a), L = d.length(); if (L < 1e-3) return;
  const m = new T.Mesh(new T.BoxGeometry(L, thick || 0.3, w), new T.MeshStandardMaterial({ color: col, roughness: 0.7 }));
  m.position.copy(a).add(b).multiplyScalar(0.5); m.rotation.z = Math.atan2(d.y, d.x) ; root.add(m);
  // x-y 평면 경사 + z 방향 이동(병렬 가지)은 yaw 처리
  if (Math.abs(d.z) > 1e-3) { m.rotation.set(0, 0, 0); m.quaternion.setFromUnitVectors(new T.Vector3(1, 0, 0), d.clone().normalize()); }
  return m;
}
function pipeSeg(T, root, a, b, r, col, op) {
  const d = b.clone().sub(a), L = d.length(); if (L < 1e-3) return;
  const m = new T.Mesh(new T.CylinderGeometry(r, r, L, 20, 1, true), new T.MeshStandardMaterial({ color: col, transparent: true, opacity: op || 0.3, side: T.DoubleSide, roughness: 0.2 }));
  m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize()); root.add(m);
  const ring = (p) => { const rg = new T.Mesh(new T.TorusGeometry(r, 0.06, 6, 20), new T.MeshStandardMaterial({ color: 0xdfe8f3 })); rg.position.copy(p); rg.quaternion.setFromUnitVectors(new T.Vector3(0, 0, 1), d.clone().normalize()); root.add(rg); };
  ring(a); ring(b);
}
function mkLabel(T, root, txt, col, x, y, z, sx) { const sp = makeSprite(T, 320, 72, sx || 6, (sx || 6) * 72 / 320); sp.position.set(x, y, z); setSprite(sp, txt, col); root.add(sp); return sp; }

function addStand(T, root, fl, x, z, y0, name, col, getV) {
  const hmax = 10, glass = new T.Mesh(new T.CylinderGeometry(0.5, 0.5, hmax, 16, 1, true), new T.MeshStandardMaterial({ color: 0xcfe8ff, transparent: true, opacity: 0.18, side: T.DoubleSide }));
  glass.position.set(x, y0 + hmax / 2, z); root.add(glass);
  const water = new T.Mesh(new T.CylinderGeometry(0.4, 0.4, 1, 16), new T.MeshStandardMaterial({ color: col || 0x3aa7ff, transparent: true, opacity: 0.9 })); root.add(water);
  const sp = mkLabel(T, root, "", "#bfe6ff", x, y0 + hmax + 1.6, z, 6.4);
  fl.stands.push({ water, sp, x, z, y0, name, getV });
}
function addValve(T, root, fl, x, y, z, kind) {
  const g = new T.Group(); g.position.set(x, y, z);
  const hit = [];
  if (kind === "water") {
    const body = new T.Mesh(new T.CylinderGeometry(1.15, 1.15, 1.8, 18), new T.MeshStandardMaterial({ color: 0x6b7686, metalness: 0.5 })); body.rotation.z = Math.PI / 2; g.add(body);
    const stem = new T.Mesh(new T.CylinderGeometry(0.15, 0.15, 1.6, 8), new T.MeshStandardMaterial({ color: 0xaab3c0 })); stem.position.y = 1.5; g.add(stem);
    const handle = new T.Mesh(new T.BoxGeometry(2.4, 0.22, 0.5), new T.MeshStandardMaterial({ color: 0xd62828 })); handle.position.y = 2.3; g.add(handle); hit.push(body, handle, stem);
    fl.valve = { handle, kind };
  } else {
    [-1, 1].forEach(s => { const p = new T.Mesh(new T.BoxGeometry(0.4, 6, 0.4), new T.MeshStandardMaterial({ color: 0x8b95a5 })); p.position.set(0, 3, s * 1.9); g.add(p); hit.push(p); });
    const bar = new T.Mesh(new T.BoxGeometry(0.35, 0.5, 4), new T.MeshStandardMaterial({ color: 0xd62828 })); g.add(bar); hit.push(bar);
    fl.valve = { handle: bar, kind };
  }
  hit.forEach(m => { m.userData.sw = true; S.hit.push(m); });
  root.add(g); fl.valve.g = g; fl.valve.y0 = y;
}

function buildFlow(api, kind, topo, c, res) {
  const T = api.THREE, root = S.flow.root; clearGroup(root); S.hit = [];
  const fl = S.flow; fl.stands = []; fl.paths = []; fl.labels = {}; fl.kind = kind; fl.topo = topo;
  const V3 = (x, y, z) => new T.Vector3(x, y, z);
  const y0 = 2.2, by = res.by, Vp = res.Vterm, Va = Vp - by.SW.V;
  const gridCol = 0x233246;
  const floor = new T.Mesh(new T.BoxGeometry(40, 0.4, 24), new T.MeshStandardMaterial({ color: gridCol })); floor.position.set(0, kind === "water" ? -0.4 : -0.5, 2); root.add(floor);
  if (kind === "water") {
    const rW = 0.9, rN = 0.5;
    if (topo === "series") {
      const L1 = 0.18 * c.R1, L2 = 0.18 * c.R2, xa = -8, x1 = xa + L1, xb = x1 + 2.5, x2 = xb + L2, zt = -5, zb = 5;
      const P = [V3(-14, y0, zb), V3(-14, y0, zt), V3(xa, y0, zt), V3(x1, y0, zt), V3(xb, y0, zt), V3(x2, y0, zt), V3(15, y0, zt), V3(15, y0, zb), V3(-14, y0, zb)];
      const ar = [W_AREA, W_AREA, _arA(rN), W_AREA, _arA(rN), W_AREA, W_AREA, W_AREA];
      const rad = [rW, rW, rN, rW, rN, rW, rW, rW];
      fl.paths.push(flowPath(P, ar, "SW")); fl.paths[0].next = [{ p: 0, w: () => 1 }];
      for (let i = 1; i < P.length; i++) pipeSeg(T, root, P[i - 1], P[i], rad[i - 1], 0x9ec9ff, i === 3 || i === 5 ? 0.45 : 0.28);
      addPump(T, root, fl, -14, y0, 0, c);
      addValve(T, root, fl, -11.2, y0, zt, "water");
      addStand(T, root, fl, -12.6, zt - 2.2, y0, "펌프 출구", 0x3aa7ff, () => res.Vterm);
      addStand(T, root, fl, xa - 0.8, zt - 2.2, y0, "A", 0x3aa7ff, () => Va);
      addStand(T, root, fl, (x1 + xb) / 2, zt - 2.2, y0, "B", 0x3aa7ff, () => Va - by.R1.V);
      addStand(T, root, fl, x2 + 1.2, zt - 2.2, y0, "C", 0x3aa7ff, () => Va - by.R1.V - by.R2.V);
      fl.labels.v1 = mkLabel(T, root, "", "#ffd1a1", (xa + x1) / 2, y0 + 1.6, zt + 3.4, 7); fl.labels.v2 = mkLabel(T, root, "", "#ffd1a1", (xb + x2) / 2 + 1, y0 + 1.6, zt + 3.4, 7);
      // 등가 관: 길이 L1+L2
      const gz = 12.5; pipeSeg(T, root, V3(xa, y0, gz), V3(xa + L1 + L2, y0, gz), rN, 0xffd166, 0.55);
      pipeSeg(T, root, V3(xa, y0, gz), V3(xa + L1, y0, gz), rN + 0.08, 0xf4a261, 0.5);
      mkLabel(T, root, "등가 관 = 길이가 이어 붙음 (L₁+L₂)", "#ffd166", xa + (L1 + L2) / 2, y0 + 2.2, gz, 9);
    } else {
      const aR = r => Math.max(0.18, Math.min(0.8, 0.5 * Math.sqrt(10 / r)));
      const r1 = aR(c.R1), r2 = aR(c.R2), zt = -6, zm = -1, zb = 6;
      const P0 = [V3(-14, y0, zb), V3(-14, y0, zt), V3(-6, y0, zt)];
      const P1 = [V3(-6, y0, zt), V3(-4, y0, zt), V3(6, y0, zt), V3(8, y0, zt), V3(8, y0, zm)];
      const P2 = [V3(-6, y0, zt), V3(-6, y0, zm), V3(-4, y0, zm), V3(6, y0, zm), V3(8, y0, zm)];
      const P3 = [V3(8, y0, zm), V3(8, y0, zb), V3(-14, y0, zb)];
      const mk = (pts, ar, ref) => { const p = flowPath(pts, ar, ref); fl.paths.push(p); return p; };
      const p0 = mk(P0, [W_AREA, W_AREA], "SW"), p1 = mk(P1, [W_AREA, _arA(r1), W_AREA, W_AREA], "R1"), p2 = mk(P2, [W_AREA, W_AREA, _arA(r2), W_AREA], "R2"), p3 = mk(P3, [W_AREA, W_AREA], "SW");
      p0.next = [{ p: 1, w: () => Math.abs(by.R1.I) }, { p: 2, w: () => Math.abs(by.R2.I) }]; p1.next = [{ p: 3, w: () => 1 }]; p2.next = [{ p: 3, w: () => 1 }]; p3.next = [{ p: 0, w: () => 1 }];
      const rd = (p, rr) => { for (let i = 1; i < p.pts.length; i++) pipeSeg(T, root, p.pts[i - 1], p.pts[i], rr[i - 1], 0x9ec9ff, rr[i - 1] < rW ? 0.5 : 0.28); };
      rd(p0, [rW, rW]); rd(p1, [rW, r1, rW, rW]); rd(p2, [rW, rW, r2, rW]); rd(p3, [rW, rW]);
      addPump(T, root, fl, -14, y0, 0, c);
      addValve(T, root, fl, -10.8, y0, zt, "water");

function stepFlow(fl, res, dt) {
  const K = 16;

  fl.part.forEach((pt, k) => {
    const p = fl.paths[pt.p], Iabs = Math.abs(res.by[p.ref].I);
    let i = 1; while (i < p.cum.length - 1 && p.cum[i] <= pt.u) i++;
    const a = p.areas[i - 1], v = VMAX * Math.tanh(K * Iabs / (a * VMAX)) * Math.sign(res.by[p.ref].I || 1);

      if (nx.length === 1 || tot <= 1e-9) pt.p = nx[0].p; else { let r = Math.random() * tot, j = 0; while (j < nx.length - 1 && r > nx[j].w()) { r -= nx[j].w(); j++; } pt.p = nx[j].p; }

    const pp = fl.paths[pt.p]; let j = 1; while (j < pp.cum.length - 1 && pp.cum[j] <= pt.u) j++;
    const t = (pt.u - pp.cum[j - 1]) / ((pp.cum[j] - pp.cum[j - 1]) || 1), A = pp.pts[j - 1], B = pp.pts[j];

    fl.inst.setMatrixAt(k, m);

}

function bulbState(P) {

    <li><b>속도</b>: 도선 속 전자의 평균 이동 속도(표류 속도)는 매우 느리다. 전구가 바로 켜지는 것은 전기장이 도선 전체에 빠르게 퍼지기 때문. 모형의 물·공은 눈에 보이게 빠르다.</li>
    <li><b>저항의 공식</b>: 도선은 R = ρL/A. 실제 물 파이프(푸아죄유)는 반지름의 4제곱에 반비례해 수치가 다르다. 이 모형은 R ∝ 길이/단면적만 따라 그렸다.</li>

    <li><b>물</b>: 관 밖으로 새거나 튈 수 있지만 전류는 도선 밖으로 새지 않는다. 물은 압력이 모든 방향으로 작용한다.</li></ul></div></div>
  <div class="mut">지금 설정 → ε=${c.emf.toFixed(1)} V, R₁=${c.R1} Ω, R₂=${c.R2} Ω, r=${c.r.toFixed(1)} Ω · I=${Math.abs(res.by.SW.I).toFixed(3)} A · P₁=${Math.abs(res.by.R1.P).toFixed(2)} W, P₂=${Math.abs(res.by.R2.P).toFixed(2)} W</div></div>`;

    out.push(["병렬 I₁:I₂=R₂:R₁", near(r.by.R1.I / r.by.R2.I, 2, 0.01), "I₁/I₂=" + (r.by.R1.I / r.by.R2.I).toFixed(4)]);
    r = ev({ target: 2, r: 2 });
    out.push(["내부저항: V단자=ε−Ir", near(r.by.VM.V, 6 - 2 * r.by.AM.I, 0.003), "V=" + r.by.VM.V.toFixed(3) + ", ε−Ir=" + (6 - 2 * r.by.AM.I).toFixed(3)]);
    r = ev({ target: 2, sw: false });
    out.push(["스위치 열림: I=0, 전압계=ε", Math.abs(r.by.AM.I) < 1e-6 && near(r.by.VM.V, 6, 0.001), "I=" + r.by.AM.I.toExponential(1) + " V=" + r.by.VM.V.toFixed(3)]);
    r = ev({ vm: 1 });
    out.push(["전압계 직렬 오연결: I≈0, V≈ε", Math.abs(r.by.AM.I) < 1e-4 && near(r.by.VM.V, 6, 0.001), "I=" + r.by.AM.I.toExponential(1) + " V=" + r.by.VM.V.toFixed(3)]);
    r = ev({ am: 1 });
    out.push(["전류계 병렬 오연결: R₁ 단락", Math.abs(r.by.R1.I) < 0.002 && near(r.by.SW.I, 0.3, 0.01), "I_R1=" + r.by.R1.I.toFixed(4) + ", I=" + r.by.SW.I.toFixed(3)]);
    r = ev({ am: 1, target: 2 });
    out.push(["전지 단락: 과전류", Math.abs(r.by.AM.I) > 3, "I=" + r.by.AM.I.toFixed(0) + " A"]);
    r = ev({}); const Pin = r.Ibat * 6 - r.Ibat * r.Ibat * 0, Psum = r.by.R1.P + r.by.R2.P;
    out.push(["에너지 보존 ε·I=ΣP", near(Pin, Psum, 0.01), "ε·I=" + Pin.toFixed(4) + " ΣP=" + Psum.toFixed(4)]);
    const w = ev({ topo: "series", noMeter: true }); out.push(["계기 없는 회로 해석", near(w.by.R1.I, 0.2, 0.003), "I=" + w.by.R1.I.toFixed(4)]);
    const plan = buildPlan(Object.assign({}, base, { topo: "parallel", target: 1, am: 1, vm: 1 }));
    out.push(["배치 계획: 모든 부품 생성", ["BAT", "SW", "R1", "R2", "AM", "VM"].every(id => plan.parts.some(p => p.id === id)), plan.parts.map(p => p.id).join(",")]);
    return out;
  },
};

</script>
<script>
"use strict";
/* ============================ 공용 UI 프레임워크 (템플릿) ============================ */
(function () {
  const C = WS_CONFIG;
  const $ = (id) => document.getElementById(id);
  const P = {};
  const ui = { tab: C.tabs[0].id, scenarioId: null, playing: false };
  const lastScenarioOfTab = {};

  function addDefaults(params) { (params || []).forEach(p => { if (!(p.key in P)) P[p.key] = p.value; }); }
  C.scenarios.forEach(s => { addDefaults(s.params); addDefaults(s.choices); });
  if (C.common_params) addDefaults(C.common_params.params);

  function current() { return C.scenarios.find(s => s.id === ui.scenarioId); }
  function scenariosOfTab(tab) { return C.scenarios.filter(s => s.tab === tab); }
  function fmtVal(v, unit) {
    if (!unit) return String(v);
    return /^[°%′″]/.test(unit) ? v + unit : v + " " + unit;
  }

  function showError(where, e) {
    const box = $("simError");
    box.hidden = false;
    box.textContent = "시뮬레이션 오류 (" + where + "): " + (e && e.message ? e.message : e);
    console.error(e);
  }
  const SIMOBJ = (typeof SIM !== "undefined") ? SIM : null;
  function call(hook, ...args) {
    if (!SIMOBJ || typeof SIMOBJ[hook] !== "function") return undefined;
    try { return SIMOBJ[hook](api, ...args); } catch (e) { showError(hook, e); return undefined; }
  }

  /* ---------- 렌더러 ---------- */
  const wrap = $("sceneWrap");
  const api = {
    config: C, P,
    get scenario() { return current(); },
    get tab() { return ui.tab; },
    get playing() { return ui.playing; },
    setPlaying(b) { ui.playing = !!b; updatePlayButton(); },
    boxHalf: (C.scene && C.scene.box_half) || 16,
    sceneEl: wrap,
    THREE: window.THREE || null,
    scene: null, camera: null, renderer: null, controls: null,
    canvas: null, ctx: null, width: 0, height: 0,
    custom: $("customPanel"),
    chart: {
      canvas: $("chartCanvas"),
      ctx: $("chartCanvas").getContext("2d"),
      setHint(html) { $("chartHint").innerHTML = html; },
    },
    setReadout(rows) {
      const tbl = $("readout");
      tbl.innerHTML = "";
      (rows || []).forEach(r => {
        const tr = document.createElement("tr");
        const a = document.createElement("td"); a.textContent = r[0];
        const b = document.createElement("td"); b.textContent = r[1];
        tr.append(a, b); tbl.appendChild(tr);
      });
    },
    setNote(text) { $("readoutNote").textContent = text || ""; },
    setStatus(text) { const el = $("wsStatus"); if (el) el.textContent = text || ""; },
    setParam(key, v) {
      P[key] = v;
      const el = $("p_" + key); if (el) el.value = v;
      const vEl = $("p_" + key + "_val"); if (vEl) vEl.textContent = fmtVal(v, vEl.dataset.unit);
    },
    refresh() { call("update"); },
  };

  function initRenderer() {
    const sc = C.scene || {};
    if (C.renderer === "three") {
      if (!window.THREE) { showError("init", "Three.js를 불러오지 못했습니다 (인터넷 연결 확인)"); return false; }
      const T = window.THREE;
      api.scene = new T.Scene();
      api.camera = new T.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 500);
      const cp = sc.camera || [26, 20, 30];
      api.camera.position.set(cp[0], cp[1], cp[2]);
      api.renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
      api.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      wrap.insertBefore(api.renderer.domElement, wrap.firstChild);
      api.controls = new T.OrbitControls(api.camera, api.renderer.domElement);
      api.controls.enableDamping = true;
      api.controls.dampingFactor = 0.08;
      api.controls.target.set(0, 0, 0);
      api.scene.add(new T.AmbientLight(0xffffff, 0.55));
      const dl = new T.DirectionalLight(0xffffff, 0.9);
      dl.position.set(20, 30, 15);
      api.scene.add(dl);
      if (sc.grid !== false) api.scene.add(new T.GridHelper(api.boxHalf * 2, 16, 0x3a5a8a, 0x1f3352));
      if (sc.axes !== false) api.scene.add(new T.AxesHelper(api.boxHalf * 0.6));
    } else {
      api.canvas = document.createElement("canvas");
      wrap.insertBefore(api.canvas, wrap.firstChild);
      api.ctx = api.canvas.getContext("2d");
    }
    window.addEventListener("resize", onResize);
    onResize();
    return true;
  }

  function onResize() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    api.width = w; api.height = h;
    if (api.renderer) {
      api.camera.aspect = w / h;
      api.camera.updateProjectionMatrix();
      api.renderer.setSize(w, h);
    } else if (api.canvas) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      api.canvas.width = Math.round(w * dpr);
      api.canvas.height = Math.round(h * dpr);
      api.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (ui.scenarioId) call("update");
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    if (api.controls) api.controls.update();
    call("frame", 1 / 60);
    if (api.renderer) api.renderer.render(api.scene, api.camera);
  }

  /* ---------- UI ---------- */
  function renderTabs() {
    const box = $("tabs");
    box.innerHTML = "";
    box.hidden = C.tabs.length < 2;
    C.tabs.forEach(t => {
      const b = document.createElement("button");
      b.textContent = t.label;
      b.className = t.id === ui.tab ? "active" : "";
      b.addEventListener("click", () => switchTab(t.id));
      box.appendChild(b);
    });
  }

  function renderPicker() {
    const box = $("scenarioPicker");
    const list = scenariosOfTab(ui.tab);
    box.innerHTML = "";
    box.hidden = list.length < 2;
    list.forEach(s => {
      const b = document.createElement("button");
      b.textContent = s.name;
      b.className = s.id === ui.scenarioId ? "active" : "";
      b.addEventListener("click", () => selectScenario(s.id));
      box.appendChild(b);
    });
  }

  function sliderEl(p) {
    const div = document.createElement("div");
    div.className = "param";
    const label = document.createElement("label");
    label.textContent = p.label + " ";
    const val = document.createElement("span");
    val.className = "val"; val.id = "p_" + p.key + "_val"; val.dataset.unit = p.unit || "";
    val.textContent = fmtVal(P[p.key], p.unit);
    label.appendChild(val);
    const inp = document.createElement("input");
    inp.type = "range"; inp.id = "p_" + p.key;
    inp.min = p.min; inp.max = p.max; inp.step = p.step; inp.value = P[p.key];
    inp.addEventListener("input", () => {
      const v = parseFloat(inp.value);
      P[p.key] = v;
      val.textContent = fmtVal(v, p.unit);
      call("update");
    });
    div.append(label, inp);
    return div;
  }

  function choiceEl(c) {
    const row = document.createElement("div");
    row.className = "row"; row.style.marginBottom = "8px";
    if (c.label) { const l = document.createElement("b"); l.style.fontSize = "0.9em"; l.textContent = c.label; row.appendChild(l); }
    c.options.forEach(o => {
      const b = document.createElement("button");
      b.textContent = o.label;
      b.className = P[c.key] === o.value ? "primary" : "";
      b.addEventListener("click", () => {
        P[c.key] = o.value;
        row.querySelectorAll("button").forEach(x => x.className = "");
        b.className = "primary";
        call("update");
      });
      row.appendChild(b);
    });
    return row;
  }

  function renderControls() {
    const s = current();
    const body = $("scenarioBody");
    body.innerHTML = "";
    if (s.desc || s.section) {
      const p = document.createElement("p");
      p.className = "hint"; p.style.marginBottom = "10px";
      if (s.section) { const b = document.createElement("b"); b.textContent = s.section; p.appendChild(b); if (s.desc) p.appendChild(document.createTextNode(" — ")); }
      if (s.desc) p.appendChild(document.createTextNode(s.desc));
      body.appendChild(p);
    }
    (s.choices || []).forEach(c => body.appendChild(choiceEl(c)));
    (s.params || []).forEach(p => body.appendChild(sliderEl(p)));
    if (s.animated) {
      const st = document.createElement("div");
      st.className = "hint"; st.id = "wsStatus";
      st.textContent = s.status_hint || "";
      body.appendChild(st);
      const row = document.createElement("div");
      row.className = "controls-row";
      const play = document.createElement("button");
      play.id = "playBtn"; play.className = "primary";
      play.addEventListener("click", () => { ui.playing = !ui.playing; updatePlayButton(); });
      const reset = document.createElement("button");
      reset.textContent = "↺ 리셋";
      reset.addEventListener("click", () => { ui.playing = false; updatePlayButton(); call("reset"); call("update"); });
      row.append(play, reset);
      body.appendChild(row);
      updatePlayButton();
    }
    const cp = C.common_params;
    if (cp && s.use_common !== false) {
      const hr = document.createElement("hr");
      hr.style.cssText = "margin:10px 0;border:none;border-top:1px solid var(--border)";
      body.appendChild(hr);
      if (cp.title) { const b = document.createElement("b"); b.style.fontSize = "0.9em"; b.textContent = cp.title; body.appendChild(b); }
      cp.params.forEach(p => body.appendChild(sliderEl(p)));
    }
  }

  function updatePlayButton() {
    const b = $("playBtn");
    if (b) b.textContent = ui.playing ? "⏸ 일시정지" : "▶ 재생";
  }

  function renderFormula() {
    const s = current();
    const body = $("formulaBody");
    body.innerHTML = (s.formula || []).map(f =>
      (f.eq_html ? `<div class="eq">${f.eq_html}</div>` : "") + (f.text_html || "")
    ).join("");
  }

  function renderMisconception() {
    const s = current();
    const panel = $("misconceptionPanel");
    panel.innerHTML = "";
    panel.hidden = !s.misconception;
    if (!s.misconception) return;
    const box = document.createElement("div");
    box.className = "misconception";
    const b = document.createElement("b");
    b.textContent = s.misconception_title || "💡 흔한 오개념";
    box.append(b, document.createElement("br"), document.createTextNode(s.misconception));
    panel.appendChild(box);
  }

  function enterScenario() {
    ui.playing = false;
    const s = current();
    $("graphPanel").hidden = !s.chart;
    $("chartHint").innerHTML = "";
    api.custom.innerHTML = "";
    api.setReadout([]); api.setNote("");
    renderPicker(); renderControls(); renderFormula(); renderMisconception();
    call("enter");
    call("update");
  }

  function selectScenario(id) {
    ui.scenarioId = id;
    lastScenarioOfTab[ui.tab] = id;
    enterScenario();
  }

  function switchTab(tab) {
    ui.tab = tab;
    renderTabs();
    selectScenario(lastScenarioOfTab[tab] || scenariosOfTab(tab)[0].id);
  }

  function renderLegend() {
    const box = $("legend");
    (C.legend || []).forEach(l => {
      const span = document.createElement("span");
      const sw = document.createElement("i");
      sw.className = "swatch" + (l.shape === "bar" ? " bar" : "");
      sw.style.background = l.color;
      span.append(sw, document.createTextNode(l.label));
      box.appendChild(span);
    });
  }

  function runSelfTests() {
    if (!SIMOBJ || typeof SIMOBJ.tests !== "function") { console.log("물리 검증 항목 없음"); return; }
    let results = [];
    try { results = SIMOBJ.tests() || []; } catch (e) { showError("tests", e); return; }
    console.log("=== " + C.title + " 물리 검증 ===");
    let pass = 0;
    for (const [name, ok, detail] of results) {
      console.log(`[${ok ? "PASS" : "FAIL"}] ${name}${detail ? " — " + detail : ""}`);
      if (ok) pass++;
    }
    console.log(pass === results.length ? "모든 검증 통과" : "일부 검증 실패 — 콘솔 확인 필요");
    window.__wsSelfTest = { pass, total: results.length };
  }

  /* ---------- 시작 ---------- */
  $("readoutTitle").textContent = C.readout_title || "측정값";
  $("hoverHint").textContent = (C.scene && C.scene.hint != null) ? C.scene.hint
    : (C.renderer === "three" ? "마우스 드래그: 회전 · 휠: 확대/축소" : "");
  $("projectorBtn").addEventListener("click", () => document.body.classList.toggle("projector"));
  renderLegend();
  if (!SIMOBJ) showError("load", "sim_js에 SIM 객체가 정의되지 않았습니다");
  if (initRenderer()) {
    call("init");
    renderTabs();
    switchTab(ui.tab);
    animate();
  }
  runSelfTests();
})();
</script>
