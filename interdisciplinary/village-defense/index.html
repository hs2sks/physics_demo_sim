<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>시대를 건너는 마을 수비대</title>
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

<!-- 메뉴 -->
<section id="scr-menu" class="screen active">
  <a class="homelink" href="../../index.html">🏠 홈</a>
  <div class="title">
    <div class="pix-sub">포물선 운동 디펜스</div>
    <h1>시대를 건너는<br>마을 수비대</h1>
    <canvas id="menu-art" width="192" height="64"></canvas>
  </div>
  <form id="profile" class="card" autocomplete="off">
    <label>닉네임 <small>(2~10자, 실명·학번은 쓰지 마세요)</small>
      <input id="in-nick" maxlength="10" placeholder="예: 돌팔매왕" required></label>
    <label>반 코드 <small>(선생님이 알려 준 글자, 없으면 비워 두세요)</small>
      <input id="in-cls" maxlength="12" placeholder="예: 물리A"></label>
    <div id="net-status" class="small"></div>
    <div class="row">
      <button type="submit" class="btn big">▶ 시작하기</button>
    </div>
    <div class="row">
      <button type="button" id="btn-rank-menu" class="btn">🏆 랭킹</button>
      <button type="button" id="btn-help" class="btn">📖 도움말</button>
    </div>
    <div id="form-err" class="err"></div>
  </form>
</section>

<!-- 스테이지 선택 -->
<section id="scr-stages" class="screen">
  <header class="bar">
    <a class="homelink" href="../../index.html">🏠 홈</a>
    <div id="who" class="who"></div>
    <button id="btn-rank" class="btn sm">🏆 랭킹</button>
    <button id="btn-menu" class="btn sm">⚙ 닉네임</button>
  </header>
  <div class="sumline"><span id="sum-score">0점</span> · <span id="sum-stars">★ 0 / 36</span><span id="sum-rank"></span></div>
  <div id="worlds"></div>
</section>

<!-- 플레이 -->
<section id="scr-play" class="screen">
  <div class="hud">
    <a class="homelink mini" href="../../index.html" title="홈">🏠</a>
    <div id="hud-name" class="hud-name"></div>
    <div id="hud-hp" class="hud-hp"></div>
    <div id="hud-ammo" class="hud-item"></div>
    <div id="hud-kill" class="hud-item"></div>
    <button id="btn-pause" class="btn sm" title="일시정지">Ⅱ</button>
    <button id="btn-quit" class="btn sm" title="나가기">✕</button>
  </div>
  <div id="infoline" class="infoline"></div>
  <div class="playgrid">
    <div class="stagebox">
      <canvas id="cv" width="384" height="216"></canvas>
      <div id="floats"></div>
      <div id="pausemask" class="pausemask">⏸ 일시정지<br><small>계산할 시간이 필요하면 언제든 멈춰요</small><br><button id="btn-resume" class="btn">계속하기</button></div>
    </div>
    <div class="panel">
      <div class="ctl" id="ctl-angle">
        <div class="ctl-top"><span>각도</span><b id="val-angle">45°</b><span class="lock" id="lock-angle">🔒</span></div>
        <div class="ctl-row"><button class="btn sm" data-d="-1" data-k="angle">−</button><input type="range" id="rng-angle" min="5" max="85" step="1"><button class="btn sm" data-d="1" data-k="angle">＋</button></div>
      </div>
      <div class="ctl" id="ctl-speed">
        <div class="ctl-top"><span>속력</span><b id="val-speed">15 m/s</b><span class="lock" id="lock-speed">🔒</span></div>
        <div class="ctl-row"><button class="btn sm" data-d="-1" data-k="speed">−</button><input type="range" id="rng-speed" min="5" max="30" step="1"><button class="btn sm" data-d="1" data-k="speed">＋</button></div>
      </div>
      <div class="ctl" id="ctl-charge">
        <div class="ctl-top"><span>입자 전하</span><b id="val-charge"></b></div>
        <div class="ctl-row two"><button class="btn sm pos" id="btn-qpos">＋ 입자</button><button class="btn sm neg" id="btn-qneg">− 입자</button></div>
      </div>
      <label class="predict"><span>예상 사거리 d <small>(선택)</small></span><span><input id="in-pred" type="number" inputmode="decimal" step="0.5"> m</span></label>
      <div class="row">
        <button id="btn-hint" class="btn sm">💡 힌트</button>
        <button id="btn-fire" class="btn fire">발사!</button>
      </div>
      <div id="hintbox" class="hintbox"></div>
    </div>
  </div>
</section>

<!-- 모달: 스테이지 소개 / 결과 / 랭킹 / 도움말 -->
<div id="modal" class="modal"><div class="modal-card" id="modal-card"></div></div>

<script src="js/physics.js?v=1"></script>
<script src="js/stages.js?v=1"></script>
<script src="js/sprites.js?v=1"></script>
<script src="js/game.js?v=1"></script>
<script src="js/ranking.js?v=1"></script>
<script src="js/ui.js?v=1"></script>
</body>
</html>
