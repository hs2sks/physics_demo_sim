<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케플러 법칙에서 만유인력으로</title>
<style>
  :root {
    --bg: #f4f6fa; --panel: #ffffff; --ink: #1c2733; --sub: #5a6b7d;
    --accent: #1f6fd6; --accent2: #d64545; --ok: #1e8f4e;
    --border: #d7dee8; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink);
    padding: 12px; font-size: 15px;
  }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  header h1 { font-size: 1.25em; }
  header .spacer { flex: 1; }
  a.home { text-decoration:none; color:var(--sub); border:1px solid var(--border); padding:6px 12px; border-radius:8px; font-size:0.9em; white-space:nowrap; }

  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button { flex: 0 0 auto; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 1em; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .layout { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .sim-col { flex: 2 1 480px; display: flex; flex-direction: column; gap: 12px; }
  .side-col { flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px; }

  #sceneWrap { position: relative; width: 100%; aspect-ratio: 16/10; border-radius: 8px; overflow: hidden; background: radial-gradient(circle at 50% 30%, #16233a, #060a12 75%); }
  #sceneWrap canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hoverHint { position:absolute; left:8px; bottom:8px; color:#9fb3d9; font-size:0.78em; background:rgba(6,10,18,0.55); padding:4px 8px; border-radius:6px; pointer-events:none; }
  #hoverHint:empty { display: none; }
  #simError { position:absolute; left:8px; right:8px; top:8px; color:#fff; background:rgba(214,69,69,0.92); padding:6px 10px; border-radius:6px; font-size:0.82em; white-space:pre-wrap; }

  .scenario-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .scenario-picker button { flex: 1 1 30%; min-width: 120px; padding: 8px 6px; font-size: 0.86em; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  .scenario-picker button.active { background: #eaf1fd; border-color: var(--accent); color: var(--accent); font-weight: 700; }

  .param { margin-bottom: 10px; }
  .param label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; font-size: 0.92em; }
  .param label .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  .param input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--sub); font-size: 0.83em; margin-top: 2px; line-height: 1.5; }

  button { font-size: 1em; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.warn { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .controls-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.82em; color: var(--sub); margin-top: 8px; }
  .legend:empty { display: none; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .swatch.bar { border-radius: 2px; }

  table.readout { width: 100%; border-collapse: collapse; font-size: 0.92em; }
  table.readout td { padding: 4px 2px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  table.readout td:first-child { color: var(--sub); }
  table.readout td:last-child { text-align: right; font-weight: 700; }

  details { margin-top: 6px; }
  summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
  .formula-body { padding: 8px 2px; line-height: 1.8; font-size: 0.92em; }
  .formula-body .eq { font-size: 1.08em; text-align: center; margin: 6px 0; font-family: Georgia, serif; }
  .note { border-left: 3px solid var(--accent); background: #eef4fd; padding: 8px 10px; border-radius: 6px; font-size: 0.86em; margin-top: 8px; line-height: 1.6; }
  .note:empty { display: none; }
  .misconception { border-left: 3px solid var(--accent2); background: #fdeeee; padding: 8px 10px; border-radius: 6px; font-size: 0.86em; margin-top: 8px; line-height: 1.6; }

  canvas.chart { width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 6px; }

  body.projector { font-size: 19px; }
  body.projector button { padding: 12px 18px; }
  body.projector .scenario-picker button { font-size: 1em; padding: 12px 8px; }

  @media (max-width: 720px) {
    body { font-size: 16px; padding: 8px; }
    .layout { flex-direction: column; }
    .sim-col, .side-col { flex: 1 1 100%; }
    button { padding: 11px 14px; }
    input[type=range] { height: 26px; }
  }
/* ---- 레시피 입력 extra_css ---- */
.qz-head{font-weight:700;margin:4px 0 10px;color:#e3ecff}.qz-card{border:1px solid rgba(160,190,255,.25);border-radius:10px;padding:12px;margin-bottom:10px;background:rgba(15,26,51,.6)}.qz-q{font-weight:600;margin-bottom:8px;color:#e3ecff;line-height:1.5}.qz-opt{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid rgba(160,190,255,.3);border-radius:8px;background:transparent;color:#e3ecff;cursor:pointer;font:inherit}.qz-opt:hover:not(:disabled){background:rgba(122,169,255,.15)}.qz-opt.ok{border-color:#5eead4;background:rgba(94,234,212,.18)}.qz-opt.bad{border-color:#ff5d73;background:rgba(255,93,115,.18)}.qz-opt:disabled{cursor:default}.qz-ex{margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(255,209,102,.12);color:#e3ecff;line-height:1.5}.qz-reset{padding:8px 14px;border:1px solid rgba(160,190,255,.4);border-radius:8px;background:transparent;color:#e3ecff;cursor:pointer;font:inherit}
</style>
</head>

<header>
  
  <h1>🪐 케플러 법칙에서 만유인력으로</h1>
  <span class="spacer"></span>
  <button id="projectorBtn" title="프로젝터용 큰 글씨 모드">🖥 큰 글씨 모드</button>
</header>

<div class="tabs" id="tabs"></div>

<div class="layout">

  <div class="sim-col">
    <div class="panel">

        <div id="simError" hidden></div>
      </div>

    </div>

    <div class="panel" id="graphPanel" hidden>

    </div>
  </div>

  <div class="side-col">

    <div class="panel" id="scenarioPanel">
      <div class="scenario-picker" id="scenarioPicker"></div>
      <div id="scenarioBody"></div>
      <div id="customPanel"></div>
    </div>

    <div class="panel" id="readoutPanel">
      <b id="readoutTitle"></b>
      <table class="readout" id="readout"></table>
      <div class="note" id="readoutNote"></div>
    </div>

    <div class="panel">
      <details id="formulaDetails">
        <summary>📐 관련 공식 보기</summary>

      </details>
    </div>

    <div class="panel" id="misconceptionPanel"></div>

  </div>
</div>

/* ============================ 시뮬레이션 코드 (레시피 입력 sim_js) ============================ */
const DEG = Math.PI / 180, TAU = 2 * Math.PI;
/* SI 기준값 (검증용): 1 AU, 1 년(율리우스년), 태양의 GM */
const AU = 1.495978707e11, YR = 3.15576e7, GMS = 1.32712440018e20;
const V0 = TAU * AU / YR / 1000;     // 1 AU 원궤도 속력 (km/s) ≈ 29.78
const A0 = GMS / (AU * AU);          // 1 AU에서 중력 가속도 (m/s²)
const PLANETS = [['수성', 0.387, 0.241], ['금성', 0.723, 0.615], ['지구', 1.0, 1.0], ['화성', 1.524, 1.881],
  ['목성', 5.204, 11.862], ['토성', 9.582, 29.457], ['천왕성', 19.201, 84.011], ['해왕성', 30.047, 164.79]];

/* ===== 물리 계산 (DOM 없음) ===== */
const Tof = (a, M) => Math.sqrt(a * a * a / M);   // 제3법칙 (a: AU, M: 태양질량, T: 년)
const KEP = {
  solveE(Mn, e) { // 케플러 방정식 E − e sinE = M (뉴턴 반복)
    Mn = ((Mn % TAU) + TAU) % TAU; let E = e < 0.8 ? Mn : Math.PI;
    for (let i = 0; i < 60; i++) { const d = (E - e * Math.sin(E) - Mn) / (1 - e * Math.cos(E)); E -= d; if (Math.abs(d) < 1e-13) break; }
    return E;
  },
  nu(t, e) { // t: 근일점 통과 후 경과 시간(주기 단위) → 누적 진근점이각 ν (연속)
    const n = Math.floor(t), E = this.solveE(TAU * (t - n), e);
    let v = 2 * Math.atan2(Math.sqrt(1 + e) * Math.sin(E / 2), Math.sqrt(1 - e) * Math.cos(E / 2));
    if (v < 0) v += TAU;
    return v + TAU * n;
  },
  r(nu, e, a = 1) { return a * (1 - e * e) / (1 + e * Math.cos(nu)); },
  area(n1, n2, e, a = 1) { // 태양–행성 선분이 ν1→ν2 동안 쓴 면적 ½∫r²dν (심프슨)
    const N = 400, h = (n2 - n1) / N; let s = 0;
    for (let i = 0; i <= N; i++) { const r = this.r(n1 + i * h, e, a); s += (i === 0 || i === N ? 1 : i % 2 ? 4 : 2) * r * r; }
    return 0.5 * s * h / 3;
  },
  speed(r, a, M = 1) { return V0 * Math.sqrt(M * (2 / r - 1 / a)); },   // 비스-비바 식, km/s
  areaRate(t, e) { const h = 1e-5, r = this.r(this.nu(t, e), e); return 0.5 * r * r * (this.nu(t + h, e) - this.nu(t - h, e)) / (2 * h); }, // AU²/yr

function gravCalc(r, M, m) { // 반지름 r(AU) 원궤도, 중심별 M(M☉), 행성 m(지구질량)
  const T = Tof(r, M);
  const v = TAU * r * AU / (T * YR) / 1000;            // v = 2πr/T (km/s)
  const ac = (v / V0) ** 2 / r;                         // 구심 가속도 / A0
  return { T, v, ac, Fc: m * ac, Fg: M * m / (r * r) };  // 구심력 m v²/r, 만유인력 GMm/r² (지구–태양 = 1)
}

/* ===== 그리기 도우미 ===== */
const COL = { bg: '#0f1a33', grid: 'rgba(160,190,255,.15)', text: '#e3ecff', dim: '#9db0d8', v: '#5eead4', F: '#ffd166', area: '#7aa9ff', sun: '#ff8f7a', net: '#ff5d73' };
function clear(ctx, w, h) { ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, w, h); }
function arrow(ctx, x0, y0, x1, y1, col, label, lw = 4) {
  const len = Math.hypot(x1 - x0, y1 - y0); if (len < 2) return;
  const a = Math.atan2(y1 - y0, x1 - x0), hd = Math.min(16, len * .45);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - Math.cos(a) * hd * .7, y1 - Math.sin(a) * hd * .7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - hd * Math.cos(a - .42), y1 - hd * Math.sin(a - .42)); ctx.lineTo(x1 - hd * Math.cos(a + .42), y1 - hd * Math.sin(a + .42)); ctx.closePath(); ctx.fill();
  if (label) { ctx.font = '600 17px sans-serif'; ctx.fillText(label, x1 + 8 * Math.cos(a) + 4, y1 + 8 * Math.sin(a) + 6); }
}
function text(ctx, s, x, y, col = COL.text, size = 17, align = 'left') { ctx.font = `600 ${size}px sans-serif`; ctx.fillStyle = col; ctx.textAlign = align; ctx.fillText(s, x, y); ctx.textAlign = 'left'; }
function disc(ctx, x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function star(ctx, x, y, r) { const g = ctx.createRadialGradient(x, y, 1, x, y, r * 2.4); g.addColorStop(0, 'rgba(255,200,110,.85)'); g.addColorStop(1, 'rgba(255,200,110,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.4, 0, TAU); ctx.fill(); disc(ctx, x, y, r, '#ffc766'); }
const f1 = v => v.toFixed(1), f2 = v => v.toFixed(2), f3 = v => v.toFixed(3);
const nice = m => { const p = 10 ** Math.floor(Math.log10(m)), f = m / p; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p; };
const fmtTick = v => (Math.abs(v) >= 1000 ? String(Math.round(v)) : String(+v.toPrecision(3)));

/* ===== 상태 ===== */
const S = { t: 0, th: 0 };
function resetState() { S.t = 0; S.th = 0; }

/* ===== ① 타원 궤도 · 면적속도 ===== */
function drawEllipse(api) {
  const { ctx, width: w, height: h, P } = api; clear(ctx, w, h);
  const e = P.ecc, b = Math.sqrt(1 - e * e), s = h * 0.43, cx = w * 0.5, cy = h * 0.52;
  const sx = cx + e * s, sy = cy;                       // 태양: 오른쪽 초점 (근일점이 오른쪽)
  const pt = nu => { const r = KEP.r(nu, e); return [sx + s * r * Math.cos(nu), sy - s * r * Math.sin(nu)]; };
  const nuNow = KEP.nu(S.t, e), r = KEP.r(nuNow, e), cur = Math.floor((((S.t % 1) + 1) % 1) * 12);
  const bounds = []; for (let k = 0; k <= 12; k++) bounds.push(k === 12 ? KEP.nu(1, e) : KEP.nu(k / 12, e));
  if (P.area === 'on') {
    for (let k = 0; k < 12; k++) {
      ctx.fillStyle = k === cur ? 'rgba(122,169,255,.55)' : (k % 2 ? 'rgba(122,169,255,.14)' : 'rgba(122,169,255,.26)');
      ctx.beginPath(); ctx.moveTo(sx, sy);
      for (let i = 0; i <= 24; i++) { const p = pt(bounds[k] + (bounds[k + 1] - bounds[k]) * i / 24); ctx.lineTo(p[0], p[1]); }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(160,190,255,.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx, sy); const q = pt(bounds[k]); ctx.lineTo(q[0], q[1]); ctx.stroke();
    }
  }
  ctx.strokeStyle = COL.dim; ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i <= 180; i++) { const p = pt(TAU * i / 180); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
  ctx.stroke();
  // 타원의 중심 C, 빈 초점 F₂, 태양(초점 F₁)
  ctx.strokeStyle = COL.dim; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx - 6, cy); ctx.lineTo(cx + 6, cy); ctx.moveTo(cx, cy - 6); ctx.lineTo(cx, cy + 6); ctx.stroke();
  text(ctx, '중심 C', cx - 18, cy + 24, COL.dim, 14);
  disc(ctx, cx - e * s, cy, 4, COL.dim); if (e > 0.05) text(ctx, '빈 초점', cx - e * s - 24, cy + 24, COL.dim, 14);
  star(ctx, sx, sy, 11); if (e > 0.05) text(ctx, '태양(초점)', sx - 28, sy + 36, COL.sun, 14);
  const [px, py] = pt(nuNow);
  ctx.setLineDash([5, 6]); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(px, py); ctx.stroke(); ctx.setLineDash([]);
  disc(ctx, px, py, 8, '#9bd0ff');
  const v = KEP.speed(r, 1), rp = 1 - e, ra = 1 + e;
  if (P.vec === 'on') {
    const dr = r * e * Math.sin(nuNow) / (1 + e * Math.cos(nuNow)), vx = dr * Math.cos(nuNow) - r * Math.sin(nuNow), vy = dr * Math.sin(nuNow) + r * Math.cos(nuNow), vl = Math.hypot(vx, vy);
    const lv = 90 * v / KEP.speed(rp, 1), lf = 90 * (rp / r) ** 2;
    arrow(ctx, px, py, px + vx / vl * lv, py - vy / vl * lv, COL.v, 'v');
    const dx = sx - px, dy = sy - py, dl = Math.hypot(dx, dy) || 1;
    arrow(ctx, px, py, px + dx / dl * lf, py + dy / dl * lf, COL.F, 'F');
    text(ctx, '화살표 길이는 선형: 근일점 값 = 90 px', 16, h - 40, COL.dim, 14);
  }
  const ss = s; ctx.strokeStyle = COL.text; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(16, h - 18); ctx.lineTo(16 + ss, h - 18); ctx.stroke();
  text(ctx, '1 AU (= 장반지름 a)', 24 + ss, h - 13, COL.dim, 14);
  text(ctx, `이심률 e = ${f2(e)}   (실제: 지구 0.017, 수성 0.21 — 크게 과장하면 모양이 잘 보인다)`, 16, 28, COL.dim, 15);
  const dAdt = KEP.areaRate(S.t, e), A = KEP.area(bounds[cur], bounds[cur + 1], e);
  text(ctx, `면적속도 dA/dt = ${f3(dAdt)} AU²/yr`, w - 16, 28, COL.area, 17, 'right');
  api.setStatus(`T/12 구간 ${cur + 1}/12 — 거리 ${f2(r)} AU, 속력 ${f1(v)} km/s, 이 구간 면적 ${f3(A)} AU²`);
  api.setReadout([['거리 r', f3(r) + ' AU'], ['속력 v (비스-비바)', f1(v) + ' km/s'], ['중력 F (1 AU = 1)', f2(1 / (r * r))],
    ['면적속도 dA/dt', f3(dAdt) + ' AU²/yr'], ['근일점 · 원일점', `${f2(rp)} · ${f2(ra)} AU`], ['v근일점 / v원일점', f2((1 + e) / (1 - e))],
    ['근일점 쪽 구간 면적', f3(KEP.area(bounds[0], bounds[1], e)) + ' AU²'], ['원일점 쪽 구간 면적', f3(KEP.area(bounds[5], bounds[6], e)) + ' AU²']]);
  api.setNote('태양 질량은 행성보다 훨씬 커서 태양은 초점에 고정되어 있다고 가정했다. 면적 구간은 모두 같은 시간(T/12)에 휩쓰는 영역이다. 근일점 쪽은 길고 좁고, 원일점 쪽은 짧고 넓지만 넓이는 같다.');
}

/* ===== ② 제3법칙: 데이터 · 그래프 ===== */
function drawHarm(api) {
  const { ctx, width: w, height: h, P } = api; clear(ctx, w, h);
  const M = P.M3, raw = P.gm === 'raw', inner = P.rg === 'inner', pw = raw ? 1 : 3, qw = raw ? 1 : 2;
  const amax = Math.max(inner ? 1.524 : 30.047, P.au), vis = PLANETS.filter(p => p[1] <= amax * 1.0001);
  const X = a => a ** pw, Y = T => T ** qw;
  const xmax = X(amax) * 1.08, ymax = Math.max(Y(Tof(amax, M)), ...vis.map(p => Y(p[2]))) * 1.08;
  const l = 84, r = w * 0.63, t = 54, bt = h - 62, gx = x => l + x / xmax * (r - l), gy = y => bt - y / ymax * (bt - t);
  const sx = nice(xmax / 5), sy = nice(ymax / 5);
  ctx.lineWidth = 1; ctx.strokeStyle = COL.grid;
  for (let x = 0; x <= xmax; x += sx) { ctx.beginPath(); ctx.moveTo(gx(x), t); ctx.lineTo(gx(x), bt); ctx.stroke(); text(ctx, fmtTick(x), gx(x), bt + 20, COL.dim, 13, 'center'); }
  for (let y = 0; y <= ymax; y += sy) { ctx.beginPath(); ctx.moveTo(l, gy(y)); ctx.lineTo(r, gy(y)); ctx.stroke(); text(ctx, fmtTick(y), l - 8, gy(y) + 5, COL.dim, 13, 'right'); }
  ctx.strokeStyle = COL.dim; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(l, t); ctx.lineTo(l, bt); ctx.lineTo(r, bt); ctx.stroke();
  text(ctx, raw ? 'a (AU)' : 'a³ (AU³)', (l + r) / 2, bt + 46, COL.text, 15, 'center');
  text(ctx, raw ? 'T (년)' : 'T² (년²)', l, t - 14, COL.text, 15);
  ctx.strokeStyle = COL.area; ctx.lineWidth = 2.5; ctx.beginPath();
  for (let i = 0; i <= 160; i++) { const a = amax * i / 160, x = gx(X(a)), y = gy(Y(Tof(a, M))); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  let lastLabel = -99;
  vis.forEach(p => {
    const x = gx(X(p[1])), y = gy(Y(p[2])); disc(ctx, x, y, 6, COL.F);
    if (x - lastLabel > 30) { text(ctx, p[0], x, y - 12, COL.text, 13, 'center'); lastLabel = x; }
  });
  const uT = Tof(P.au, M), ux = gx(X(P.au)), uy = gy(Y(uT));
  ctx.fillStyle = COL.v; ctx.fillRect(ux - 6, uy - 6, 12, 12); text(ctx, '내 행성', ux, uy + 24, COL.v, 13, 'center');
  text(ctx, `파란 선: 질량 M = ${M} M☉ 인 별 주위의 T² = a³/M`, l, 28, COL.area, 15);
  // 데이터 표
  const tx = w * 0.67; text(ctx, '태양계 관측 자료', tx, 62, COL.dim, 15);
  text(ctx, '행성', tx, 90, COL.dim, 13); text(ctx, 'a (AU)', tx + 78, 90, COL.dim, 13); text(ctx, 'T (년)', tx + 150, 90, COL.dim, 13); text(ctx, 'T²/a³', tx + 225, 90, COL.F, 13);
  PLANETS.forEach((p, i) => { const y = 116 + i * 26; text(ctx, p[0], tx, y, COL.text, 14); text(ctx, String(p[1]), tx + 78, y, COL.text, 14); text(ctx, String(p[2]), tx + 150, y, COL.text, 14); text(ctx, f3(p[2] ** 2 / p[1] ** 3), tx + 225, y, COL.F, 14); });
  text(ctx, `내 행성   ${f1(P.au)}   ${f2(uT)}   ${f3(uT * uT / P.au ** 3)}`, tx, 116 + 8 * 26 + 10, COL.v, 14);
  const ks = PLANETS.map(p => p[2] ** 2 / p[1] ** 3);
  api.setReadout([['내 행성 a³ / T²', `${f2(P.au ** 3)} AU³ / ${f2(uT * uT)} yr²`], ['T²/a³ (파란 선 기울기)', f3(1 / M)], ['8행성 T²/a³ 범위', `${f3(Math.min(...ks))} ~ ${f3(Math.max(...ks))}`],
    ['비례상수 4π²/GM', (4 * Math.PI ** 2 / (GMS * M) * 1e19).toFixed(2) + '×10⁻¹⁹ s²/m³']]);
  api.setNote(raw ? 'a–T 그래프는 곡선(T ∝ a^{3/2})이어서 비례 관계를 눈으로 확인하기 어렵다. a³–T²로 바꾸면 원점을 지나는 직선이 된다.'
    : 'a³–T² 그래프에서 모든 행성이 원점을 지나는 한 직선 위에 놓인다. 직선의 기울기 T²/a³ = 4π²/(GM)은 중심별 질량 M만으로 결정된다. 내 행성의 a를 바꿔도 같은 선 위를 움직인다. 표의 T²/a³는 약 1이지만 토성은 목성의 섭동 때문에 약 1.4% 벗어난다.');
}

/* ===== ③ 만유인력 유도 ===== */
function drawGrav(api) {
  const { ctx, width: w, height: h, P } = api; clear(ctx, w, h);
  const g = gravCalc(P.rr, P.MM, P.mm), cx = w * 0.5, cy = h * 0.5, sp = h * 0.42 / 4, R = P.rr * sp;
  ctx.setLineDash([6, 7]); ctx.strokeStyle = 'rgba(160,190,255,.3)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, sp, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  text(ctx, '1 AU', cx + sp * .71 + 4, cy - sp * .71 - 4, COL.dim, 13);
  ctx.strokeStyle = COL.dim; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
  star(ctx, cx, cy, 8 + 5 * Math.cbrt(P.MM));
  const px = cx + R * Math.cos(S.th), py = cy - R * Math.sin(S.th);
  disc(ctx, px, py, 5 + 3 * Math.cbrt(P.mm), '#9bd0ff');
  const tx = -Math.sin(S.th), ty = -Math.cos(S.th), nx = (cx - px) / R, ny = (cy - py) / R;
  arrow(ctx, px, py, px + tx * 60, py + ty * 60, COL.v, 'v'); arrow(ctx, px, py, px + nx * 60, py + ny * 60, COL.F, 'F');
  text(ctx, '화살표는 방향 표시용(길이 고정), 크기는 오른쪽 측정값', 16, h - 14, COL.dim, 14);
  text(ctx, `r = ${f2(P.rr)} AU,  M = ${f1(P.MM)} M☉,  m = ${f1(P.mm)} 지구질량`, 16, 28, COL.dim, 15);
  text(ctx, `구심력 m v²/r = ${f2(g.Fc)}   만유인력 GMm/r² = ${f2(g.Fg)}   (지구–태양 = 1)`, 16, 54, COL.F, 15);
  api.setStatus(`T = ${f2(g.T)} yr — 지구 궤도(점선)보다 ${P.rr > 1 ? '바깥' : P.rr < 1 ? '안쪽' : '같은 반지름'}`);
  api.setReadout([['공전 속력 v = 2πr/T', f1(g.v) + ' km/s'], ['공전 주기 T', f2(g.T) + ' yr'], ['구심 가속도 v²/r', (g.ac * A0 * 1000).toFixed(2) + ' mm/s²'],
    ['구심력 m v²/r', f2(g.Fc)], ['만유인력 GMm/r²', f2(g.Fg)], ['T²/r³ = 1/M', f3(g.T * g.T / P.rr ** 3)]]);
  api.setNote('원궤도 근사: 구심력 m v²/r에 v = 2πr/T와 T² = r³/M을 넣으면 GMm/r²이 된다. 두 값이 같은 것이 유도의 핵심이다. r을 두 배로 하면 F는 1/4배가 되는 것을 오른쪽 그래프의 점으로 확인한다.');
  const ch = api.chart; if (!ch) return;
  const cv = ch.canvas, c2 = ch.ctx, cw = cv.width, chh = cv.height, sc = cw / (cv.clientWidth || cw);
  c2.save(); c2.setTransform(1, 0, 0, 1, 0, 0); c2.fillStyle = COL.bg; c2.fillRect(0, 0, cw, chh);
  const l = 54 * sc, r2 = cw - 16 * sc, t = 18 * sc, bt = chh - 32 * sc, rmin = 0.4, rmax = 4, ymax = 1 / (rmin * rmin);
  const gx = v => l + (v - rmin) / (rmax - rmin) * (r2 - l), gy = y => bt - y / ymax * (bt - t);
  c2.font = `${12 * sc}px sans-serif`; c2.fillStyle = COL.dim; c2.strokeStyle = COL.grid; c2.lineWidth = 1 * sc;
  [1, 2, 3, 4].forEach(v => { c2.beginPath(); c2.moveTo(gx(v), t); c2.lineTo(gx(v), bt); c2.stroke(); c2.fillText(v + ' AU', gx(v) - 12 * sc, bt + 18 * sc); });
  [1, 2, 4, 6].forEach(y => { c2.beginPath(); c2.moveTo(l, gy(y)); c2.lineTo(r2, gy(y)); c2.stroke(); c2.fillText(String(y), l - 22 * sc, gy(y) + 4 * sc); });
  c2.fillText('F/(Mm) (AU⁻²)', 4 * sc, t - 4 * sc);
  c2.strokeStyle = COL.F; c2.lineWidth = 2.5 * sc; c2.beginPath();
  for (let i = 0; i <= 120; i++) { const v = rmin + (rmax - rmin) * i / 120, x = gx(v), y = gy(1 / (v * v)); i ? c2.lineTo(x, y) : c2.moveTo(x, y); }
  c2.stroke();
  const dot = (v, col, lab) => { const x = gx(v), y = gy(1 / (v * v)); c2.fillStyle = col; c2.beginPath(); c2.arc(x, y, 6 * sc, 0, TAU); c2.fill(); c2.fillStyle = col; c2.fillText(lab, x + 9 * sc, y - 6 * sc); };
  dot(P.rr, COL.v, `r: ${f2(1 / (P.rr * P.rr))}`);
  if (2 * P.rr <= rmax) dot(2 * P.rr, COL.dim, `2r: ${f2(1 / (4 * P.rr * P.rr))} (1/4배)`);
  c2.restore();
}

/* ===== ④ 문제 풀기 ===== */
function drawQuiz(api) {
  const { ctx, width: w, height: h, P } = api; clear(ctx, w, h);
  const cx = w * 0.5, cy = h * 0.52, sp = Math.min(h * 0.42, w * 0.3) / Math.max(P.aB, 1), TB = Tof(P.aB, 1);
  star(ctx, cx, cy, 10);
  [[1, 'A', 1, '#9bd0ff', 0.9], [P.aB, 'B', TB, COL.F, 2.4]].forEach(([a, nm, T, col, ang]) => {
    ctx.strokeStyle = 'rgba(160,190,255,.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, a * sp, 0, TAU); ctx.stroke();
    const x = cx + a * sp * Math.cos(ang), y = cy - a * sp * Math.sin(ang); disc(ctx, x, y, 8, col);
    text(ctx, `행성 ${nm}: a = ${a} AU, T = ${T < 10 ? f2(T) : f1(T)} 년`, x + 14, y - 10, col, 15);
  });
  text(ctx, '같은 별(태양) 주위를 도는 두 행성 — 제3법칙 T² ∝ a³', 16, 28, COL.dim, 15);
  text(ctx, `(T_B / T_A)² = ${f2(TB * TB)} = (a_B / a_A)³ = ${f2(P.aB ** 3)}`, 16, 54, COL.text, 15);
  api.setReadout([['a_B / a_A', f2(P.aB)], ['(a_B/a_A)³', f2(P.aB ** 3)], ['T_B / T_A', f2(TB)], ['(T_B/T_A)²', f2(TB * TB)]]);
  api.setNote('문제 4의 행성 B를 슬라이더로 직접 만들어 본다. 같은 별을 도는 행성끼리는 T²/a³가 같으므로 T_B = a_B^{3/2} 년이다.');
}

/* ===== 퀴즈 ===== */
const QUIZ = [
  { q: '케플러 제2법칙(면적속도 일정 법칙)에 대한 설명으로 옳은 것은?',
    o: ['① 행성의 공전 궤도는 태양을 한 초점으로 하는 원 궤도이다.', '② 행성이 근일점을 지날 때 공전 속력이 가장 느리다.', '③ 태양과 행성을 잇는 선분이 같은 시간 동안 쓸고 지나가는 면적은 일정하다.', '④ 공전 주기의 제곱은 장반지름의 제곱에 비례한다.'], a: 2,
    ex: '같은 시간 동안 휩쓰는 면적이 같으므로 태양에 가까운 근일점에서 속력이 가장 빠르고 원일점에서 가장 느리다. ①은 제1법칙(타원), ④는 제3법칙(세제곱)과 관련 있다.' },
  { q: '뉴턴이 케플러 제3법칙(T² ∝ r³)과 등속 원운동의 구심력 식을 결합해 얻은 중력의 성질은?',
    o: ['① 중력은 거리에 비례한다.', '② 중력은 거리의 제곱에 반비례한다.', '③ 중력은 두 물체의 부피에 비례한다.', '④ 중력은 공전 주기에 반비례한다.'], a: 1,
    ex: 'F = 4π²mr/T²에 T² = kr³을 넣으면 F = (4π²/k)·m/r²이 되어 거리의 제곱에 반비례한다.' },
  { q: '1684년 훅, 렌과 나눈 논쟁 뒤 케임브리지의 뉴턴을 찾아가 《프린키피아》의 집필·출판으로 이어지게 한 인물은?',
    o: ['① 갈릴레이', '② 코페르니쿠스', '③ 핼리', '④ 데카르트'], a: 2,
    ex: '핼리는 역제곱 힘에서 궤도가 어떤 곡선이 되는지 뉴턴에게 물었고, 뉴턴의 계산을 확인한 뒤 출판을 도왔다.' },
  { q: '행성 A의 장반지름이 1 AU, 공전 주기가 1년이다. 같은 별을 도는 행성 B의 장반지름이 4 AU일 때 공전 주기는? (슬라이더로 확인)',
    o: ['① 2년', '② 4년', '③ 8년', '④ 16년'], a: 2,
    ex: 'T² ∝ a³이므로 a가 4배이면 a³은 64배, T는 √64 = 8배(8년)이다.' },
];
const QZ = { ans: {} };
function renderQuiz(root) {
  const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt !== undefined) n.textContent = txt; return n; };
  root.innerHTML = '';
  const score = QUIZ.filter((q, i) => QZ.ans[i] === q.a).length;
  root.appendChild(el('div', 'qz-head', `개념 확인 퀴즈 — 점수 ${score} / ${QUIZ.length}`));
  QUIZ.forEach((q, qi) => {
    const card = el('div', 'qz-card'), done = QZ.ans[qi] !== undefined;
    card.appendChild(el('div', 'qz-q', `${qi + 1}. ${q.q}`));
    q.o.forEach((txt, oi) => {
      const b = el('button', 'qz-opt', txt);
      if (done) { b.disabled = true; if (oi === q.a) b.classList.add('ok'); else if (oi === QZ.ans[qi]) b.classList.add('bad'); }
      b.onclick = () => { QZ.ans[qi] = oi; renderQuiz(root); };
      card.appendChild(b);
    });
    if (done) card.appendChild(el('div', 'qz-ex', (QZ.ans[qi] === q.a ? '정답! ' : '오답. ') + q.ex));
    root.appendChild(card);
  });
  const rb = el('button', 'qz-reset', '다시 풀기'); rb.onclick = () => { QZ.ans = {}; renderQuiz(root); }; root.appendChild(rb);
}

const DRAW = { ellipse: drawEllipse, harmonic: drawHarm, gravity: drawGrav, quiz: drawQuiz };
const ANIM = { ellipse: 1, gravity: 1 };

const SIM = {
  enter(api) {
    resetState();
    api.setPlaying && api.setPlaying(!!ANIM[api.scenario.id]);
    if (api.scenario.id === 'quiz' && api.custom) renderQuiz(api.custom);
  },
  reset(api) { resetState(); api.refresh(); },
  update(api) { (DRAW[api.scenario.id] || drawEllipse)(api); },
  frame(api, dt) {
    const id = api.scenario.id, P = api.P;
    const playing = typeof api.playing === 'function' ? api.playing() : api.playing;
    if (playing === false) return;
    dt = Math.min(dt, 1 / 30);
    if (id === 'ellipse') S.t += dt * P.sp;                           // 단위: 년 (주기 = 1년)
    else if (id === 'gravity') S.th += TAU * dt * 0.25 / Tof(P.rr, P.MM); // 1초 = 0.25년
    (DRAW[id] || drawEllipse)(api);
  },
  tests() {
    const T = [], near = (a, b, e = 1e-9) => Math.abs(a - b) <= e * Math.max(1, Math.abs(b));
    let res = 0; for (const [Mn, e] of [[0.3, 0.9], [3, 0.5], [6, 0.8], [1, 0]]) { const E = KEP.solveE(Mn, e); res = Math.max(res, Math.abs(E - e * Math.sin(E) - Mn)); }
    T.push(['케플러 방정식 E − e sinE = M 잔차', res < 1e-12, res.toExponential(1)]);
    const circ = [0, 1.3, 4].every(n => near(KEP.r(n, 0), 1) && near(KEP.speed(1, 1), V0));
    T.push(['e = 0: 원궤도 (r = a, v 일정)', circ, V0.toFixed(2) + ' km/s']);
    T.push(['1 AU 원궤도 속력 ≈ 29.78 km/s (지구)', Math.abs(V0 - 29.78) < 0.02, V0.toFixed(3)]);
    const e1 = 0.7; let worst = 0;
    for (let k = 0; k < 12; k++) { const A = KEP.area(KEP.nu(k / 12, e1), KEP.nu((k + 1) / 12, e1), e1); worst = Math.max(worst, Math.abs(A / (Math.PI * Math.sqrt(1 - e1 * e1) / 12) - 1)); }
    T.push(['제2법칙: 같은 시간(T/12) 구간 면적 = πab/12 (e = 0.7)', worst < 1e-5, '최대 상대오차 ' + worst.toExponential(1)]);
    const e2 = 0.5, ar = [0.02, 0.25, 0.5, 0.9].map(t => KEP.areaRate(t, e2));
    T.push(['면적속도 dA/dt = π√(1−e²) AU²/yr 일정', ar.every(x => near(x, Math.PI * Math.sqrt(1 - e2 * e2), 1e-6)), ar.map(f3).join(', ')]);
    const e3 = 0.6, rp = 1 - e3, ra = 1 + e3, L = 2 * Math.PI * Math.sqrt(1 - e3 * e3), k2 = V0 / TAU; // L: 각운동량/질량의 절반이 면적속도
    T.push(['각운동량 보존 v = L/r이 비스-비바 식과 일치 (근일점·원일점)', near(L / rp * k2, KEP.speed(rp, 1), 1e-9) && near(L / ra * k2, KEP.speed(ra, 1), 1e-9), '']);
    T.push(['v근일점 / v원일점 = (1+e)/(1−e)', near(KEP.speed(rp, 1) / KEP.speed(ra, 1), (1 + e3) / (1 - e3)), f2((1 + e3) / (1 - e3))]);
    T.push(['SI: 2π√(AU³/GM☉) = 1년', Math.abs(TAU * Math.sqrt(AU ** 3 / GMS) / YR - 1) < 1e-3, (TAU * Math.sqrt(AU ** 3 / GMS) / YR).toFixed(5) + ' yr']);
    const ks = PLANETS.map(p => p[2] ** 2 / p[1] ** 3);
    T.push(['8행성 T²/a³ 모두 1 ± 2% (토성은 목성 섭동으로 −1.4%)', ks.every(k => Math.abs(k - 1) < 0.02), Math.min(...ks).toFixed(4) + ' ~ ' + Math.max(...ks).toFixed(4)]);
    const Tsi = (a, M) => TAU * Math.sqrt((a * AU) ** 3 / (GMS * M)) / YR;
    T.push(['SI 공식과 T = √(a³/M) 일치 (M = 0.5, 1, 3)', [0.5, 1, 3].every(M => near(Tof(2.3, M), Tsi(2.3, M), 1e-3)), '']);
    T.push(['중심별 질량 2배 → T²/a³ 절반', near(Tsi(1, 2) ** 2 / Tsi(1, 1) ** 2, 0.5, 1e-9), '']);
    const g1 = gravCalc(0.7, 2, 1.5);
    T.push(['구심력 m v²/r = 만유인력 GMm/r²', near(g1.Fc, g1.Fg, 1e-9), `${g1.Fc.toFixed(4)} = ${g1.Fg.toFixed(4)}`]);
    const gs = gravCalc(1, 1, 1);
    T.push(['1 AU: a = 4π²r/T² (SI) = GM/r² = 5.93 mm/s²', near(TAU * TAU * AU / (YR * YR), A0, 1e-3) && near(gs.ac * A0 * 1000, 5.93, 2e-3), (A0 * 1000).toFixed(3) + ' mm/s²']);
    T.push(['역제곱: r 2배 → F 1/4배', near(gravCalc(2, 1, 1).Fg / gravCalc(1, 1, 1).Fg, 0.25) && near(gravCalc(2, 1, 1).Fc / gravCalc(1, 1, 1).Fc, 0.25), '']);
    T.push(['문제 4: a = 4 AU → T = 8년', near(Tof(4, 1), 8), '']);
    const fin = [[0.4, 3, 0.2], [4, 0.5, 3], [1, 1, 1]].every(([r, M, m]) => Object.values(gravCalc(r, M, m)).every(Number.isFinite)) &&
      [0, 0.8].every(e => Number.isFinite(KEP.areaRate(0, e)) && Number.isFinite(KEP.nu(0.37, e)) && Number.isFinite(KEP.speed(1 - e, 1)));
    T.push(['슬라이더 양 끝값에서 NaN·Infinity 없음', fin, '']);
    return T;
  },
};

</script>
<script>
"use strict";
/* ============================ 공용 UI 프레임워크 (템플릿) ============================ */
(function () {
  const C = WS_CONFIG;
  const $ = (id) => document.getElementById(id);
  const P = {};
  const ui = { tab: C.tabs[0].id, scenarioId: null, playing: false };
  const lastScenarioOfTab = {};

  function addDefaults(params) { (params || []).forEach(p => { if (!(p.key in P)) P[p.key] = p.value; }); }
  C.scenarios.forEach(s => { addDefaults(s.params); addDefaults(s.choices); });
  if (C.common_params) addDefaults(C.common_params.params);

  function current() { return C.scenarios.find(s => s.id === ui.scenarioId); }
  function scenariosOfTab(tab) { return C.scenarios.filter(s => s.tab === tab); }
  function fmtVal(v, unit) {
    if (!unit) return String(v);
    return /^[°%′″]/.test(unit) ? v + unit : v + " " + unit;
  }

  function showError(where, e) {
    const box = $("simError");
    box.hidden = false;
    box.textContent = "시뮬레이션 오류 (" + where + "): " + (e && e.message ? e.message : e);
    console.error(e);
  }
  const SIMOBJ = (typeof SIM !== "undefined") ? SIM : null;
  function call(hook, ...args) {
    if (!SIMOBJ || typeof SIMOBJ[hook] !== "function") return undefined;
    try { return SIMOBJ[hook](api, ...args); } catch (e) { showError(hook, e); return undefined; }
  }

  /* ---------- 렌더러 ---------- */
  const wrap = $("sceneWrap");
  const api = {
    config: C, P,
    get scenario() { return current(); },
    get tab() { return ui.tab; },
    get playing() { return ui.playing; },
    setPlaying(b) { ui.playing = !!b; updatePlayButton(); },
    boxHalf: (C.scene && C.scene.box_half) || 16,
    sceneEl: wrap,
    THREE: window.THREE || null,
    scene: null, camera: null, renderer: null, controls: null,
    canvas: null, ctx: null, width: 0, height: 0,
    custom: $("customPanel"),
    chart: {
      canvas: $("chartCanvas"),
      ctx: $("chartCanvas").getContext("2d"),
      setHint(html) { $("chartHint").innerHTML = html; },
    },
    setReadout(rows) {
      const tbl = $("readout");
      tbl.innerHTML = "";
      (rows || []).forEach(r => {
        const tr = document.createElement("tr");
        const a = document.createElement("td"); a.textContent = r[0];
        const b = document.createElement("td"); b.textContent = r[1];
        tr.append(a, b); tbl.appendChild(tr);
      });
    },
    setNote(text) { $("readoutNote").textContent = text || ""; },
    setStatus(text) { const el = $("wsStatus"); if (el) el.textContent = text || ""; },
    setParam(key, v) {
      P[key] = v;
      const el = $("p_" + key); if (el) el.value = v;
      const vEl = $("p_" + key + "_val"); if (vEl) vEl.textContent = fmtVal(v, vEl.dataset.unit);
    },
    refresh() { call("update"); },
  };

  function initRenderer() {
    const sc = C.scene || {};
    if (C.renderer === "three") {
      if (!window.THREE) { showError("init", "Three.js를 불러오지 못했습니다 (인터넷 연결 확인)"); return false; }
      const T = window.THREE;
      api.scene = new T.Scene();
      api.camera = new T.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 500);
      const cp = sc.camera || [26, 20, 30];
      api.camera.position.set(cp[0], cp[1], cp[2]);
      api.renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
      api.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      wrap.insertBefore(api.renderer.domElement, wrap.firstChild);
      api.controls = new T.OrbitControls(api.camera, api.renderer.domElement);
      api.controls.enableDamping = true;
      api.controls.dampingFactor = 0.08;
      api.controls.target.set(0, 0, 0);
      api.scene.add(new T.AmbientLight(0xffffff, 0.55));
      const dl = new T.DirectionalLight(0xffffff, 0.9);
      dl.position.set(20, 30, 15);
      api.scene.add(dl);
      if (sc.grid !== false) api.scene.add(new T.GridHelper(api.boxHalf * 2, 16, 0x3a5a8a, 0x1f3352));
      if (sc.axes !== false) api.scene.add(new T.AxesHelper(api.boxHalf * 0.6));
    } else {
      api.canvas = document.createElement("canvas");
      wrap.insertBefore(api.canvas, wrap.firstChild);
      api.ctx = api.canvas.getContext("2d");
    }
    window.addEventListener("resize", onResize);
    onResize();
    return true;
  }

  function onResize() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    api.width = w; api.height = h;
    if (api.renderer) {
      api.camera.aspect = w / h;
      api.camera.updateProjectionMatrix();
      api.renderer.setSize(w, h);
    } else if (api.canvas) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      api.canvas.width = Math.round(w * dpr);
      api.canvas.height = Math.round(h * dpr);
      api.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (ui.scenarioId) call("update");
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    if (api.controls) api.controls.update();
    call("frame", 1 / 60);
    if (api.renderer) api.renderer.render(api.scene, api.camera);
  }

  /* ---------- UI ---------- */
  function renderTabs() {
    const box = $("tabs");
    box.innerHTML = "";
    box.hidden = C.tabs.length < 2;
    C.tabs.forEach(t => {
      const b = document.createElement("button");
      b.textContent = t.label;
      b.className = t.id === ui.tab ? "active" : "";
      b.addEventListener("click", () => switchTab(t.id));
      box.appendChild(b);
    });
  }

  function renderPicker() {
    const box = $("scenarioPicker");
    const list = scenariosOfTab(ui.tab);
    box.innerHTML = "";
    box.hidden = list.length < 2;
    list.forEach(s => {
      const b = document.createElement("button");
      b.textContent = s.name;
      b.className = s.id === ui.scenarioId ? "active" : "";
      b.addEventListener("click", () => selectScenario(s.id));
      box.appendChild(b);
    });
  }

  function sliderEl(p) {
    const div = document.createElement("div");
    div.className = "param";
    const label = document.createElement("label");
    label.textContent = p.label + " ";
    const val = document.createElement("span");
    val.className = "val"; val.id = "p_" + p.key + "_val"; val.dataset.unit = p.unit || "";
    val.textContent = fmtVal(P[p.key], p.unit);
    label.appendChild(val);
    const inp = document.createElement("input");
    inp.type = "range"; inp.id = "p_" + p.key;
    inp.min = p.min; inp.max = p.max; inp.step = p.step; inp.value = P[p.key];
    inp.addEventListener("input", () => {
      const v = parseFloat(inp.value);
      P[p.key] = v;
      val.textContent = fmtVal(v, p.unit);
      call("update");
    });
    div.append(label, inp);
    return div;
  }

  function choiceEl(c) {
    const row = document.createElement("div");
    row.className = "row"; row.style.marginBottom = "8px";
    if (c.label) { const l = document.createElement("b"); l.style.fontSize = "0.9em"; l.textContent = c.label; row.appendChild(l); }
    c.options.forEach(o => {
      const b = document.createElement("button");
      b.textContent = o.label;
      b.className = P[c.key] === o.value ? "primary" : "";
      b.addEventListener("click", () => {
        P[c.key] = o.value;
        row.querySelectorAll("button").forEach(x => x.className = "");
        b.className = "primary";
        call("update");
      });
      row.appendChild(b);
    });
    return row;
  }

  function renderControls() {
    const s = current();
    const body = $("scenarioBody");
    body.innerHTML = "";
    if (s.desc || s.section) {
      const p = document.createElement("p");
      p.className = "hint"; p.style.marginBottom = "10px";
      if (s.section) { const b = document.createElement("b"); b.textContent = s.section; p.appendChild(b); if (s.desc) p.appendChild(document.createTextNode(" — ")); }
      if (s.desc) p.appendChild(document.createTextNode(s.desc));
      body.appendChild(p);
    }
    (s.choices || []).forEach(c => body.appendChild(choiceEl(c)));
    (s.params || []).forEach(p => body.appendChild(sliderEl(p)));
    if (s.animated) {
      const st = document.createElement("div");
      st.className = "hint"; st.id = "wsStatus";
      st.textContent = s.status_hint || "";
      body.appendChild(st);
      const row = document.createElement("div");
      row.className = "controls-row";
      const play = document.createElement("button");
      play.id = "playBtn"; play.className = "primary";
      play.addEventListener("click", () => { ui.playing = !ui.playing; updatePlayButton(); });
      const reset = document.createElement("button");
      reset.textContent = "↺ 리셋";
      reset.addEventListener("click", () => { ui.playing = false; updatePlayButton(); call("reset"); call("update"); });
      row.append(play, reset);
      body.appendChild(row);
      updatePlayButton();
    }
    const cp = C.common_params;
    if (cp && s.use_common !== false) {
      const hr = document.createElement("hr");
      hr.style.cssText = "margin:10px 0;border:none;border-top:1px solid var(--border)";
      body.appendChild(hr);
      if (cp.title) { const b = document.createElement("b"); b.style.fontSize = "0.9em"; b.textContent = cp.title; body.appendChild(b); }
      cp.params.forEach(p => body.appendChild(sliderEl(p)));
    }
  }

  function updatePlayButton() {
    const b = $("playBtn");
    if (b) b.textContent = ui.playing ? "⏸ 일시정지" : "▶ 재생";
  }

  function renderFormula() {
    const s = current();
    const body = $("formulaBody");
    body.innerHTML = (s.formula || []).map(f =>
      (f.eq_html ? `<div class="eq">${f.eq_html}</div>` : "") + (f.text_html || "")
    ).join("");
  }

  function renderMisconception() {
    const s = current();
    const panel = $("misconceptionPanel");
    panel.innerHTML = "";
    panel.hidden = !s.misconception;
    if (!s.misconception) return;
    const box = document.createElement("div");
    box.className = "misconception";
    const b = document.createElement("b");
    b.textContent = s.misconception_title || "💡 흔한 오개념";
    box.append(b, document.createElement("br"), document.createTextNode(s.misconception));
    panel.appendChild(box);
  }

  function enterScenario() {
    ui.playing = false;
    const s = current();
    $("graphPanel").hidden = !s.chart;
    $("chartHint").innerHTML = "";
    api.custom.innerHTML = "";
    api.setReadout([]); api.setNote("");
    renderPicker(); renderControls(); renderFormula(); renderMisconception();
    call("enter");
    call("update");
  }

  function selectScenario(id) {
    ui.scenarioId = id;
    lastScenarioOfTab[ui.tab] = id;
    enterScenario();
  }

  function switchTab(tab) {
    ui.tab = tab;
    renderTabs();
    selectScenario(lastScenarioOfTab[tab] || scenariosOfTab(tab)[0].id);
  }

  function renderLegend() {
    const box = $("legend");
    (C.legend || []).forEach(l => {
      const span = document.createElement("span");
      const sw = document.createElement("i");
      sw.className = "swatch" + (l.shape === "bar" ? " bar" : "");
      sw.style.background = l.color;
      span.append(sw, document.createTextNode(l.label));
      box.appendChild(span);
    });
  }

  function runSelfTests() {
    if (!SIMOBJ || typeof SIMOBJ.tests !== "function") { console.log("물리 검증 항목 없음"); return; }
    let results = [];
    try { results = SIMOBJ.tests() || []; } catch (e) { showError("tests", e); return; }
    console.log("=== " + C.title + " 물리 검증 ===");
    let pass = 0;
    for (const [name, ok, detail] of results) {
      console.log(`[${ok ? "PASS" : "FAIL"}] ${name}${detail ? " — " + detail : ""}`);
      if (ok) pass++;
    }
    console.log(pass === results.length ? "모든 검증 통과" : "일부 검증 실패 — 콘솔 확인 필요");
    window.__wsSelfTest = { pass, total: results.length };
  }

  /* ---------- 시작 ---------- */
  $("readoutTitle").textContent = C.readout_title || "측정값";
  $("hoverHint").textContent = (C.scene && C.scene.hint != null) ? C.scene.hint
    : (C.renderer === "three" ? "마우스 드래그: 회전 · 휠: 확대/축소" : "");
  $("projectorBtn").addEventListener("click", () => document.body.classList.toggle("projector"));
  renderLegend();
  if (!SIMOBJ) showError("load", "sim_js에 SIM 객체가 정의되지 않았습니다");
  if (initRenderer()) {
    call("init");
    renderTabs();
    switchTab(ui.tab);
    animate();
  }
  runSelfTests();
})();
</script>

</body>
