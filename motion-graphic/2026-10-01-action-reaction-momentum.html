<html lang="ko">
<head>

<title>작용 반작용과 운동량 보존</title>
<!-- action-reaction-momentum · 교과서 30~35쪽 기반: 힘의 평형 vs 작용 반작용, 실생활 예, 운동량 보존 증명과 적용 (약 165초) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --page:#e7e3d8; --ink:#23261f; --barbg:#d8d3c6;
  --board:#1f3d31; --chalk:#f3f0e6; --yellow:#f4cf5a; --pink:#f29aac; --blue:#8cc3e8; --wood:#6b4a2f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#111513;--ink:#e6e6de;--barbg:#1c211e}}
:root[data-theme="dark"]{--page:#111513;--ink:#e6e6de;--barbg:#1c211e}
html{height:100%} body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column;overflow:hidden}
#wrap{flex:1;position:relative;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;color:var(--chalk);
  background:
    radial-gradient(ellipse 900px 500px at 25% 20%,rgba(255,255,255,.07),transparent 70%),
    radial-gradient(ellipse 700px 400px at 75% 70%,rgba(255,255,255,.05),transparent 70%),
    radial-gradient(ellipse 1400px 700px at 50% 110%,rgba(0,0,0,.35),transparent 70%),
    var(--board);
  box-shadow:inset 0 0 0 22px var(--wood), inset 0 0 0 26px #4d341f, inset 0 0 120px rgba(0,0,0,.45);
}
#tray{position:absolute;left:22px;right:22px;bottom:22px;height:18px;background:linear-gradient(#7a5738,#50361f)}
.stick{position:absolute;bottom:40px;height:12px;border-radius:6px}
.dsp{font-family:"Black Han Sans","Malgun Gothic",sans-serif;font-weight:400}
.pen{font-family:"Nanum Pen Script",cursive}
.ch{text-shadow:0 0 1px currentColor,0 0 10px rgba(255,255,255,.12)}
.sc{position:absolute;inset:0;display:none}
.row{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;will-change:transform,opacity}
.abs{position:absolute;will-change:transform,opacity}
.y{color:var(--yellow)} .p{color:var(--pink)} .b{color:var(--blue)}
.card{position:absolute;border:4px solid rgba(243,240,230,.85);border-radius:22px 12px 26px 14px;background:var(--board)}
.fig{position:absolute;transform-origin:50% 100%}
.fig svg{display:block;overflow:visible}

/* control bar */
#bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--barbg);font-size:15px;flex-wrap:wrap}
#bar button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid rgba(127,127,127,.5);background:var(--page);color:var(--ink);cursor:pointer}
#bar button:focus-visible,#seek:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
#seek{flex:1;min-width:140px}
#time{font-variant-numeric:tabular-nums;min-width:92px}
.hint{opacity:.7}
body.rec #bar{display:none}
@media (max-width:640px){.hint{display:none}}
#mgError{position:absolute;left:40px;right:40px;top:40px;z-index:50;background:rgba(184,50,31,.95);color:#fff;font:22px/1.4 sans-serif;padding:10px 18px;border-radius:12px;white-space:pre-wrap;display:none}
#mgError.on{display:block}
body.nodecor #tray, body.nodecor .stick{display:none}
/* ---- theme ---- */
:root{--board:#1f3d31;--chalk:#f3f0e6;--yellow:#f4cf5a;--pink:#f29aac;--blue:#8cc3e8;--wood:#6b4a2f}
/* ---- MotionKit 스타일 프리셋 (내장) ---- */
/* ==== MotionKit 스타일 프리셋 (템플릿 내장) ==== */
.mk-u{display:inline-block;will-change:transform,opacity}
.mk-bg{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
.mk-grain{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;background-image:var(--mk-noise);opacity:.13;mix-blend-mode:multiply}
/* 글꼴 */
.f-sans{font-family:'Noto Sans KR','Black Han Sans',sans-serif;font-weight:900;letter-spacing:-.04em}
.f-thin{font-family:'Noto Sans KR',sans-serif;font-weight:300;letter-spacing:.02em}
.f-plex{font-family:'IBM Plex Sans KR',sans-serif;font-weight:300}
.f-mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.f-paper{font-family:'Do Hyeon','Black Han Sans',sans-serif}
.f-serif{font-family:'Nanum Myeongjo',serif}
/* 1. SWISS — 그리드·원색·굵은 산세리프 */
.mk-swiss{background:#f2efe8;color:#111;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 160px)}
.mk-swiss .accent{background:#e8321e}
/* 2. LINE — 블루프린트 선화 */
.mk-line{background:radial-gradient(ellipse at 50% 40%,#13305a,#060e1d 75%);color:#d8ecff}
.mk-line .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(140,200,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(140,200,255,.08) 1px,transparent 1px);background-size:60px 60px}
.mk-line svg *{fill:none;stroke:#8fd0ff;stroke-width:3;stroke-linecap:round}
/* 3. PAPER — 종이 컷아웃 */
.mk-paper{background:radial-gradient(circle at 30% 20%,#f6eedf,#e6d8bf);color:#3b2f22}
.mk-paper .card{position:absolute;border-radius:18px;box-shadow:0 10px 0 rgba(0,0,0,.08),0 22px 40px rgba(60,40,10,.18)}
/* 4. RISO — 형광 잉크 겹침 */
.mk-riso{background:#f4f0e6;color:#1a1a1a}
.mk-riso .ink-p{color:#ff48b0;fill:#ff48b0;mix-blend-mode:multiply}
.mk-riso .ink-b{color:#0078bf;fill:#0078bf;mix-blend-mode:multiply}
.mk-riso .ink-y{color:#ffe800;fill:#ffe800;mix-blend-mode:multiply}
/* 5. COSMIC — 입자·글로우·세리프 */
.mk-cosmic{background:radial-gradient(circle at 50% 60%,#22124a,#04030c 70%);color:#f5f0ff}
.mk-cosmic .glow{text-shadow:0 0 24px rgba(190,160,255,.7)}
/* 6. CHALK — 기존 칠판 테마는 .mk-bg 없이 템플릿 그대로 쓴다 */
/* ==== /MotionKit CSS ==== */

</style>

let acc=0; SC.forEach(s=>{s.el=$("#"+s.id);s.s=acc;acc+=s.d;});
const TOTAL=acc;

/* ===== 배경음악: 코드로 합성한 단순 멜로디 (외부 음원 없음) ===== */
const BPM=MUSIC.bpm||112, SD=60/BPM/2;
const CH=[[48,52,55],[43,47,50],[45,48,52],[41,45,48]];   // C G Am F
const MEL=[76,0,79,0,76,74,72,0, 74,0,71,0,74,76,74,0, 72,0,76,0,81,0,79,76, 77,0,76,74,72,0,0,0];
const ARP=[0,1,2,1,0,1,2,1];
const mf=m=>440*Math.pow(2,(m-69)/12);
let actx=null,master=null,noiseBuf=null,muted=!MUSIC.on,nextStep=0,baseA=0,baseT=0;
function initAudio(){
  if(!actx){
    try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    master=actx.createGain();master.gain.value=0;master.connect(actx.destination);
    noiseBuf=actx.createBuffer(1,actx.sampleRate*.1,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(actx.state!=="running")actx.resume().then(syncAudio);
  syncAudio();
}
function syncAudio(){if(actx){baseA=actx.currentTime;baseT=T;nextStep=Math.ceil(T/SD-1e-6);}}
function tone(f,t,dur,type,g){const o=actx.createOscillator(),v=actx.createGain();o.type=type;o.frequency.value=f;
  v.gain.setValueAtTime(0.0001,t);v.gain.linearRampToValueAtTime(g,t+.012);v.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(v).connect(master);o.start(t);o.stop(t+dur+.05);}
function kick(t){const o=actx.createOscillator(),v=actx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.14);
  v.gain.setValueAtTime(.55,t);v.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(v).connect(master);o.start(t);o.stop(t+.3);}
function hat(t){const s=actx.createBufferSource(),h=actx.createBiquadFilter(),v=actx.createGain();s.buffer=noiseBuf;h.type="highpass";h.frequency.value=7000;
  v.gain.setValueAtTime(.07,t);v.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(h).connect(v).connect(master);s.start(t);s.stop(t+.08);}
function playStep(n,at,tl){
  const bar=Math.floor(n/8)%4, st=n%8, ch=CH[bar];
  const nt=ch[ARP[st]]+24+(st>=4&&ARP[st]===0?12:0);
  tone(mf(nt),at,.22,"triangle",.07);
  if(st===0||st===3||st===6)tone(mf(ch[0]),at,.32,"sine",.22);
  if(tl>=MUSIC.melody_at){const m=MEL[n%32];if(m)tone(mf(m),at,.42,"sine",.13),tone(mf(m+12),at,.2,"sine",.025);}
  if(tl>=MUSIC.kick_at&&(st===0||st===4))kick(at);
  if(tl>=MUSIC.hat_at&&st%2===1)hat(at);
}
function audioTick(){
  if(!actx||actx.state!=="running")return;
  const vol=(muted?0:MUSIC.volume)*(1-P(T,TOTAL-3,3))*(playing?1:0);
  master.gain.setTargetAtTime(vol,actx.currentTime,.05);
  if(!playing||muted)return;
  const now=actx.currentTime;
  while(nextStep*SD<T+.2){const st=nextStep*SD;if(st>=T-.03&&st<TOTAL-.5)playStep(nextStep,now+Math.max(0,st-T),st);nextStep++;}
}

/* ===== 재생 엔진 ===== */
let T=0,playing=false,last=null,cur=null;
function render(t){
  let sc=SC[SC.length-1]; for(const s of SC){if(t<s.s+s.d){sc=s;break;}}
  if(cur!==sc){SC.forEach(s=>s.el.style.display="none");sc.el.style.display="block";cur=sc;}
  const lt=t-sc.s, isLast=sc===SC[SC.length-1];
  sc.el.style.opacity=P(lt,0,.25)*(isLast?1:1-P(lt,sc.d-.35,.35));
  try { sc.up(lt); } catch (e) { reportError(sc.id, e); }
  $("#seek").value=t; $("#time").textContent=`${t.toFixed(1)} / ${TOTAL.toFixed(1)}초`;
}
function frame(ts){
  if(playing){
    if(actx&&actx.state==="running"){T=baseT+(actx.currentTime-baseA);}
    else{if(last!==null)T+=(ts-last)/1000;last=ts;}
    if(T>=TOTAL){T=TOTAL;setPlay(false);}
  } else last=null;
  audioTick(); render(T); requestAnimationFrame(frame);
}
function setPlay(p){playing=p;last=null;syncAudio();$("#play").textContent=p?"❚❚ 일시정지":"▶ 재생";$("#play").setAttribute("aria-label",p?"일시정지":"재생");}
$("#seek").max=TOTAL;
$("#mute").textContent=muted?"🔇 음악 끔":"🔊 음악 켬";
$("#play").onclick=()=>{initAudio();if(T>=TOTAL)T=0;setPlay(!playing);};
$("#restart").onclick=()=>{initAudio();T=0;setPlay(true);};
$("#seek").oninput=e=>{T=+e.target.value;syncAudio();};
$("#mute").onclick=()=>{initAudio();muted=!muted;$("#mute").textContent=muted?"🔇 음악 끔":"🔊 음악 켬";syncAudio();};
function toggleFS(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}}
function toggleRec(){document.body.classList.toggle("rec");fit();}
$("#fs").onclick=toggleFS; $("#rec").onclick=toggleRec;
addEventListener("keydown",e=>{
  if(e.target.tagName==="BUTTON"&&e.code==="Space")return;
  initAudio();
  if(e.code==="Space"){e.preventDefault();$("#play").click();}
  else if(e.key==="f"||e.key==="F")toggleFS();
  else if(e.key==="h"||e.key==="H")toggleRec();
  else if(e.key==="m"||e.key==="M")$("#mute").click();
  else if(e.key==="r"||e.key==="R"){T=0;setPlay(true);}
  else if(e.key==="ArrowRight"){T=Math.min(TOTAL,T+2);syncAudio();}
  else if(e.key==="ArrowLeft"){T=Math.max(0,T-2);syncAudio();}
});
function fit(){const w=$("#wrap"),s=Math.min(w.clientWidth/1920,w.clientHeight/1080);$("#stage").style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener("resize",fit); fit();
window.__mg = { TOTAL, SC, render: t => { T = t; render(t); }, get T(){ return T; } };
requestAnimationFrame(frame);
</script>
