<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최단시간으로 보는 반사와 굴절 — 파동의 속력과 굴절률</title>
<style>
  :root {
    --bg: #f4f6fa; --panel: #ffffff; --ink: #1c2733; --sub: #5a6b7d;
    --accent: #4f46e5; --accent2: #e11d48; --ok: #059669;
    --border: #e2e7f0; --radius: 16px; --shadow: 0 1px 2px rgba(20,30,60,.05), 0 8px 24px rgba(20,30,60,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    font-family: "Pretendard", "Noto Sans KR", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    background: radial-gradient(1200px 500px at 10% -10%, #dfe4ff 0, transparent 60%), #eef1f8; color: var(--ink);
    padding: 12px; font-size: 15px;
  }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  header h1 { font-size: 1.25em; }
  header .spacer { flex: 1; }
  a.home { text-decoration:none; color:var(--sub); border:1px solid var(--border); padding:6px 14px; border-radius:999px; font-size:0.9em; white-space:nowrap; background:#fff; }

  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button { flex: 0 0 auto; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 1em; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .layout { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
  .sim-col { flex: 2 1 480px; display: flex; flex-direction: column; gap: 12px; }
  .side-col { flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px; }

  .scene-scroll { overflow-x: auto; border-radius: 12px; }
  #sceneWrap { position: relative; width: 100%; aspect-ratio: 16/10; border-radius: 8px; overflow: hidden; background: radial-gradient(circle at 50% 30%, #16233a, #060a12 75%); }
  #sceneWrap canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hoverHint { position:absolute; left:8px; bottom:8px; color:#9fb3d9; font-size:0.78em; background:rgba(6,10,18,0.55); padding:4px 8px; border-radius:6px; pointer-events:none; }
  #hoverHint:empty { display: none; }
  #simError { position:absolute; left:8px; right:8px; top:8px; color:#fff; background:rgba(214,69,69,0.92); padding:6px 10px; border-radius:6px; font-size:0.82em; white-space:pre-wrap; }

  /* 빠른 조작줄: 장면 바로 아래 */
  .quickbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin-top: 10px; padding: 8px 12px; background: #f1f4fb; border-radius: 12px; }
  .quickbar .param { display: flex; align-items: center; gap: 8px; margin: 0; }
  .quickbar .param label { display: flex; gap: 8px; margin: 0; white-space: nowrap; font-size: .9em; }
  .quickbar .param input[type=range] { width: 170px; max-width: 38vw; }
  .quickbar .row { margin: 0 !important; gap: 6px; }
  .quickbar .row button { padding: 5px 12px; font-size: .86em; }
  /* 학습 페이지(이론·실제 실험·의미·보고서) */
  .pagenav { position: sticky; top: 0; z-index: 30; display: flex; gap: 6px; overflow-x: auto; margin: 0 -12px 14px; padding: 8px 12px; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); scrollbar-width: none; }
  .pagenav button { flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 10px 16px; white-space: nowrap; font-weight: 600; color: var(--sub); background: transparent; border-color: transparent; }
  .pagenav button i { font-style: normal; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #e4e8f3; font-size: .78em; }
  .pagenav button.seen i { background: #d1fae5; color: var(--ok); }
  .pagenav button.active { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(79,70,229,.3); }
  .pagenav button.active i { background: rgba(255,255,255,.25); color: #fff; }
  .pagenav .split-btn { flex: 0 0 auto; margin-left: auto; display: none; }
  .page { display: none; }
  .page.active { display: block; }
  .page h2 { font-size: 1.3em; margin-bottom: 4px; }
  .page .lead { color: var(--sub); margin-bottom: 14px; }
  .page .card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .page .card h3 { font-size: .95em; color: var(--sub); margin-bottom: 10px; }
  .page .cmp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .page .cmp-item { border: 1px solid var(--border); border-radius: 14px; padding: 12px; background: #fbfcff; }
  .page .cmp-item h4 { font-size: .95em; margin-bottom: 8px; }
  .page img { max-width: 100%; height: auto; border-radius: 10px; }
  .page figcaption, .page .credit { font-size: .78em; color: var(--sub); line-height: 1.5; margin-top: 5px; }
  .page .eqgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .page .eqbox { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; background: linear-gradient(180deg, #fbfbff, #f3f5ff); }
  .page .eqbox .eq { font-family: Georgia, serif; font-size: 1.3em; color: var(--accent); margin-bottom: 4px; }
  .page ul.diff { padding-left: 18px; line-height: 1.75; font-size: .92em; }
  .page ol.steps { counter-reset: s; list-style: none; display: grid; gap: 8px; }
  .page ol.steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; font-size: .92em; line-height: 1.6; }
  .page ol.steps li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .85em; }
  .page .work { background: #fff8e6; border: 1px solid #f0d99a; border-radius: 12px; padding: 10px 14px; }
  .page .pane-next { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; margin-top: 16px; }
  #workarea { display: block; }
  #reportPage { display: none; }
  body[data-page="report"] #reportPage { display: block; }
  #reportPage h2 { font-size: 1.2em; }
  #reportPage .rfield { margin: 10px 0; }
  #reportPage .rfield label { display: block; font-weight: 700; margin-bottom: 3px; }
  #reportPage textarea, #reportPage input[type=text] { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 10px; font: inherit; line-height: 1.6; }
  #reportPage textarea { min-height: 76px; resize: vertical; }
  #reportPage .rauto { background: #f6f9fc; border: 1px dashed var(--border); border-radius: 10px; padding: 8px 10px; }
  a.btnlink { display: inline-block; text-decoration: none; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-size: .95em; }
  #reportPrint { display: none; }
  @media (min-width: 1100px) {
    .pagenav .split-btn.on { display: inline-block; }
    body.split .workarea-wide, body.split #workarea { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(420px, 1fr); gap: 16px; align-items: start; }
    body.split #reportPage { display: block; position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow-y: auto; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    header, .pagenav, #pageHost, #simView, #reportPage { display: none !important; }
    #reportPrint { display: block !important; }
  }
  .scenario-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .scenario-picker button { flex: 1 1 30%; min-width: 120px; padding: 8px 6px; font-size: 0.86em; border-radius: 12px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  .scenario-picker button.active { background: #eef0ff; border-color: var(--accent); color: var(--accent); font-weight: 700; }

  .param { margin-bottom: 10px; }
  .param label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; font-size: 0.92em; }
  .param label .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  .param input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--sub); font-size: 0.83em; margin-top: 2px; line-height: 1.5; }

  button { font-size: 1em; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.warn { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .controls-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.82em; color: var(--sub); margin-top: 8px; }
  .legend:empty { display: none; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .swatch.bar { border-radius: 2px; }

  table.readout { width: 100%; border-collapse: collapse; font-size: 0.92em; }
  table.readout td { padding: 4px 2px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  table.readout td:first-child { color: var(--sub); }
  table.readout td:last-child { text-align: right; font-weight: 700; }

  details { margin-top: 6px; }
  summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
  .formula-body { padding: 8px 2px; line-height: 1.8; font-size: 0.92em; }
  .formula-body .eq { font-size: 1.08em; text-align: center; margin: 6px 0; font-family: Georgia, serif; }
  .note { border-left: 3px solid var(--accent); background: #eef0ff; padding: 8px 10px; border-radius: 6px; font-size: 0.86em; margin-top: 8px; line-height: 1.6; }
  .note:empty { display: none; }
  .misconception { border-left: 3px solid var(--accent2); background: #fff0f3; padding: 8px 10px; border-radius: 6px; font-size: 0.86em; margin-top: 8px; line-height: 1.6; }

  canvas.chart { width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 6px; }

  body.projector { font-size: 19px; }
  body.projector button { padding: 12px 18px; }
  body.projector .scenario-picker button { font-size: 1em; padding: 12px 8px; }

  @media (max-width: 720px) {
    body { font-size: 16px; padding: 8px; }
    .layout { flex-direction: column; }
    .sim-col, .side-col { flex: 1 1 100%; }
    button { padding: 11px 14px; }
    input[type=range] { height: 26px; }
  }
/* ---- 레시피 입력 extra_css ---- */
@media(max-width:480px){.pagenav{margin:0 -8px 14px;padding:8px}}
</style>
</head>
<body>

<header>
  <a class="home" href="../../index.html">🏠 홈</a>
  <h1>⏱️ 최단시간으로 보는 반사와 굴절 — 파동의 속력과 굴절률</h1>
  <span class="spacer"></span>
  <button id="projectorBtn" title="프로젝터용 큰 글씨 모드">🖥 큰 글씨 모드</button>
</header>

<nav class="pagenav" id="pageNav" hidden></nav>
<div id="workarea">
<div id="mainArea">
<div id="pageHost"></div>
<div id="simView">
<div class="tabs" id="tabs"></div>

<div class="layout">

  <div class="sim-col">
    <div class="panel">
      <div class="scene-scroll"><div id="sceneWrap">
        <div id="hoverHint"></div>
        <div id="simError" hidden></div>
      </div></div>
      <div class="quickbar" id="quickbar" hidden></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="panel" id="graphPanel" hidden>
      <canvas id="chartCanvas" class="chart" width="440" height="220"></canvas>
      <div class="hint" id="chartHint"></div>
    </div>
  </div>

  <div class="side-col">

    <div class="panel" id="scenarioPanel">
      <div class="scenario-picker" id="scenarioPicker"></div>
      <div id="scenarioBody"></div>
      <div id="customPanel"></div>
    </div>

    <div class="panel" id="readoutPanel">
      <b id="readoutTitle"></b>
      <table class="readout" id="readout"></table>
      <div class="note" id="readoutNote"></div>
    </div>

    <div class="panel">
      <details id="formulaDetails">
        <summary>📐 관련 공식 보기</summary>
        <div class="formula-body" id="formulaBody"></div>
      </details>
    </div>

    <div class="panel" id="misconceptionPanel"></div>

  </div>
</div>
</div><!-- /simView -->
</div><!-- /mainArea -->
<section class="panel" id="reportPage"></section>
</div><!-- /workarea -->
<div id="reportPrint"></div>


<script>
const WS_CONFIG = {
 "title": "최단시간으로 보는 반사와 굴절 — 파동의 속력과 굴절률",
 "renderer": "canvas2d",
 "scene": {
  "aspect": "16/10",
  "hint": "노란 점 P를 끌거나 슬라이더로 옮겨 보세요"
 },
 "legend": [
  {
   "label": "A에서 B로 가는 경로",
   "color": "#ffd24a"
  },
  {
   "label": "최단 위치 P*",
   "color": "#5eead4"
  },
  {
   "label": "거울상·직선(비교)",
   "color": "#ff7aa8"
  }
 ],
 "tabs": [
  {
   "id": "a",
   "label": "① 반사 : 최단 경로"
  },
  {
   "id": "b",
   "label": "② 굴절 : 최단 시간"
  },
  {
   "id": "c",
   "label": "③ 굴절률·속력·파장"
  },
  {
   "id": "d",
   "label": "④ 전반사"
  }
 ],
 "scenarios": [
  {
   "id": "refl",
   "tab": "a",
   "name": "거울에서의 최단 경로",
   "section": "페르마 ①",
   "desc": "점 A·B·P를 직접 끌어 옮기며, A에서 출발해 거울의 한 점 P를 거쳐 B로 가는 경로 중 가장 짧은(가장 빠른) 경로를 찾아 봅니다. 같은 매질이라 시간은 길이에 비례합니다.",
   "misconception_title": "오개념: 빛이 일부러 가장 짧은 길을 계산해서 간다",
   "misconception": "빛이 미리 계산하는 것이 아닙니다. 파동은 모든 경로로 퍼지지만 시간이 극값인 경로 근처에서만 위상이 비슷해 보강되므로 그 경로가 관측됩니다. (심화) 평면 거울은 최소이지만 타원 거울은 모든 경로의 시간이 같으므로 '최소' 대신 '극값'이라 합니다.",
   "formula": [
    {
     "eq_html": "AP + PB = AP + PB′ ≥ AB′",
     "text_html": "B′ 은 거울에 대한 B 의 거울상. 곧은 선 AB′ 위의 P*에서 최소"
    },
    {
     "eq_html": "θᵢ = θᵣ",
     "text_html": "최단 경로에서 입사각과 반사각이 같다 (반사 법칙)"
    }
   ],
   "params": [
    {
     "key": "ra",
     "label": "A의 높이",
     "min": 1,
     "max": 8,
     "step": 0.5,
     "value": 5,
     "unit": "cm"
    },
    {
     "key": "rxa",
     "label": "A의 가로 위치",
     "min": 0,
     "max": 30,
     "step": 0.5,
     "value": 0,
     "unit": "cm"
    },
    {
     "key": "rb",
     "label": "B의 높이",
     "min": 1,
     "max": 8,
     "step": 0.5,
     "value": 4,
     "unit": "cm"
    },
    {
     "key": "rxb",
     "label": "B의 가로 위치",
     "min": 4,
     "max": 35,
     "step": 0.5,
     "value": 35,
     "unit": "cm"
    },
    {
     "key": "rx",
     "label": "P의 위치 x",
     "min": 0,
     "max": 35,
     "step": 0.5,
     "value": 10,
     "unit": "cm"
    }
   ],
   "quick": [
    "rx"
   ]
  },
  {
   "id": "refr",
   "tab": "b",
   "name": "경계에서의 최단 시간",
   "section": "페르마 ②",
   "desc": "점 A·B·P를 직접 끌어 옮기며, A(매질 1)에서 B(매질 2)로 가는 경로를 경계의 점 P로 바꿔 보며 걸린 시간을 비교합니다. 모래사장과 물에서 구조 요원이 달리는 문제와 같습니다.",
   "misconception_title": "오개념: 빛은 가장 짧은 거리의 경로(직선)로 간다",
   "misconception": "가장 짧은 것은 '거리'가 아니라 '시간'입니다. 직선은 거리가 최소지만, 매질마다 속력이 다르면 느린 매질을 덜 지나도록 꺾인 경로가 더 빠릅니다. n 값을 같게 하면 직선이 됩니다.",
   "formula": [
    {
     "eq_html": "T = (n₁·AP + n₂·PB) / c",
     "text_html": "n·L 은 광경로 길이(속력 c/n 으로 가는 시간 환산)"
    },
    {
     "eq_html": "dT/dx = 0  ⟹  n₁ sinθ₁ = n₂ sinθ₂",
     "text_html": "시간이 최소인 위치에서 스넬 법칙이 성립"
    }
   ],
   "params": [
    {
     "key": "fn1",
     "label": "굴절률 n₁ (위)",
     "min": 1,
     "max": 2,
     "step": 0.05,
     "value": 1
    },
    {
     "key": "fn2",
     "label": "굴절률 n₂ (아래)",
     "min": 1,
     "max": 2.5,
     "step": 0.05,
     "value": 1.5
    },
    {
     "key": "fa",
     "label": "A의 높이",
     "min": 1,
     "max": 8,
     "step": 0.5,
     "value": 5,
     "unit": "cm"
    },
    {
     "key": "fxa",
     "label": "A의 가로 위치",
     "min": 0,
     "max": 30,
     "step": 0.5,
     "value": 0,
     "unit": "cm"
    },
    {
     "key": "fb",
     "label": "B의 깊이",
     "min": 1,
     "max": 8,
     "step": 0.5,
     "value": 5,
     "unit": "cm"
    },
    {
     "key": "fxb",
     "label": "B의 가로 위치",
     "min": 4,
     "max": 35,
     "step": 0.5,
     "value": 35,
     "unit": "cm"
    },
    {
     "key": "fx",
     "label": "P의 위치 x",
     "min": 0,
     "max": 35,
     "step": 0.5,
     "value": 12,
     "unit": "cm"
    }
   ],
   "quick": [
    "fx",
    "fn2"
   ]
  },
  {
   "id": "wave",
   "tab": "c",
   "name": "굴절률과 속력·파장",
   "section": "속력 심화",
   "animated": true,
   "status_hint": "파면(마루)이 경계에서 꺾이며 간격이 바뀝니다",
   "desc": "평면파가 경계를 지날 때 진동수는 같고 속력·파장이 1/n 로 바뀌며 파면이 꺾입니다. 느린 쪽에서 빠른 쪽으로 보낼 때 임계각을 넘으면 전반사가 일어납니다.",
   "misconception_title": "오개념: 굴절하면 빛의 진동수(색)가 바뀐다",
   "misconception": "매질이 바뀌어도 진동수는 그대로이며 바뀌는 것은 속력과 파장입니다. 물속에서 색이 달라 보이지 않는 이유입니다. 파장이 짧아지는 것은 v = fλ 에서 v가 줄었기 때문입니다.",
   "formula": [
    {
     "eq_html": "n = c/v = λ₀/λ",
     "text_html": "진동수 f 는 불변"

<script>
/* ============================ 시뮬레이션 코드 (레시피 입력 sim_js) ============================ */
"use strict";
/* 1. 물리 코어 — 거리 cm, 광속 c = 30 cm/ns, 시간 ns. A=(xa,a), B=(xb,b), 경계 위 점 P=(x,0) */
const CC = 30;
const PHY = {
  Lrefl(x, a, b, xa, xb) { return Math.hypot(x - xa, a) + Math.hypot(xb - x, b); },
  Trefr(x, a, b, xa, xb, n1, n2) { return (n1 * Math.hypot(x - xa, a) + n2 * Math.hypot(xb - x, b)) / CC; },
  // T(x)는 볼록 → 삼분 탐색으로 최소점
  argmin(f, lo, hi) { for (let i = 0; i < 90; i++) { const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3; if (f(m1) < f(m2)) hi = m2; else lo = m1; } return (lo + hi) / 2; },
  xstarRefl(a, b, xa, xb) { return xa + (xb - xa) * a / (a + b); },
  xstarRefr(a, b, xa, xb, n1, n2) { return PHY.argmin(x => PHY.Trefr(x, a, b, xa, xb, n1, n2), xa, xb); },
  theta2(n1, n2, th1) { const s = n1 * Math.sin(th1) / n2; return s > 1 ? null : Math.asin(s); },
  thetaC(n1, n2) { return n1 > n2 ? Math.asin(n2 / n1) : null; },
  // 프레넬 반사율(편광 평균). 전반사면 1
  fres(n1, n2, ti) { const s = n1 * Math.sin(ti) / n2; if (s >= 1) return 1; const tt = Math.asin(s), ci = Math.cos(ti), ct = Math.cos(tt);
    const rs = (n1 * ci - n2 * ct) / (n1 * ci + n2 * ct), rp = (n2 * ci - n1 * ct) / (n2 * ci + n1 * ct); return (rs * rs + rp * rp) / 2; },
  // 광섬유: 공기→코어 입사각 θin(rad) → 코어 안 각 θ', 벽 입사각 φ = 90°−θ'
  fiber(n1, n2, thin) { const tp = Math.asin(Math.sin(thin) / n1), phi = Math.PI / 2 - tp; const NA = n1 > n2 ? Math.sqrt(n1 * n1 - n2 * n2) : 0;
    return { tp, phi, NA, accept: Math.asin(Math.min(1, NA)), guided: n1 > n2 && n1 * Math.sin(phi) >= n2 }; }
};
/* 2. 그리기 도우미: 가상 좌표 1000×625 */
const COL = { bg: '#0f1a33', text: '#e3ecff', dim: '#9db0d8', ok: '#5eead4', bad: '#ff5d73', a: '#7fd6ff', b: '#ffb454', c: '#b48cff', y: '#ffd24a', grid: 'rgba(160,190,255,.18)' };
const W0 = 1000, H0 = 625, XA = 110, PPC = 20, BY = 235, XW = 35, MINSEP = 4;
function begin(api) { const { ctx, width: w, height: h } = api; ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, w, h); const k = Math.min(w / W0, h / H0); ctx.save(); ctx.translate((w - W0 * k) / 2, (h - H0 * k) / 2); ctx.scale(k, k); return ctx; }
function txt(ctx, s, x, y, col, px, wt, al) { ctx.font = `${wt || 600} ${px || 18}px sans-serif`; ctx.fillStyle = col || COL.text; ctx.textAlign = al || 'left'; ctx.fillText(s, x, y); ctx.textAlign = 'left'; }
function line(ctx, x0, y0, x1, y1, col, lw, dash) { ctx.beginPath(); ctx.setLineDash(dash || []); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.strokeStyle = col; ctx.lineWidth = lw || 2; ctx.lineCap = 'round'; ctx.stroke(); ctx.setLineDash([]); }
function dot(ctx, x, y, r, col) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = col; ctx.fill(); }
function halo(ctx, x, y) { ctx.beginPath(); ctx.setLineDash([4, 5]); ctx.arc(x, y, 22, 0, 7); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]); }
function arrow(ctx, x0, y0, x1, y1, col, lw = 3) {
  const len = Math.hypot(x1 - x0, y1 - y0); if (len < 3) return; const a = Math.atan2(y1 - y0, x1 - x0), hd = Math.min(13, len * .5);
  line(ctx, x0, y0, x1 - Math.cos(a) * hd * .7, y1 - Math.sin(a) * hd * .7, col, lw);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - hd * Math.cos(a - .4), y1 - hd * Math.sin(a - .4)); ctx.lineTo(x1 - hd * Math.cos(a + .4), y1 - hd * Math.sin(a + .4)); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
const f1 = (v, d) => (+v).toFixed(d === undefined ? 1 : d);
const deg = r => r * 180 / Math.PI, rad = d => d * Math.PI / 180;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd2 = v => Math.round(v * 2) / 2;

/* A·B·P 기하: 키 접두사 k = 'r'(반사) | 'f'(굴절). B가 xb 쪽으로 최소 간격을 지키도록 보정 */
function G(P, k) {
  const xa = P[k + 'xa'], a = P[k + 'a'], b = P[k + 'b']; let xb = P[k + 'xb']; if (xb < xa + MINSEP) xb = xa + MINSEP;
  return { xa, xb, a, b, x: clamp(P[k + 'x'], xa, xb) };
}

/* P 위치에 따른 값 그래프: x는 xa..xb */
function drawGraph(ctx, fn, x0, x1, xcur, xstar, ylabel, fmt) {
  const gx0 = XA, gx1 = XA + XW * PPC, gy0 = 430, gy1 = 585;
  let mn = 1e9, mx = -1e9; const pts = [];
  for (let i = 0; i <= 140; i++) { const x = x0 + (x1 - x0) * i / 140, y = fn(x); pts.push([x, y]); mn = Math.min(mn, y); mx = Math.max(mx, y); }
  const span = Math.max(mx - mn, 1e-9), lo = mn - span * .08, hi = mx + span * .08;
  const X = x => gx0 + (x - x0) / (x1 - x0) * (gx1 - gx0), Y = y => gy1 - (y - lo) / (hi - lo) * (gy1 - gy0);
  ctx.fillStyle = 'rgba(160,190,255,.06)'; ctx.fillRect(gx0, gy0, gx1 - gx0, gy1 - gy0);
  line(ctx, gx0, gy1, gx1, gy1, COL.dim, 2); line(ctx, gx0, gy0, gx0, gy1, COL.dim, 2);
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))); ctx.strokeStyle = COL.a; ctx.lineWidth = 3.5; ctx.stroke();
  const ys = fn(xstar); line(ctx, gx0, Y(ys), gx1, Y(ys), 'rgba(94,234,212,.5)', 1.5, [6, 6]);
  line(ctx, X(xstar), gy0, X(xstar), gy1, 'rgba(94,234,212,.5)', 1.5, [6, 6]); dot(ctx, X(xstar), Y(ys), 8, COL.ok);
  line(ctx, X(xcur), gy0, X(xcur), gy1, 'rgba(255,210,74,.5)', 1.5, [3, 5]); dot(ctx, X(xcur), Y(fn(xcur)), 9, COL.y);
  txt(ctx, 'P의 위치 (A~B 사이) →', gx1, gy1 + 22, COL.dim, 14, 600, 'right'); txt(ctx, ylabel, gx0, gy0 - 8, COL.dim, 14);
  txt(ctx, '최소 ' + fmt(ys), Math.min(gx1 - 4, X(xstar) + 12), Math.max(gy0 + 16, Y(ys) - 10), COL.ok, 14, 700, X(xstar) > gx1 - 150 ? 'right' : 'left');

    row.className = "row"; row.style.marginBottom = "8px"; row.dataset.ckey = c.key;
    if (c.label) { const l = document.createElement("b"); l.style.fontSize = "0.9em"; l.textContent = c.label; row.appendChild(l); }
    c.options.forEach(o => {
      const b = document.createElement("button");
      b.textContent = o.label;
      b.className = P[c.key] === o.value ? "primary" : ""; b.dataset.val = String(o.value);
      b.addEventListener("click", () => {
        P[c.key] = o.value;
        row.querySelectorAll("button").forEach(x => x.className = "");
        b.className = "primary";
        call("update");
      });
      row.appendChild(b);
    });
    return row;
  }

  function renderControls() {
    const s = current();
    const body = $("scenarioBody");
    body.innerHTML = "";
    if (s.desc || s.section) {
      const p = document.createElement("p");
      p.className = "hint"; p.style.marginBottom = "10px";
      if (s.section) { const b = document.createElement("b"); b.textContent = s.section; p.appendChild(b); if (s.desc) p.appendChild(document.createTextNode(" — ")); }
      if (s.desc) p.appendChild(document.createTextNode(s.desc));
      body.appendChild(p);
    }
    const qk = new Set(s.quick || []);
    const qbar = $("quickbar"); qbar.innerHTML = "";
    const place = (key, el) => (qk.has(key) ? qbar : body).appendChild(el);
    (s.choices || []).forEach(c => place(c.key, choiceEl(c)));
    (s.params || []).forEach(p => place(p.key, sliderEl(p)));
    if (s.animated) {
      const st = document.createElement("div");
      st.className = "hint"; st.id = "wsStatus";
      st.textContent = s.status_hint || "";
      body.appendChild(st);
      const row = document.createElement("div");
      row.className = "controls-row";
      const play = document.createElement("button");
      play.id = "playBtn"; play.className = "primary";
      play.addEventListener("click", () => { ui.playing = !ui.playing; updatePlayButton(); });
      const reset = document.createElement("button");
      reset.textContent = "↺ 리셋";
      reset.addEventListener("click", () => { ui.playing = false; updatePlayButton(); call("reset"); call("update"); });
      row.append(play, reset);
      body.appendChild(row);
      updatePlayButton();
    }
    const cp = C.common_params;
    if (cp && s.use_common !== false) {
      const hr = document.createElement("hr");
      hr.style.cssText = "margin:10px 0;border:none;border-top:1px solid var(--border)";
      body.appendChild(hr);
      if (cp.title) { const b = document.createElement("b"); b.style.fontSize = "0.9em"; b.textContent = cp.title; body.appendChild(b); }
      cp.params.forEach(p => place(p.key, sliderEl(p)));
    }
    qbar.hidden = !qbar.children.length;
  }

  function updatePlayButton() {
    const b = $("playBtn");
    if (b) b.textContent = ui.playing ? "⏸ 일시정지" : "▶ 재생";
  }

  function renderFormula() {
    const s = current();
    const body = $("formulaBody");
    body.innerHTML = (s.formula || []).map(f =>
      (f.eq_html ? `<div class="eq">${f.eq_html}</div>` : "") + (f.text_html || "")
    ).join("");
  }

  function renderMisconception() {
    const s = current();
    const panel = $("misconceptionPanel");
    panel.innerHTML = "";
    panel.hidden = !s.misconception;
    if (!s.misconception) return;
    const box = document.createElement("div");
    box.className = "misconception";
    const b = document.createElement("b");
    b.textContent = s.misconception_title || "💡 흔한 오개념";
    box.append(b, document.createElement("br"), document.createTextNode(s.misconception));
    panel.appendChild(box);
  }

  function enterScenario() {
    ui.playing = false;
    const s = current();
    $("graphPanel").hidden = !s.chart;
    $("chartHint").innerHTML = "";
    api.custom.innerHTML = "";
    api.setReadout([]); api.setNote("");
    renderPicker(); renderControls(); renderFormula(); renderMisconception();
    call("enter");
    call("update");
  }

  function selectScenario(id) {
    ui.scenarioId = id;
    lastScenarioOfTab[ui.tab] = id;
    enterScenario();
  }

  function switchTab(tab) {
    ui.tab = tab;
    renderTabs();
    selectScenario(lastScenarioOfTab[tab] || scenariosOfTab(tab)[0].id);
  }

  function renderLegend() {
    const box = $("legend");
    (C.legend || []).forEach(l => {
      const span = document.createElement("span");
      const sw = document.createElement("i");
      sw.className = "swatch" + (l.shape === "bar" ? " bar" : "");
      sw.style.background = l.color;
      span.append(sw, document.createTextNode(l.label));
      box.appendChild(span);
    });
  }

  function runSelfTests() {
    if (!SIMOBJ || typeof SIMOBJ.tests !== "function") { console.log("물리 검증 항목 없음"); return; }
    let results = [];
    try { results = SIMOBJ.tests() || []; } catch (e) { showError("tests", e); return; }
    console.log("=== " + C.title + " 물리 검증 ===");
    let pass = 0;
    for (const [name, ok, detail] of results) {
      console.log(`[${ok ? "PASS" : "FAIL"}] ${name}${detail ? " — " + detail : ""}`);
      if (ok) pass++;
    }
    console.log(pass === results.length ? "모든 검증 통과" : "일부 검증 실패 — 콘솔 확인 필요");
    window.__wsSelfTest = { pass, total: results.length };
  }


  /* ---------- 학습 페이지 · 보고서 (선택) ---------- */
  const PAGES = C.pages || [];
  const REPORT = C.report || null;
  const pageIds = [];
  let curPage = "sim";
  function showPage(id) {
    if (!pageIds.includes(id)) id = "sim";
    curPage = id; document.body.dataset.page = id;
    document.querySelectorAll("#pageHost .page").forEach(el => el.classList.toggle("active", el.dataset.page === id));
    $("simView").style.display = id === "sim" ? "" : "none";
    document.querySelectorAll("#pageNav button[data-page]").forEach(b => { b.classList.toggle("active", b.dataset.page === id); if (b.dataset.page === id) b.classList.add("seen"); });
    if (id === "sim") onResize();
    if (id === "report" || document.body.classList.contains("split")) refreshReport();
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
    window.scrollTo({ top: 0 });
  }
  function setSplit(on) {
    if (on && window.innerWidth < 1100) { alert("분할뷰는 화면 가로 1100px 이상에서 쓸 수 있어요."); return; }
    document.body.classList.toggle("split", on);
    const b = $("splitBtn"); if (b) b.textContent = on ? "◫ 분할뷰 끄기" : "◫ 보고서 나란히 쓰기";
    if (on) { if (curPage === "report") showPage("sim"); refreshReport(); }
    onResize();
  }
  function buildPages() {
    if (!PAGES.length && !REPORT) { pageIds.push("sim"); return; }
    const nav = $("pageNav"); nav.hidden = false;
    const order = [];
    PAGES.filter(p => p.position !== "after").forEach(p => order.push(p));
    order.push({ id: "sim", label: C.sim_label || "🕹 시뮬레이션" });
    PAGES.filter(p => p.position === "after").forEach(p => order.push(p));
    if (REPORT) order.push({ id: "report", label: REPORT.label || "📝 보고서" });
    order.forEach((p, i) => {
      pageIds.push(p.id);
      const b = document.createElement("button"); b.dataset.page = p.id;
      b.innerHTML = "<i>" + (i + 1) + "</i>" + p.label;
      b.addEventListener("click", () => showPage(p.id));
      nav.appendChild(b);
      if (p.id !== "sim" && p.id !== "report") {
        const sec = document.createElement("section"); sec.className = "page"; sec.dataset.page = p.id; sec.innerHTML = p.html || "";
        $("pageHost").appendChild(sec);
      }
    });
    if (REPORT) {
      const sb = document.createElement("button"); sb.className = "split-btn on"; sb.id = "splitBtn"; sb.textContent = "◫ 보고서 나란히 쓰기";
      sb.addEventListener("click", () => setSplit(!document.body.classList.contains("split")));
      nav.appendChild(sb);
      buildReport();
    }
    document.body.addEventListener("click", (ev) => {
      const t = ev.target.closest("[data-go]"); if (!t) return;
      ev.preventDefault(); const g = t.dataset.go;
      if (g === "split") setSplit(true); else showPage(g);
    });
    window.addEventListener("resize", () => { if (window.innerWidth < 1100 && document.body.classList.contains("split")) setSplit(false); });
    const h = (location.hash || "").slice(1);
    showPage(pageIds.includes(h) ? h : order[0].id);
  }
  /* 보고서: 입력칸은 이 브라우저(localStorage)에만 저장. 이름·학번 칸은 두지 않는다. */
  const REP_KEY = "wsreport:" + (C.title || "sim");
  function repFields() { return (REPORT.sections || []).map(s => s.id); }
  function buildReport() {
    const R = REPORT, root = $("reportPage");
    let h = "<h2>" + (R.title || "📝 실험보고서") + "</h2>" + (R.intro ? '<p class="hint">' + R.intro + "</p>" : "");
    h += '<div class="rfield"><label>자동으로 들어오는 결과</label><div class="rauto" id="reportAuto">시뮬레이션에서 측정하면 여기에 나타나요.</div></div>';
    (R.sections || []).forEach(sec => {
      h += '<div class="rfield"><label for="rf_' + sec.id + '">' + sec.label + '</label><textarea id="rf_' + sec.id + '" placeholder="' + (sec.placeholder || "").replace(/"/g, "&quot;") + '"></textarea></div>';
    });
    h += '<div class="controls-row">' + (R.template_href ? '<a class="btnlink" href="' + R.template_href + '" download="' + (R.template_name || "") + '">⬇ 한글(.hwpx) 양식 받기</a>' : "") +
      '<button class="primary" id="repPrint">🖨 인쇄 / PDF</button><button id="repHtml">⬇ HTML 저장</button><button id="repClear">초안 지우기</button></div>';
    root.innerHTML = h;
    try { const o = JSON.parse(localStorage.getItem(REP_KEY) || "null"); if (o) repFields().forEach(k => { if (typeof o[k] === "string") $("rf_" + k).value = o[k]; }); } catch (e) {}
    repFields().forEach(k => $("rf_" + k).addEventListener("input", () => {
      const o = {}; repFields().forEach(x => o[x] = $("rf_" + x).value);
      try { localStorage.setItem(REP_KEY, JSON.stringify(o)); } catch (e) {}
    }));
    $("repPrint").addEventListener("click", () => { $("reportPrint").innerHTML = reportDoc(); window.print(); });
    $("repHtml").addEventListener("click", () => {
      const doc = '<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>' + (R.title || "보고서") + '</title></head><body>' + reportDoc() + "</body></html>";
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([doc], { type: "text/html" })); a.download = (R.file_name || "report") + ".html"; a.click(); URL.revokeObjectURL(a.href);
    });
    $("repClear").addEventListener("click", () => { if (confirm("쓴 내용을 모두 지울까요?")) { repFields().forEach(k => $("rf_" + k).value = ""); try { localStorage.removeItem(REP_KEY); } catch (e) {} } });
    window.addEventListener("afterprint", () => { $("reportPrint").innerHTML = ""; });
  }
  const escH = (t) => String(t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  function reportDoc() {
    const R = REPORT;
    return '<style>body{font-family:"Malgun Gothic",sans-serif;line-height:1.7}h2{border-bottom:1px solid #999;margin-top:1.1em}table{border-collapse:collapse}th,td{border:1px solid #999;padding:3px 8px}</style><h1>' + escH(R.title || "보고서") +
      '</h1><p>반 · 번호 · 이름: ________________</p>' + '<h2>결과</h2>' + ($("reportAuto").innerHTML) +
      (R.sections || []).map(s => "<h2>" + s.label + "</h2><p>" + (escH($("rf_" + s.id).value).replace(/\n/g, "<br>") || "&nbsp;") + "</p>").join("");
  }
  function refreshReport() {
    if (!REPORT) return;
    const html = call("reportAuto");
    if (typeof html === "string") $("reportAuto").innerHTML = html;
  }
  api.report = { refresh: refreshReport };

  /* ---------- 시작 ---------- */
  if (C.scene && C.scene.min_width) wrap.style.minWidth = C.scene.min_width + "px";
  $("readoutTitle").textContent = C.readout_title || "측정값";
  $("hoverHint").textContent = (C.scene && C.scene.hint != null) ? C.scene.hint
    : (C.renderer === "three" ? "마우스 드래그: 회전 · 휠: 확대/축소" : "");
  $("projectorBtn").addEventListener("click", () => document.body.classList.toggle("projector"));
  renderLegend();
  if (!SIMOBJ) showError("load", "sim_js에 SIM 객체가 정의되지 않았습니다");
  if (initRenderer()) {
    call("init");
    renderTabs();
    switchTab(ui.tab);
    animate();
  }
  buildPages();
  runSelfTests();
})();
</script>

</body>
