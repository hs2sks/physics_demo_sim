<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빛의 중첩과 간섭 — 토머스 영과 함께</title>
<link rel="stylesheet" href="../common/og.css?v=3">
<style>
  :root { --bg:#f4f6fa; --panel:#fff; --ink:#1c2733; --sub:#5a6b7d; --accent:#1f6fd6; --border:#d7dee8; --radius:12px;
          --c1:#d98a00; --c2:#1f6fd6; --cs:#1e8f4e; --cph:#8a5bd6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  [hidden] { display:none !important; }
  body { font-family:"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); padding:12px; font-size:15px; line-height:1.55; }
  .wrap { max-width:1180px; margin:0 auto; }
  header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  header h1 { font-size:1.25em; }
  .spacer { flex:1; }
  .navbtn { text-decoration:none; color:var(--sub); border:1px solid var(--border); padding:7px 13px; border-radius:9px; font-size:.9em; white-space:nowrap; background:#fff; }
  .navbtn:hover { color:var(--accent); border-color:var(--accent); }

  .tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .tabs button { flex:1 1 220px; padding:11px 14px; border-radius:10px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:1em; font-weight:600; color:var(--ink); }
  .tabs button small { display:block; font-weight:400; color:var(--sub); font-size:.8em; }
  .tabs button.active { background:var(--ink); border-color:var(--ink); color:#fff; }
  .tabs button.active small { color:#c3cfdb; }

  .layout { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:12px; align-items:start; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:12px; }
  .ph { display:flex; align-items:center; gap:8px; padding:7px 12px; background:#eef3fa; border-bottom:1px solid var(--border); font-size:.86em; font-weight:700; }
  .dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .ph .hint { margin-left:auto; font-weight:400; color:var(--sub); font-size:.9em; }
  canvas.cv { display:block; width:100%; background:#0c1119; }
  .sub { font-size:.74em; color:var(--sub); padding:5px 12px 0; background:var(--panel); }

  .side { position:sticky; top:8px; }
  .box { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; }
  .box > h2 { font-size:.9em; padding:8px 12px; background:#eef3fa; border-bottom:1px solid var(--border); }
  .box .body { padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--border); background:#fff; border-radius:20px; padding:7px 12px; cursor:pointer; font-size:.88em; font-weight:600; min-height:36px; color:var(--ink); }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row label { display:flex; justify-content:space-between; font-size:.84em; color:var(--sub); }
  .row label b { color:var(--ink); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; height:30px; margin:0; cursor:pointer; accent-color:var(--accent); }
  .w1 input { accent-color:var(--c1); } .w2 input { accent-color:var(--c2); } .wp input { accent-color:var(--cph); }
  .btns { display:flex; gap:6px; }
  .btns button { flex:1; min-height:40px; border-radius:9px; border:1px solid var(--border); background:#fff; font-weight:700; cursor:pointer; font-size:.9em; }
  .btns button.primary { background:var(--cs); border-color:var(--cs); color:#fff; }
  .check { display:flex; align-items:center; gap:8px; font-size:.9em; cursor:pointer; min-height:32px; }
  .check input { width:20px; height:20px; }

  .result { text-align:center; }
  .badge { display:inline-block; padding:5px 16px; border-radius:20px; font-weight:800; font-size:1.05em; color:#fff; }
  .b-c { background:#d98a00; } .b-d { background:#1f6fd6; } .b-p { background:#1e8f4e; } .b-n { background:#8a5bd6; }
  .readout { font-size:.9em; line-height:1.7; text-align:left; margin-top:8px; font-variant-numeric:tabular-nums; }
  .eq { font-family:Georgia,"Times New Roman",serif; font-size:.9em; color:var(--sub); line-height:1.7; }
  .probe { background:#f2f8f4; border:1px solid #cfe9d8; border-radius:9px; padding:8px 10px; font-size:.9em; line-height:1.6; }
  .probe.wait { background:#f5f2ea; border-color:var(--border); color:var(--sub); }

  @media (max-width:860px) { .layout { grid-template-columns:1fr; } .side { display:contents; } .side .box:nth-child(-n+2) { order:-1; } }
</style>
</head>
<body>
<div class="wrap" id="app">

<header>
  <a class="navbtn" href="../../index.html">🏠 홈</a>
  <a class="navbtn" href="../index.html">← 광학으로</a>
  <h1>🌊 빛의 중첩과 간섭</h1>
  <span class="spacer"></span>
</header>

<div id="personaHost"></div>
<div id="howtoHost"></div>

<div class="tabs" id="tabs" role="tablist">
  <button data-mode="1d" class="active" role="tab">① 두 파동 겹치기<small>한 줄 위에서 y = y₁ + y₂</small></button>
  <button data-mode="2d" role="tab">② 물결 두 파원<small>평면에서 생기는 간섭 무늬</small></button>
</div>

<!-- ═════ ① 1차원 ═════ -->
<div id="mode1d" class="layout">
  <div class="main">
    <div id="missions1Host"></div>
    <div class="panel">
      <div class="ph"><span class="dot" style="background:var(--c1)"></span>파동 1 <span class="hint">주황 · 위로 갈수록 +</span></div>
      <canvas class="cv" id="c1"></canvas>
    </div>
    <div class="panel">
      <div class="ph"><span class="dot" style="background:var(--c2)"></span>파동 2 <span class="hint">파랑</span></div>
      <canvas class="cv" id="c2"></canvas>
    </div>
    <div class="panel">
      <div class="ph"><span class="dot" style="background:var(--cs)"></span>합성파 (중첩) <span class="hint">연한 선은 원래 두 파동</span></div>
      <canvas class="cv" id="cPos"></canvas>
      <div class="sub">시간에 따른 변위 — 관측점 x = 0 에서 최근 6초</div>
      <canvas class="cv" id="cTime"></canvas>
    </div>
  </div>
  <aside class="side">
    <div class="box">
      <h2>🎛 바로 해 보기</h2>
      <div class="body">
        <div class="chips" id="presets"></div>
      </div>
    </div>
    <div class="box">
      <h2>합성 결과</h2>
      <div class="body result">
        <div><span id="badge" class="badge b-c">보강간섭</span></div>
        <div class="readout" id="readout"></div>
      </div>
    </div>
    <div class="box w1">
      <h2 style="color:var(--c1)">파동 1</h2>
      <div class="body">
        <div class="row"><label>진폭 A₁ <b id="lA1"></b></label><input type="range" id="sA1" min="0" max="2" step="0.1" value="1"></div>
        <div class="row"><label>파장 λ₁ (cm) <b id="lL1"></b></label><input type="range" id="sL1" min="4" max="20" step="0.5" value="10"></div>
        <div class="row"><label>진동수 f₁ (Hz) <b id="lF1"></b></label><input type="range" id="sF1" min="0.2" max="3" step="0.1" value="1"></div>
      </div>
    </div>
    <div class="box w2">
      <h2 style="color:var(--c2)">파동 2</h2>
      <div class="body">
        <div class="row"><label>진폭 A₂ <b id="lA2"></b></label><input type="range" id="sA2" min="0" max="2" step="0.1" value="1"></div>
        <div class="row"><label>파장 λ₂ (cm) <b id="lL2"></b></label><input type="range" id="sL2" min="4" max="20" step="0.5" value="10"></div>
        <div class="row"><label>진동수 f₂ (Hz) <b id="lF2"></b></label><input type="range" id="sF2" min="0.2" max="3" step="0.1" value="1"></div>
        <div class="row wp"><label style="color:var(--cph)">위상차 Δφ (°) <b id="lPh"></b></label><input type="range" id="sPh" min="0" max="360" step="5" value="0"></div>
      </div>
    </div>
    <div class="box">
      <h2>재생</h2>
      <div class="body">
        <div class="btns"><button id="btnPlay" class="primary">⏸ 일시정지</button><button id="btnReset">↺ 처음으로</button></div>
        <div class="row"><label>속도 <b id="lSpd"></b></label><input type="range" id="sSpd" min="0.1" max="3" step="0.1" value="1"></div>
        <div class="eq" id="eq"></div>
      </div>
    </div>
  </aside>
</div>

<!-- ═════ ② 2차원 ═════ -->
<div id="mode2d" class="layout" hidden>
  <div class="main">
    <div id="missions2Host"></div>
    <div class="panel">
      <div class="ph"><span class="dot" style="background:#5fd3ff"></span>물결 수조 (위에서 본 모습) <span class="hint">화면을 눌러 그 지점을 조사하세요</span></div>
      <canvas class="cv" id="cField" style="cursor:crosshair;touch-action:none"></canvas>
    </div>
    <div id="compare2Host"></div>
  </div>
  <aside class="side">
    <div class="box">
      <h2>🔎 조사한 지점</h2>
      <div class="body"><div class="probe wait" id="probe">수조 위를 눌러 보세요. 두 파원까지 거리의 차(경로차)를 알려 줍니다.</div></div>
    </div>
    <div class="box">
      <h2>장치 설정</h2>
      <div class="body">
        <div class="row"><label>파원 간격 d (cm) <b id="lD"></b></label><input type="range" id="sD" min="2" max="12" step="0.5" value="6"></div>
        <div class="row"><label>파장 λ (cm) <b id="lLam"></b></label><input type="range" id="sLam" min="1" max="4" step="0.1" value="2"></div>
        <div class="row wp"><label style="color:var(--cph)">두 파원의 위상차 (°) <b id="lP2"></b></label><input type="range" id="sP2" min="0" max="360" step="5" value="0"></div>
        <label class="check"><input type="checkbox" id="ckAvg"> 시간 평균 밝기로 보기</label>
        <label class="check"><input type="checkbox" id="ckNode" checked> 상쇄 마디선 표시</label>
        <div class="btns"><button id="btnPlay2" class="primary">⏸ 일시정지</button></div>
      </div>
    </div>
    <div class="box">
      <h2>세어 보기</h2>
      <div class="body"><div class="readout" id="count2"></div></div>
    </div>
  </aside>
</div>

<div style="height:8px"></div>
</div>

<script src="../common/og.js?v=3"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const TAU = Math.PI * 2;
const dpr = () => Math.min(window.devicePixelRatio || 1, 2);

/* ───────── 공통 캔버스 ───────── */
function fit(cv, cssH) {
  const r = dpr(), w = Math.max(200, cv.clientWidth);
  cv.style.height = cssH + "px";
  if (cv.width !== Math.round(w * r) || cv.height !== Math.round(cssH * r)) { cv.width = Math.round(w * r); cv.height = Math.round(cssH * r); }
  const ctx = cv.getContext("2d"); ctx.setTransform(r, 0, 0, r, 0, 0);
  return { ctx, W: w, H: cssH };
}

/* ───────── 안내 (토머스 영) ───────── */
const guide = OG.persona($("personaHost"), { who: "young", lines: [
  "저는 의사이자 물리학자인 <b>토머스 영</b>입니다. 1800년대 초, 모두가 뉴턴을 믿어 <b>빛은 작은 입자</b>라고 여기던 때에 저는 <b>빛도 물결처럼 서로 겹쳐질 것</b>이라 생각했습니다.",
  "물결 수조에서 두 물결이 만나는 곳을 보세요. 어떤 곳은 물결이 <b>높아지고</b>, 어떤 곳은 <b>잔잔해집니다</b>. 입자 두 개가 만나서는 이런 일이 생길 수 없죠. 이것이 <b>간섭</b>입니다.",
  "중첩의 원리는 간단합니다. 두 파동이 같은 곳을 지날 때 <b>변위는 그냥 더해집니다</b> (y = y₁ + y₂). 오른쪽의 <b>‘바로 해 보기’</b>부터 눌러 보세요.",
  "<b>마루와 마루</b>가 만나면 커지고(보강), <b>마루와 골</b>이 만나면 작아집니다(상쇄). 이 차이를 만드는 것이 <b>위상차</b>입니다. 위상차 슬라이더를 천천히 돌려 보세요."
] });

OG.howto($("howtoHost"), [
  "<b>① 두 파동 겹치기</b>에서 오른쪽 <b>‘바로 해 보기’</b> 버튼으로 대표 상황을 먼저 봅니다.",
  "슬라이더로 <b>진폭·파장·진동수·위상차</b>를 바꾸고, 맨 아래 초록 선(합성파)이 어떻게 변하는지 봅니다.",
  "<b>🎯 해 보기</b>의 네 가지를 모두 체크해 보세요. 영 선생님이 반응해 줍니다.",
  "<b>② 물결 두 파원</b>으로 넘어가 화면을 눌러 경로차를 조사하고, 실제 물결 수조 사진과 비교합니다."
], { title: "처음이면 이렇게 사용하세요", open: false });

/* ═══════════ ① 1차원 중첩 ═══════════ */
const P = { A1:1, L1:10, F1:1, A2:1, L2:10, F2:1, ph:0, spd:1 };
const DEFAULT = { ...P };
let T = 0, playing = true, lastTs = null;
const XL = 40;                                    // 화면 가로 = 40 cm
const rad = (d) => d * Math.PI / 180;
const y1 = (x, t) => P.A1 * Math.sin(TAU / P.L1 * x - TAU * P.F1 * t);
const y2 = (x, t) => P.A2 * Math.sin(TAU / P.L2 * x - TAU * P.F2 * t + rad(P.ph));
const ys = (x, t) => y1(x, t) + y2(x, t);

const sliders = { A1:["sA1","lA1",1], L1:["sL1","lL1",1], F1:["sF1","lF1",1], A2:["sA2","lA2",1], L2:["sL2","lL2",1], F2:["sF2","lF2",1], ph:["sPh","lPh",0], spd:["sSpd","lSpd",1] };
function syncSliders() {
  for (const k in sliders) { const [s, l, d] = sliders[k]; $(s).value = P[k]; $(l).textContent = (+P[k]).toFixed(d) + (k === "ph" ? "°" : k === "spd" ? "×" : ""); }
}
for (const k in sliders) $(sliders[k][0]).addEventListener("input", (e) => { P[k] = +e.target.value; changed(); });

const PRESETS = [
  { id:"con", label:"보강간섭",     set:{ ph:0 } },
  { id:"des", label:"완전 상쇄",    set:{ ph:180 } },
  { id:"par", label:"부분 상쇄",    set:{ A2:0.6, ph:180 } },
  { id:"q",   label:"위상차 90°",   set:{ ph:90 } },
  { id:"beat",label:"진동수가 다를 때", set:{ F2:1.3 } }
];
const presetsEl = $("presets");
PRESETS.forEach((p) => {
  const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = p.label; b.dataset.id = p.id;
  b.onclick = () => { Object.assign(P, DEFAULT, p.set); T = 0; changed(p.id); };
  presetsEl.append(b);
});

/* 상태 판정 */
function classify() {
  const sameLam = Math.abs(P.L1 - P.L2) < 0.25, sameF = Math.abs(P.F1 - P.F2) < 0.05;
  const ph = ((P.ph % 360) + 360) % 360;
  if (!(sameLam && sameF)) return { key:"beat", text:"진동수·파장이 달라요", cls:"b-n", amp:null };
  const amp = Math.sqrt(P.A1*P.A1 + P.A2*P.A2 + 2*P.A1*P.A2*Math.cos(rad(ph)));
  if (P.A1 === 0 || P.A2 === 0) return { key:"one", text:"한쪽 진폭이 0", cls:"b-p", amp };
  if (ph < 15 || ph > 345) return { key:"con", text:"보강간섭", cls:"b-c", amp };
  if (Math.abs(ph - 180) < 15) return amp < 0.05 ? { key:"des", text:"완전 상쇄", cls:"b-d", amp } : { key:"par-des", text:"상쇄(부분)", cls:"b-d", amp };
  return { key:"mid", text:"중간 간섭", cls:"b-p", amp };
}
function updateReadout() {
  const c = classify(), b = $("badge"); b.textContent = c.text; b.className = "badge " + c.cls;
  const ph = ((P.ph % 360) + 360) % 360;
  let h;
  if (c.amp != null) {
    h = `합성 진폭 A = √(A₁²+A₂²+2A₁A₂cosΔφ)<br><b>= ${c.amp.toFixed(2)}</b> (A₁+A₂ = ${(P.A1+P.A2).toFixed(1)}, |A₁−A₂| = ${Math.abs(P.A1-P.A2).toFixed(1)})<br>경로차로 환산: Δ = ${(ph/360).toFixed(2)} λ`;
  } else {
    const fb = Math.abs(P.F1 - P.F2);
    h = `두 파동의 진동수·파장이 같지 않아 <b>위상차가 시간에 따라 계속 바뀝니다.</b><br>아래 시간 그래프의 진폭이 커졌다 작아졌다 하는 <b>맥놀이</b>를 보세요 (진동수 차 ${fb.toFixed(1)} Hz).`;
  }
  $("readout").innerHTML = h;
  const k1 = (TAU / P.L1).toFixed(2), k2 = (TAU / P.L2).toFixed(2);
  $("eq").innerHTML = `y₁ = ${P.A1.toFixed(1)} sin(${k1}x − ${(TAU*P.F1).toFixed(2)}t)<br>y₂ = ${P.A2.toFixed(1)} sin(${k2}x − ${(TAU*P.F2).toFixed(2)}t + ${Math.round(P.ph)}°)<br><b>y = y₁ + y₂</b>`;
}

/* 미션 */
const m1 = OG.missions($("missions1Host"), [
  { id:"con", text:"<b>보강간섭</b> 만들기 — 진폭 같게, 위상차 0°로 두고 합성 진폭이 A₁+A₂가 되는지 확인", say:"그렇습니다. 마루가 마루를 만나 진폭이 <b>두 배</b>가 되었군요. 이것이 보강간섭입니다." },
  { id:"des", text:"<b>완전 상쇄</b> 만들기 — 진폭을 같게 하고 위상차를 180°로 → 합성파가 평평해짐", say:"파동 둘이 만났는데 <b>아무것도 남지 않았습니다</b>. 입자라면 설명할 수 없는 일입니다. 에너지는 사라진 것이 아니라 다른 곳으로 모입니다." },
  { id:"par", text:"<b>부분 상쇄</b> — 진폭을 다르게 하고 위상차를 180°로 → 합성 진폭이 |A₁−A₂|", say:"진폭이 다르면 상쇄가 <b>완전하지 않습니다</b>. 남는 것은 큰 파동에서 작은 파동을 뺀 만큼이지요." },
  { id:"beat", text:"<b>진동수 다르게</b> 해서 시간 그래프의 진폭이 커졌다 작아졌다(맥놀이) 하는지 보기", say:"위상차가 시간에 따라 변하니 보강과 상쇄가 <b>번갈아</b> 나타납니다. 악기 조율할 때 듣는 ‘웅웅’ 소리도 같은 원리입니다." }
], { title:"해 보기 (1차원)", onDone:(m, all) => { guide.say(m.say + (all ? "<br><b>네 가지를 모두 해냈군요!</b> 이제 ② 물결 두 파원으로 넘어가 평면에서도 확인해 보세요." : "")); } });
function checkMissions1() {
  const c = classify();
  if (c.key === "con" && Math.abs(P.A1 - P.A2) < 0.05 && P.A1 >= 0.5) m1.done("con");
  if (c.key === "des" && P.A1 >= 0.5) m1.done("des");
  if (c.key === "par-des" && Math.abs(P.A1 - P.A2) >= 0.3 && Math.min(P.A1, P.A2) >= 0.3) m1.done("par");
  if (c.key === "beat" && Math.abs(P.F1 - P.F2) >= 0.2 && Math.abs(P.L1 - P.L2) < 0.25 && T > 0) m1.done("beat");
}
function changed(presetId) {
  syncSliders(); updateReadout();
  document.querySelectorAll("#presets .chip").forEach((c) => c.classList.toggle("on", c.dataset.id === presetId));
  if (!presetId) document.querySelectorAll("#presets .chip.on").forEach((c) => c.classList.remove("on"));
  checkMissions1(); draw1();
}
$("btnPlay").onclick = () => { playing = !playing; $("btnPlay").textContent = playing ? "⏸ 일시정지" : "▶ 재생"; lastTs = null; };
$("btnReset").onclick = () => { T = 0; draw1(); };

/* 그리기 */
function axisNote(ctx, W, H) {
  ctx.fillStyle = "#6b7a8c"; ctx.font = "11px sans-serif"; ctx.textAlign = "right";
  ctx.fillText("x (cm) →", W - 6, H - 5); ctx.textAlign = "left";
}
function grid(ctx, W, H, mid) {
  ctx.strokeStyle = "#1c2735"; ctx.lineWidth = 1;
  for (let cm = 0; cm <= XL; cm += 10) { const x = cm / XL * W; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  ctx.strokeStyle = "#344256"; ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(W, mid); ctx.stroke();
}
function curve(ctx, W, mid, sc, fn, color, lw, alpha) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.beginPath();
  const n = Math.max(120, Math.floor(W / 2));
  for (let i = 0; i <= n; i++) { const px = i / n * W, v = fn(px / W * XL); i ? ctx.lineTo(px, mid - v * sc) : ctx.moveTo(px, mid - v * sc); }
  ctx.stroke(); ctx.globalAlpha = 1;
}
function drawOne(cv, fn, color) {
  const { ctx, W, H } = fit(cv, 104); ctx.clearRect(0, 0, W, H);
  const mid = H / 2, sc = (H / 2 - 8) / 2; grid(ctx, W, H, mid);
  curve(ctx, W, mid, sc, (x) => fn(x, T), color, 2.5); axisNote(ctx, W, H);
}
function draw1() {
  drawOne($("c1"), y1, "#ffb020"); drawOne($("c2"), y2, "#58a6ff");
  let { ctx, W, H } = fit($("cPos"), 150); ctx.clearRect(0, 0, W, H);
  let mid = H / 2, sc = (H / 2 - 8) / 4; grid(ctx, W, H, mid);
  curve(ctx, W, mid, sc, (x) => y1(x, T), "#ffb020", 1.5, 0.35);
  curve(ctx, W, mid, sc, (x) => y2(x, T), "#58a6ff", 1.5, 0.35);
  curve(ctx, W, mid, sc, (x) => ys(x, T), "#3ddc84", 3);
  axisNote(ctx, W, H);
  ({ ctx, W, H } = fit($("cTime"), 130)); ctx.clearRect(0, 0, W, H);
  mid = H / 2; sc = (H / 2 - 8) / 4;
  ctx.strokeStyle = "#344256"; ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(W, mid); ctx.stroke();
  ctx.strokeStyle = "#1c2735"; for (let s = 1; s < 6; s++) { const x = s / 6 * W; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  ctx.strokeStyle = "#3ddc84"; ctx.lineWidth = 2.5; ctx.beginPath();
  for (let i = 0; i <= 300; i++) { const px = i / 300 * W, tt = T - 6 * (1 - i / 300), v = ys(0, tt); i ? ctx.lineTo(px, mid - v * sc) : ctx.moveTo(px, mid - v * sc); }
  ctx.stroke(); ctx.fillStyle = "#6b7a8c"; ctx.font = "11px sans-serif"; ctx.textAlign = "right"; ctx.fillText("지금 →", W - 6, 14);
}

/* ═══════════ ② 2차원 물결 ═══════════ */
const Q = { d:6, lam:2, ph:0, avg:false, node:true, probe:null };
const FW = 30, FH = 20;                           // 수조 크기 (cm)
let T2 = 0, playing2 = true, last2 = null;
const off = document.createElement("canvas"); off.width = 180; off.height = 120;
const offCtx = off.getContext("2d"), offImg = offCtx.createImageData(off.width, off.height);
const srcPos = () => [[FW/2 - Q.d/2, FH - 1.5], [FW/2 + Q.d/2, FH - 1.5]];
function drawField(cv) {
  const { ctx, W, H } = fit(cv, Math.round(Math.min(560, Math.max(260, cv.clientWidth * FH / FW))));
  const [a, b] = srcPos(), k = TAU / Q.lam, ph = rad(Q.ph), D = offImg.data, nx = off.width, ny = off.height;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const x = (i + .5) / nx * FW, y = (j + .5) / ny * FH;
    const r1 = Math.hypot(x - a[0], y - a[1]), r2 = Math.hypot(x - b[0], y - b[1]);
    let v;
    if (Q.avg) v = 0.5 * (1 + Math.cos(k * (r1 - r2) - ph));          // 0..1 시간 평균 세기
    else v = (Math.sin(k * r1 - TAU * T2) + Math.sin(k * r2 - TAU * T2 + ph) + 2) / 4;   // 0..1
    const g = Math.pow(v, 1.4), q = (j * nx + i) * 4;
    D[q] = 20 + 120 * g; D[q+1] = 60 + 190 * g; D[q+2] = 90 + 165 * g; D[q+3] = 255;
  }
  offCtx.putImageData(offImg, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.drawImage(off, 0, 0, W, H);
  const sx = W / FW, sy = H / FH;
  if (Q.node) {                                  // 상쇄 마디선: r1 − r2 = (n+½)λ + φλ/2π  (쌍곡선)
    ctx.strokeStyle = "rgba(255,120,120,.85)"; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
    const cxm = FW / 2, c = Q.d / 2;
    for (let n = -40; n <= 40; n++) {
      const dl = (n + .5) * Q.lam + ph / TAU * Q.lam, ap = Math.abs(dl) / 2;   // 쌍곡선 반축 a'
      if (ap >= c - 1e-6) continue;
      const bp = Math.sqrt(c * c - ap * ap), sg = dl > 0 ? 1 : -1;
      ctx.beginPath();
      for (let i = 0; i <= 80; i++) {
        const yp = i / 80 * (FH - 1.5 + 2), xp = sg * ap * Math.sqrt(1 + yp * yp / (bp * bp));   // yp: 파원에서 위쪽으로 잰 거리
        const X = (cxm + xp) * sx, Y = (FH - 1.5 - yp) * sy;
        i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  [a, b].forEach((s, i) => { ctx.beginPath(); ctx.arc(s[0]*sx, s[1]*sy, 7, 0, TAU); ctx.fillStyle = i ? "#58a6ff" : "#ffb020"; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); });
  if (Q.probe) {
    const p = Q.probe; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
    [a, b].forEach((s) => { ctx.beginPath(); ctx.moveTo(s[0]*sx, s[1]*sy); ctx.lineTo(p.x*sx, p.y*sy); ctx.stroke(); });
    ctx.setLineDash([]); ctx.beginPath(); ctx.arc(p.x*sx, p.y*sy, 7, 0, TAU); ctx.fillStyle = "#fff"; ctx.fill(); ctx.strokeStyle = "#e11d48"; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.font = "12px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("● 파원 1", 8, H - 22); ctx.fillText("● 파원 2", 8, H - 8);
}
function counts() {
  const m = Math.floor(Q.d / Q.lam + 1e-9), phf = ((Q.ph % 360) + 360) % 360 / 360;
  let con = 0, nod = 0;                          // 경로차 Δ가 (정수 − φ/2π)λ 인 보강선, (정수+½ − φ/2π)λ 인 상쇄선 개수 (|Δ| < d)
  for (let n = -40; n <= 40; n++) {
    if (Math.abs((n + phf) * Q.lam) < Q.d) con++;
    if (Math.abs((n + .5 + phf) * Q.lam) < Q.d) nod++;
  }
  $("count2").innerHTML = `d / λ = <b>${(Q.d / Q.lam).toFixed(2)}</b><br>보강선(밝은 줄) <b>${con}</b>개<br>상쇄선(붉은 점선) <b>${nod}</b>개<br><span style="color:var(--sub)">경로차 |r₁ − r₂| 는 d 보다 클 수 없어서, d가 클수록(또는 λ가 짧을수록) 줄이 많아집니다.</span>`;
  return { con, nod };
}
const m2 = OG.missions($("missions2Host"), [
  { id:"con", text:"수조를 눌러 <b>보강점</b>(경로차가 λ의 정수배)을 찾아 보기", say:"맞습니다. 두 파원에서 온 마루가 <b>같은 때</b> 도착하는 곳이지요. 경로차가 0, λ, 2λ…입니다." },
  { id:"des", text:"<b>상쇄점</b>(경로차가 λ의 정수+½배)을 찾아 보기 — 붉은 점선 위", say:"마루와 골이 만나는 곳, 경로차가 <b>λ/2, 3λ/2…</b>입니다. 그 자리에서는 물결이 거의 움직이지 않습니다." },
  { id:"d", text:"<b>파원 간격 d</b>를 키워서 줄(보강선)의 개수가 늘어나는지 세어 보기", say:"간격이 커지면 경로차가 더 큰 값까지 가능해져 줄이 <b>촘촘하고 많아집니다</b>. 빛의 이중 슬릿 무늬도 같은 규칙이에요." }
], { title:"해 보기 (2차원)", onDone:(m, all) => guide.say(m.say + (all ? "<br><b>모두 해냈군요.</b> 아래 실제 수조 사진과 나란히 비교해 보세요." : "")) });
let prevCon = 0;
function probeAt(x, y) {
  const [a, b] = srcPos(), r1 = Math.hypot(x - a[0], y - a[1]), r2 = Math.hypot(x - b[0], y - b[1]);
  Q.probe = { x, y };
  const dl = (r1 - r2) / Q.lam - (Q.ph / 360);           // 위상 보정된 경로차 (λ 단위)
  const frac = Math.abs(dl - Math.round(dl)), el = $("probe");
  let kind;
  if (frac < 0.08) kind = "con"; else if (Math.abs(frac - .5) < 0.08) kind = "des"; else kind = "mid";
  el.className = "probe";
  el.innerHTML = `r₁ = ${r1.toFixed(1)} cm, r₂ = ${r2.toFixed(1)} cm<br>경로차 |r₁−r₂| = <b>${Math.abs(r1 - r2).toFixed(2)} cm</b> = <b>${Math.abs((r1 - r2) / Q.lam).toFixed(2)} λ</b><br>` +
    (kind === "con" ? "→ <b style='color:#d98a00'>보강</b> (위상 보정 후 정수 배)" : kind === "des" ? "→ <b style='color:#1f6fd6'>상쇄</b> (정수 + ½ 배)" : "→ 중간 (보강도 상쇄도 아님)");
  if (kind === "con") m2.done("con"); if (kind === "des") m2.done("des");
  drawField($("cField"));
}
$("cField").addEventListener("pointerdown", (e) => {
  const cv = $("cField"), r = cv.getBoundingClientRect(); probeAt((e.clientX - r.left) / r.width * FW, (e.clientY - r.top) / r.height * FH);
});
const sl2 = { d:["sD","lD",1], lam:["sLam","lLam",1], ph:["sP2","lP2",0] };
for (const k in sl2) $(sl2[k][0]).addEventListener("input", (e) => {
  Q[k] = +e.target.value; $(sl2[k][1]).textContent = Q[k].toFixed(sl2[k][2]) + (k === "ph" ? "°" : "");
  const c = counts(); if (k === "d" && c.con > prevCon && prevCon > 0) m2.done("d"); prevCon = c.con;
  if (Q.probe) { const p = Q.probe; probeAt(p.x, p.y); } else drawField($("cField")); redrawCmp();
});
$("ckAvg").onchange = (e) => { Q.avg = e.target.checked; drawField($("cField")); redrawCmp(); };
$("ckNode").onchange = (e) => { Q.node = e.target.checked; drawField($("cField")); };
$("btnPlay2").onclick = () => { playing2 = !playing2; $("btnPlay2").textContent = playing2 ? "⏸ 일시정지" : "▶ 재생"; last2 = null; };
for (const k in sl2) $(sl2[k][1]).textContent = (+Q[k]).toFixed(sl2[k][2]) + (k === "ph" ? "°" : "");

const cmp = OG.compare($("compare2Host"), {
  photo: "photos/ripple-tank", alt: "물결 수조에서 두 파원이 만드는 간섭 무늬",
  title: "실제 물결 수조 사진과 비교",
  photoCaption: "<b>실제 물결 수조</b> — 아래쪽 두 점에서 나온 물결이 만나는 모습",
  simCaption: "<b>시뮬레이션</b> — ‘시간 평균 밝기’를 켜면 줄 무늬가 고정됩니다",
  points: [
    "사진에서 <b>밝은 점들이 줄지어 늘어선 방향</b>과, 시뮬레이션의 <b>붉은 점선(상쇄선)</b> 사이의 줄 방향을 비교해 보세요.",
    "두 파원 <b>바로 위(가운데)</b>는 보강선일까요, 상쇄선일까요? 사진과 시뮬레이션이 같은지 확인해 보세요.",
    "파원 간격 d를 줄이거나 파장을 길게 하면 줄의 개수와 벌어지는 각이 어떻게 바뀌나요?"
  ],
  w: 480, h: 360, draw: (cv) => drawFieldSmall(cv)
});
function drawFieldSmall(cv) {                    // 비교용 작은 캔버스: 같은 규칙, 마디선·조사점 없이
  const save = { node: Q.node, probe: Q.probe }; Q.node = false; Q.probe = null;
  const ctx = cv.getContext("2d"), W = cv.width, H = cv.height;
  const [a, b] = srcPos(), k = TAU / Q.lam, ph = rad(Q.ph), D = offImg.data, nx = off.width, ny = off.height;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const x = (i + .5) / nx * FW, y = (j + .5) / ny * FH, r1 = Math.hypot(x - a[0], y - a[1]), r2 = Math.hypot(x - b[0], y - b[1]);
    const v = Q.avg ? 0.5 * (1 + Math.cos(k * (r1 - r2) - ph)) : (Math.sin(k * r1 - TAU * T2) + Math.sin(k * r2 - TAU * T2 + ph) + 2) / 4;
    const g = Math.pow(v, 1.6), q = (j * nx + i) * 4; D[q] = 40 + 200 * g; D[q+1] = 55 + 200 * g; D[q+2] = 70 + 185 * g; D[q+3] = 255;
  }
  offCtx.putImageData(offImg, 0, 0); ctx.drawImage(off, 0, 0, W, H);
  [a, b].forEach((s) => { ctx.beginPath(); ctx.arc(s[0] / FW * W, s[1] / FH * H, 5, 0, TAU); ctx.fillStyle = "#ffb020"; ctx.fill(); });
  Q.node = save.node; Q.probe = save.probe;
}
let cmpTick = 0;
function redrawCmp() { cmp.redraw(); }

/* ───────── 탭 ───────── */
let mode = "1d";
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return; mode = b.dataset.mode;
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("active", x === b));
  $("mode1d").hidden = mode !== "1d"; $("mode2d").hidden = mode !== "2d";
  if (mode === "2d") { guide.set([
    "이제 <b>평면 위의 물결</b>입니다. 제가 1801년에 보여 드린 바로 그 그림이지요. 두 파원에서 퍼진 물결이 만나, <b>보강선과 상쇄선이 부챗살처럼</b> 뻗어 나갑니다.",
    "화면의 한 곳을 눌러 보세요. <b>두 파원까지 거리의 차</b>를 알려 드립니다. 차가 <b>λ의 정수배</b>면 보강, <b>정수+½배</b>면 상쇄입니다.",
    "이 규칙을 빛에 적용한 것이 이중 슬릿입니다. 스크린 위의 <b>밝고 어두운 줄무늬</b>는 곧 빛이 파동이라는 증거였습니다."
  ]); } else guide.set([
    "저는 <b>토머스 영</b>입니다. 두 파동이 겹치면 변위가 <b>더해진다</b>는 것에서 모든 간섭이 시작됩니다. 오른쪽 ‘바로 해 보기’를 눌러 보세요.",
    "<b>마루와 마루</b>가 만나면 커지고(보강), <b>마루와 골</b>이 만나면 작아집니다(상쇄). 위상차 슬라이더를 천천히 돌려 보세요."
  ]);
  fitAll();
});
function fitAll() { draw1(); if (mode === "2d") { drawField($("cField")); redrawCmp(); } }
window.addEventListener("resize", fitAll);

/* ───────── 루프 ───────── */
function loop(ts) {
  if (lastTs == null) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.05); lastTs = ts;
  if (mode === "1d" && playing) { T += dt * P.spd; draw1(); if (Math.abs(P.F1 - P.F2) >= 0.2 && T > 1.5) checkMissions1(); }
  if (mode === "2d" && playing2) { T2 += dt * 0.6; drawField($("cField")); if (++cmpTick % 3 === 0) redrawCmp(); }
  requestAnimationFrame(loop);
}
syncSliders(); updateReadout(); prevCon = counts().con;
document.querySelector('#presets .chip[data-id="con"]').classList.add("on");
requestAnimationFrame(() => { fitAll(); requestAnimationFrame(loop); });
</script>
</body>
</html>
