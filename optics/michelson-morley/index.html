<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이컬슨-몰리 실험 — 에테르 바람을 찾아서</title>
<link rel="stylesheet" href="../common/og.css?v=3">
<style>
  :root { --bg:#f0fbfa; --panel:#fff; --ink:#1f3b3a; --sub:#5f7f7d; --accent:#0f9488; --warn:#d64545; --ok:#2f9e5c; --border:#c9e8e4; --radius:14px;
          --armA:#e0872a; --armB:#0f9488; }
  * { box-sizing:border-box; margin:0; padding:0; }
  [hidden] { display:none !important; }
  body { font-family:"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); padding:12px; font-size:16px; line-height:1.65; }
  .wrap { max-width:1100px; margin:0 auto; }
  header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  header h1 { font-size:1.2em; }
  .navbtn { text-decoration:none; color:var(--sub); border:1px solid var(--border); padding:7px 13px; border-radius:9px; font-size:.85em; white-space:nowrap; background:#fff; }
  .navbtn:hover { color:var(--accent); border-color:var(--accent); }

  .og-wrap { --og-accent:#0f9488; --og-line:#c9e8e4; --og-soft:#e6f7f5; }

  .progress { display:flex; align-items:center; margin-bottom:14px; overflow-x:auto; padding:2px 2px 6px; }
  .pd { min-width:38px; height:38px; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:var(--sub); cursor:pointer; flex-shrink:0; background:#fff; transition:all .15s; }
  .pd.on { background:var(--accent); border-color:var(--accent); color:#fff; transform:scale(1.08); }
  .pd.done { background:#e2f5f2; border-color:var(--accent); color:var(--accent); }
  .pl { flex:1; height:3px; background:var(--border); min-width:12px; }
  .pl.done { background:var(--accent); }
  .steplabel { text-align:center; font-size:.82em; color:var(--sub); margin:-6px 0 12px; }

  .stepgrid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:14px; align-items:start; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:0 3px 14px rgba(20,110,100,.07); margin-bottom:14px; }
  .step-eyebrow { font-size:.85em; color:var(--accent); font-weight:700; margin-bottom:4px; }
  .step-title { font-size:1.3em; font-weight:800; margin-bottom:10px; line-height:1.35; }
  .story p { margin-bottom:10px; }
  .story b { color:var(--accent); }
  .analogy { background:#e6f7f5; border-left:4px solid var(--accent); padding:10px 14px; border-radius:0 8px 8px 0; margin:10px 0; font-size:.96em; }
  .sticky { position:sticky; top:8px; }

  canvas { display:block; width:100%; background:#0c1119; border-radius:10px; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  button { font-size:1em; padding:10px 18px; border-radius:10px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:600; min-height:42px; color:var(--ink); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:#0c766c; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .param { margin:12px 0 6px; }
  .param label { display:flex; justify-content:space-between; font-weight:700; margin-bottom:4px; }
  .param label .val { color:var(--accent); font-variant-numeric:tabular-nums; }
  .param input[type=range] { width:100%; height:30px; accent-color:var(--accent); }
  .ticks { display:flex; justify-content:space-between; font-size:.74em; color:var(--sub); margin-top:-4px; }

  .readout { background:#f2f8f4; border:1px solid #cfe9d8; border-radius:10px; padding:10px 14px; margin-top:10px; font-size:.98em; font-variant-numeric:tabular-nums; }
  .readout.wait { background:#f5f2ea; border-color:var(--border); color:var(--sub); }
  .readout .big { font-size:1.25em; font-weight:800; color:var(--ok); }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:.84em; color:var(--sub); margin-top:8px; }
  .legend i { display:inline-block; width:18px; height:4px; border-radius:2px; vertical-align:middle; margin-right:5px; }

  table { width:100%; border-collapse:collapse; font-size:.92em; margin-top:10px; }
  th,td { border:1px solid var(--border); padding:7px; text-align:center; }
  th { background:#e6f7f5; }
  .calc { font-family:Georgia,"Times New Roman",serif; background:#eef9f7; border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin:8px 0; font-size:1.02em; line-height:1.8; }
  .navrow { display:flex; justify-content:space-between; margin-top:4px; margin-bottom:16px; gap:10px; }
  .navrow button { min-width:110px; }
  .final-links { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .final-links a { flex:1 1 200px; text-align:center; padding:12px; border-radius:10px; border:1px solid var(--border); text-decoration:none; color:var(--ink); background:#fff; font-weight:600; }
  .final-links a:hover { border-color:var(--accent); color:var(--accent); }
  .note { font-size:.8em; color:var(--sub); margin-top:6px; line-height:1.5; }

  @media (max-width:820px) { .stepgrid { grid-template-columns:1fr; } .sticky { position:static; } body { font-size:15.5px; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="navbtn" href="../../index.html">🏠 홈</a>
  <a class="navbtn" href="../index.html">← 광학으로</a>
  <h1>🌊 마이컬슨-몰리의 실험</h1>

<div id="personaHost"></div>
<div class="progress" id="progress"></div>
<div class="steplabel" id="steplabel"></div>
<div id="stepHost"></div>

  <button id="prevBtn">← 이전</button>
  <button class="primary" id="nextBtn">다음 →</button>
</div>
</div>

<script src="../common/og.js?v=3"></script>
<script>
"use strict";
/* ═══════════════════ 물리 상수 ═══════════════════ */
const C = 299792458;
const V_EARTH = 29800;          // 지구 공전 속력 (m/s)
const L_ARM = 11;               // 유효 팔 길이 (m) — 거울 사이 여러 번 반사시켜 늘림
const LAMBDA = 500e-9;          // 빛의 파장 (m)
const MAX_SHIFT = 2 * L_ARM * V_EARTH * V_EARTH / (LAMBDA * C * C);   // 90° 돌릴 때 이동하는 무늬 수 (≈0.43)
const OBS_LIMIT = 0.01;         // 1887년 보고: 예상의 1/40 이하
/* 장치를 θ만큼 돌렸을 때, 처음(θ=0)에 비해 무늬가 이동한 양 (두 팔의 시간차 ∝ cos2θ) */
const shiftAt = (deg) => MAX_SHIFT * Math.pow(Math.sin(deg * Math.PI / 180), 2);
/* 1887년 결과를 흉내 낸 모의 측정값 (예상의 1/40 이하의 작은 흔들림) */
const obsAt = (deg) => OBS_LIMIT * (0.5 * Math.sin(deg * 0.21) + 0.35 * Math.sin(deg * 0.57 + 1) + 0.15 * Math.sin(deg * 1.3 + 2)) * 0.6;

const V_BOAT = 6, L_RIVER = 18;   // 배 경주(이야기 단위)
const $ = (id) => document.getElementById(id);
const rad = (d) => d * Math.PI / 180;
const dpr = () => Math.min(window.devicePixelRatio || 1, 2);
function fit(cv, cssH) {
  const r = dpr(), w = Math.max(240, cv.clientWidth);
  cv.style.height = cssH + "px";
  if (cv.width !== Math.round(w * r) || cv.height !== Math.round(cssH * r)) { cv.width = Math.round(w * r); cv.height = Math.round(cssH * r); }
  const ctx = cv.getContext("2d"); ctx.setTransform(r, 0, 0, r, 0, 0); return { ctx, W: w, H: cssH };
}

/* ═══════════════════ 안내 인물 ═══════════════════ */
const guide = OG.persona($("personaHost"), { who: "michelson", lines: [""] });
const SCRIPT = {
  1: { who: "michelson", lines: [
    "저는 미국의 물리학자 <b>앨버트 마이컬슨</b>입니다. 1887년, 동료 <b>에드워드 몰리</b>와 함께 ‘우주를 채운 보이지 않는 물’, <b>에테르</b>를 찾아 나섰습니다.",
    "먼저 쉬운 비유부터 해 보지요. 같은 속력의 배 두 척이 있습니다. 하나는 <b>강물을 따라</b> 올라갔다 내려오고, 하나는 <b>강을 가로질러</b> 갔다 옵니다. 누가 먼저 돌아올까요?",
    "아래 <b>강물 속력</b>을 바꿔 가며 경주를 시켜 보세요. 강물이 빠를수록 두 배의 도착 시간 차이가 <b>벌어집니다</b>. 이 차이를 빛으로 재 보려는 것이 제 실험입니다."
  ] },
  2: { who: "michelson", lines: [
    "19세기 사람들은 빛이 파동이니 파동을 실어 나르는 <b>에테르</b>가 있다고 믿었습니다. 그렇다면 지구는 그 속을 <b>초속 약 30 km</b>로 달리는 셈이니, 달리는 차에서 맞는 바람처럼 <b>‘에테르 바람’</b>이 불어야 합니다.",
    "제 장치(간섭계)는 반투명 거울로 빛을 <b>서로 수직인 두 길</b>로 나눴다가 다시 합칩니다. 한 길이 바람과 나란하면 다른 길은 바람을 가로지르지요 — 배 경주 그대로입니다.",
    "아래 <b>장치 회전</b> 슬라이더로 장치를 돌려 보세요. 주황 팔이 바람과 나란할 때와 가로지를 때가 <b>번갈아</b> 바뀝니다."
  ] },
  3: { who: "morley", lines: [
    "저는 화학자 <b>에드워드 몰리</b>입니다. 정밀하게 재는 것이 제 일이지요. 지구의 속력 <b>29.8 km/s</b>와 팔 길이 <b>11 m</b>, 빛의 파장으로 계산하면 <b>무늬가 얼마나 움직여야 하는지</b> 미리 알 수 있습니다.",
    "(v/c)² 은 겨우 10⁻⁸ 이지만, 빛의 파장은 너무 짧아서 팔 왕복 길이(2L)를 파장으로 세면 4400만 개나 됩니다. 곱하면 <b>무늬 약 0.4개</b>. 눈으로 알아볼 수 있는 크기입니다!",
    "각도를 바꿔 보세요. <b>무늬가 한 칸 안에서 얼마나 밀려 나는지</b>를 볼 수 있습니다. 오른쪽 아래는 실제 간섭계에서 찍은 무늬 사진입니다."
  ] },
  4: { who: "morley", lines: [
    "자, 이제 진짜 실험입니다. 우리는 장치를 1.5 m 크기의 <b>돌판 위에 올려 수은에 띄워서</b> 부드럽게 돌리며, 한 바퀴를 돌 때마다 무늬를 읽었습니다.",
    "결과는 <b>허무할 정도</b>였습니다. 예상은 약 0.4개인데, 관측된 이동은 <b>예상의 1/40 이하</b>(약 0.01개 이하). 움직인 것이 없다고 해도 될 정도였지요.",
    "슬라이더를 돌리며 <b>빨간 곡선(예상)</b>과 <b>초록 점(관측)</b>을 비교해 보세요. ※ 그래프의 관측값은 1887년 결과 수준으로 만든 모의 데이터입니다."
  ] },
  5: { who: "michelson", lines: [
    "솔직히 저는 실패했다고 생각했습니다. 하지만 <b>‘에테르 바람이 없다’</b>는 것도 결과입니다. 이후 여러 연구자가 시간·계절·장소를 바꿔 반복했지만 같은 결론이었습니다.",
    "이 결과는 <b>빛의 속도가 보는 사람의 운동과 관계없이 일정하다</b>는 생각과 잘 맞았고, 1905년 아인슈타인이 특수상대성이론을 세우는 배경이 되었습니다.",
    "저는 이 실험이 아니라, 정밀한 광학 기구와 이를 이용한 측정 연구로 1907년 <b>미국인 최초의 노벨 물리학상</b>을 받았습니다."
  ] },
  6: { who: "michelson", lines: [
    "오늘 우리가 본 것을 정리해 봅시다. 빛의 속도를 이렇게 정밀하게 쟀던 이야기는 <b>‘빛의 속도 측정’</b> 시뮬레이션에서 이어 볼 수 있습니다. 저도 1926년 회전 거울로 다시 쟀지요."
  ] }
};
function say(step) { const s = SCRIPT[step]; guide.set(s.lines, 0, s.who); }

/* ═══════════════════ 간섭무늬(원형) 그리기 ═══════════════════ */
const ringBuf = document.createElement("canvas"); ringBuf.width = ringBuf.height = 170;
const ringCtx = ringBuf.getContext("2d"), ringImg = ringCtx.createImageData(170, 170);
function drawRings(ctx, cx, cy, R, shift, mark) {
  const n = 170, D = ringImg.data, c = n / 2;
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const dx = (i + .5 - c) / c, dy = (j + .5 - c) / c, r2 = dx * dx + dy * dy, q = (j * n + i) * 4;
    if (r2 > 1) { D[q + 3] = 0; continue; }
    const I = Math.pow(Math.cos(Math.PI * (r2 * 7.5 + shift)), 2);   // 중심에서 멀수록 촘촘한 동심원
    D[q] = 255 * I; D[q + 1] = 205 * I; D[q + 2] = 40 * I; D[q + 3] = 255;
  }
  ringCtx.putImageData(ringImg, 0, 0);
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip(); ctx.drawImage(ringBuf, cx - R, cy - R, 2 * R, 2 * R); ctx.restore();
  ctx.strokeStyle = "#64748b"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  if (mark) {                                        // 기준 눈금: shift=0 일 때 밝은 고리가 지나는 반지름
    const r0 = Math.sqrt((Math.ceil(0 / 1) + 3) / 7.5) * R;                      // r²·7.5 = 3 → 3번째 밝은 고리
    ctx.fillStyle = "#ff5d73"; ctx.beginPath(); ctx.moveTo(cx + r0, cy - R - 2); ctx.lineTo(cx + r0 - 7, cy - R - 14); ctx.lineTo(cx + r0 + 7, cy - R - 14); ctx.fill();
    ctx.fillStyle = "#ff9aa7"; ctx.font = "11px sans-serif"; ctx.textAlign = "center"; ctx.fillText("기준(처음 위치)", cx + r0, cy - R - 17);
  }
}

/* ═══════════════════ 공통 애니메이션 루프 ═══════════════════ */
let animId = null, onFrame = null; const t0 = performance.now();
function startLoop(fn) { onFrame = fn; if (!animId) { const f = (now) => { if (onFrame) onFrame((now - t0) / 1000); animId = requestAnimationFrame(f); }; animId = requestAnimationFrame(f); } }
function stopLoop() { onFrame = null; }

/* ═══════════════════ STEP 1 — 강물 위의 배 경주 ═══════════════════ */
function renderStep1() {
  return `<div class="stepgrid">
    <div class="card story">
      <div class="step-eyebrow">STEP 1 / 6 · 이야기의 시작</div>
      <div class="step-title">🚣 강물 위에서 배 경주를 해봅시다</div>
      <p>같은 속력으로 노를 젓는 배 두 척. <b>위쪽 배</b>는 강물과 나란히(상류로 갔다 하류로 돌아옴), <b>아래쪽 배</b>는 강을 가로질러 왕복합니다. 같은 거리를 가는데 누가 먼저 올까요?</p>
      <div class="analogy">💡 거슬러 갈 때 잃은 시간을 내려올 때 다 만회할 것 같지만, 사실은 <b>손해가 더 큽니다</b>. 가로지르는 배는 물살에 밀리는 것을 비스듬히 보정하는 정도라 <b>항상 먼저</b> 도착합니다.</div>
      <div class="param">
        <label for="riverSpeed">강물 속력 <span class="val"><span id="riverSpeedVal">2</span> 칸/초</span></label>
        <input type="range" id="riverSpeed" min="0" max="4" step="0.5" value="2">
        <div class="ticks"><span>0 (정지)</span><span>배 속력 6</span></div>
      </div>
      <div class="controls"><button class="primary" id="btnRace1">🏁 경주 시작!</button></div>
      <div class="readout wait" id="raceReadout">강물 속력을 정하고 경주를 시작해 보세요. 강물 속력을 0으로 하면 어떨까요?</div>
    </div>
    <div class="card sticky"><canvas id="cv1"></canvas></div>
  </div>`;
}
function initStep1() {
  const canvas = $("cv1"), slider = $("riverSpeed"); let race = null;
  slider.addEventListener("input", () => { $("riverSpeedVal").textContent = slider.value; });
  $("btnRace1").addEventListener("click", () => {
    const vr = +slider.value, t1 = L_RIVER / (V_BOAT - vr), t2 = L_RIVER / (V_BOAT + vr), tp = L_RIVER / Math.sqrt(V_BOAT * V_BOAT - vr * vr);
    race = { start: performance.now(), vr, t1, t2, tp, finA: t1 + t2, finB: 2 * tp, shown: false };
    $("raceReadout").className = "readout wait"; $("raceReadout").textContent = "배들이 출발했어요...";
  });
  startLoop(() => {
    const { ctx, W, H } = fit(canvas, 250); ctx.fillStyle = "#dff1f8"; ctx.fillRect(0, 0, W, H);
    const dockX = 60, buoyX = W - 60, yA = 85, yB = 190, k = (buoyX - dockX);
    const vr = race ? race.vr : +slider.value;
    ctx.fillStyle = "#8fc7dd"; ctx.font = "15px sans-serif"; ctx.textAlign = "center";
    for (let x = dockX + 30; x < buoyX; x += 55) { ctx.globalAlpha = .4 + vr / 8; ctx.fillText("→".repeat(1 + Math.round(vr / 2)), x, yA - 38); ctx.fillText("→".repeat(1 + Math.round(vr / 2)), x, yB - 38); } ctx.globalAlpha = 1;
    ctx.fillStyle = "#4b6b78"; ctx.font = "13px sans-serif";
    ctx.fillText("강물과 나란히 왕복", W / 2, yA - 56); ctx.fillText("강물을 가로질러 왕복", W / 2, yB - 56);
    [yA, yB].forEach((y) => { ctx.fillStyle = "#c9b892"; ctx.fillRect(dockX - 14, y - 12, 12, 24); ctx.beginPath(); ctx.arc(buoyX + 8, y, 7, 0, 7); ctx.fillStyle = "#e0872a"; ctx.fill(); });
    let xA = dockX, xB = dockX, done = false;
    if (race) {
      const el = (performance.now() - race.start) / 1000;
      xA = el < race.t1 ? dockX + k * el / race.t1 : el < race.finA ? buoyX - k * (el - race.t1) / race.t2 : dockX;
      xB = el < race.tp ? dockX + k * el / race.tp : el < race.finB ? buoyX - k * (el - race.tp) / race.tp : dockX;
      if (el >= Math.max(race.finA, race.finB) && !race.shown) {
        race.shown = true; const diff = Math.abs(race.finA - race.finB), ro = $("raceReadout"); ro.className = "readout";
        ro.innerHTML = diff < 0.05 ? `🤝 강물이 멈춰 있으니 두 배가 <b>동시에</b> 도착! (둘 다 ${race.finA.toFixed(1)}초)` :

function initStep2() {
  const cv = $("cv2"), sl = $("angle2"); let wind = true;
  OG.compare($("cmp2"), { title: "실제 간섭계 앞의 마이컬슨", photo: "photos/michelson-interferometer", alt: "간섭계를 들여다보는 마이컬슨", w: 10, h: 10,
    photoCaption: "<b>마이컬슨과 간섭계</b> — 이 장치로 접안렌즈에서 무늬를 읽었습니다.", simCaption: "", points: [] });
  document.querySelector("#cmp2 .og-pair").style.gridTemplateColumns = "1fr"; document.querySelector("#cmp2 .og-pair figure:nth-child(2)").remove();
  document.querySelector("#cmp2 .og-pair .og-frame").style.aspectRatio = "16/9";
  $("btnWind2").onclick = () => { wind = !wind; $("btnWind2").textContent = "💨 에테르 바람 표시: " + (wind ? "켜짐" : "꺼짐"); };
  sl.addEventListener("input", () => { $("angle2Val").textContent = sl.value; arm(); });
  function arm() {
    const th = rad(+sl.value), par = Math.abs(Math.cos(th));
    const a = par > .9 ? "<b style='color:var(--armA)'>팔 A</b>가 바람과 거의 나란함" : par < .1 ? "<b style='color:var(--armB)'>팔 B</b>가 바람과 거의 나란함" : "두 팔이 모두 비스듬함";
    $("armReadout").innerHTML = `${a}<br><span style="color:var(--sub)">90° 돌릴 때마다 나란한 팔이 A↔B로 <b>서로 바뀝니다</b> → 시간 차이의 부호가 바뀜 → 무늬 이동</span>`;
  }
  arm();
  startLoop((t) => {
    const { ctx, W, H } = fit(cv, 300); ctx.fillStyle = "#0c1119"; ctx.fillRect(0, 0, W, H);
    const th = rad(+sl.value), cx = W * 0.42, cy = H * 0.56, S = Math.min(W / 640, H / 330) * 1;
    const rot = (x, y) => [cx + (x * Math.cos(th) - y * Math.sin(th)) * S, cy + (x * Math.sin(th) + y * Math.cos(th)) * S];   // 장치 좌표(x→오른쪽, y→아래)
    if (wind) {                                      // 에테르 바람 (화면 기준, 항상 →)
      ctx.strokeStyle = "rgba(143,184,255,.35)"; ctx.lineWidth = 2; ctx.fillStyle = "rgba(143,184,255,.5)";
      for (let y = 30; y < H; y += 44) { const x0 = ((t * 60 + y * 3) % 160) - 40; for (let x = x0; x < W; x += 160) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 40, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x + 46, y); ctx.lineTo(x + 36, y - 5); ctx.lineTo(x + 36, y + 5); ctx.fill(); } }
      ctx.fillStyle = "#8fb8ff"; ctx.font = "12px sans-serif"; ctx.textAlign = "left"; ctx.fillText("에테르 바람 →", 10, 18);
    }
    const LA = 190, LB = 150, src = [-120, 0], det = [0, 130];
    const P = { s: rot(...src), bs: rot(0, 0), a: rot(LA, 0), b: rot(0, -LB), d: rot(...det) };
    const line = (p, q, col, w, dash) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.setLineDash(dash || []); ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); ctx.setLineDash([]); };
    line(P.s, P.bs, "rgba(255,230,120,.55)", 3);
    line(P.bs, P.a, "rgba(224,135,42,.55)", 3); line(P.bs, P.b, "rgba(15,148,136,.7)", 3); line(P.bs, P.d, "rgba(255,230,120,.4)", 3);
    const dot = (p, col, r) => { ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 7); ctx.fillStyle = col; ctx.fill(); };
    const lerp = (p, q, u) => [p[0] + (q[0] - p[0]) * u, p[1] + (q[1] - p[1]) * u];
    const u = (t * 0.45) % 1;                                    // 빛 알갱이 이동(그림용)
    dot(lerp(P.s, P.bs, Math.min(1, u * 2)), "#ffe066", 5);
    if (u > .5) { const w = (u - .5) * 2; const tr = w < .5 ? w * 2 : 1 - (w - .5) * 2;
      dot(lerp(P.bs, P.a, tr), "#ffb766", 5); dot(lerp(P.bs, P.b, tr), "#5eead4", 5); if (w > .98) dot(P.d, "#fff", 3); }
    // 거울·반투명 거울
    const mirror = (c, ang, len, col) => { ctx.save(); ctx.translate(c[0], c[1]); ctx.rotate(ang + th); ctx.fillStyle = col; ctx.fillRect(-3, -len / 2, 6, len); ctx.restore(); };
    mirror(P.a, 0, 46 * S, "#c8d4e3"); mirror(P.b, Math.PI / 2, 46 * S, "#c8d4e3");
    ctx.save(); ctx.translate(P.bs[0], P.bs[1]); ctx.rotate(th + Math.PI / 4); ctx.fillStyle = "#c9b8f0"; ctx.fillRect(-26 * S, -2.5, 52 * S, 5); ctx.restore();
    dot(P.s, "#ffe066", 8); ctx.fillStyle = "#ffffff"; ctx.fillRect(P.d[0] - 14, P.d[1] - 10, 28, 20);
    ctx.font = "12px sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 4; ctx.strokeStyle = "#0c1119";
    const lab = (t, x, y, col) => { ctx.fillStyle = col; ctx.strokeText(t, x, y); ctx.fillText(t, x, y); };
    lab("광원", P.s[0], P.s[1] - 14, "#cbd5e1"); lab("반투명 거울", P.bs[0] + 34, P.bs[1] + 34, "#d9ccf7");
    lab("거울 A", P.a[0], P.a[1] - 32, "#ffb766"); lab("거울 B", P.b[0] + 4, P.b[1] - 30, "#5eead4"); lab("관측(접안렌즈)", P.d[0], P.d[1] + 30, "#cbd5e1");
  });
}

    ctx.fillStyle = "#94a3b8"; ctx.textAlign = "center"; ctx.fillText(p > 1.2 ? "← 동시에 도착! 시간 차이 없음 → 무늬 이동 없음" : "두 갈래 빛이 왕복 중...", W / 2, H - 14);
  });
}

function initStep6() {
  OG.compare($("cmp6"), { title: "다시 보는 간섭무늬", photo: "photos/michelson-fringe", alt: "마이컬슨 간섭계 무늬", w: 10, h: 10,

/* ═══════════════════ 진행 / 디스패치 ═══════════════════ */
const STEPS = [null,
  ["이야기의 시작", renderStep1, initStep1], ["장치 구조", renderStep2, initStep2], ["예상되는 결과", renderStep3, initStep3],
  ["실제 실험", renderStep4, initStep4], ["결과의 의미", renderStep5, initStep5], ["정리", renderStep6, initStep6]];
const STEP_COUNT = 6; let step = 1, redraw = null;
function renderProgress() {
  const el = $("progress"); el.innerHTML = "";
  for (let i = 1; i <= STEP_COUNT; i++) {
    const d = document.createElement("div"); d.className = "pd" + (i === step ? " on" : i < step ? " done" : ""); d.textContent = i < step ? "✓" : i;
    d.setAttribute("role", "button"); d.setAttribute("aria-label", i + "단계 " + STEPS[i][0]); d.onclick = () => goStep(i); el.appendChild(d);
    if (i < STEP_COUNT) { const l = document.createElement("div"); l.className = "pl" + (i < step ? " done" : ""); el.appendChild(l); }
  }
  $("steplabel").textContent = step + " / " + STEP_COUNT + " · " + STEPS[step][0];
}
function goStep(n) {
  step = Math.max(1, Math.min(STEP_COUNT, n)); stopLoop(); redraw = null;
  renderProgress(); $("stepHost").innerHTML = STEPS[step][1](); STEPS[step][2](); say(step);
  $("prevBtn").disabled = step === 1; $("nextBtn").disabled = step === STEP_COUNT;
  window.scrollTo({ top: 0, behavior: "smooth" });
}
$("prevBtn").onclick = () => goStep(step - 1); $("nextBtn").onclick = () => goStep(step + 1);
window.addEventListener("resize", () => { if (redraw) redraw(); });   // 정적 단계(3·4)만 다시 그린다. 나머지는 매 프레임 크기를 맞춘다
goStep(1);
