<title>CCD 이미지 센서</title>
<style>

    --border: #d7dee8; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink);
    padding: 12px; font-size: 15px;
  }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  header h1 { font-size: 1.25em; }
  header .spacer { flex: 1; }
  a.home { text-decoration:none; color:var(--sub); border:1px solid var(--border); padding:6px 12px; border-radius:8px; font-size:0.9em; white-space:nowrap; }

  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button { flex: 0 0 auto; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 1em; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .layout { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .sim-col { flex: 2 1 480px; display: flex; flex-direction: column; gap: 12px; }
  .side-col { flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px; }

  #sceneWrap { position: relative; width: 100%; aspect-ratio: 16/10; border-radius: 8px; overflow: hidden; background: radial-gradient(circle at 50% 30%, #16233a, #060a12 75%); }
  #sceneWrap canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hoverHint { position:absolute; left:8px; bottom:8px; color:#9fb3d9; font-size:0.78em; background:rgba(6,10,18,0.55); padding:4px 8px; border-radius:6px; pointer-events:none; }
  #hoverHint:empty { display: none; }
  #simError { position:absolute; left:8px; right:8px; top:8px; color:#fff; background:rgba(214,69,69,0.92); padding:6px 10px; border-radius:6px; font-size:0.82em; white-space:pre-wrap; }

  .scenario-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .scenario-picker button { flex: 1 1 30%; min-width: 120px; padding: 8px 6px; font-size: 0.86em; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  .scenario-picker button.active { background: #eaf1fd; border-color: var(--accent); color: var(--accent); font-weight: 700; }

  .param { margin-bottom: 10px; }
  .param label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; font-size: 0.92em; }
  .param label .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  .param input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--sub); font-size: 0.83em; margin-top: 2px; line-height: 1.5; }

  button { font-size: 1em; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.warn { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .controls-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.82em; color: var(--sub); margin-top: 8px; }
  .legend:empty { display: none; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .swatch.bar { border-radius: 2px; }

  table.readout { width: 100%; border-collapse: collapse; font-size: 0.92em; }
  table.readout td { padding: 4px 2px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  table.readout td:first-child { color: var(--sub); }
  table.readout td:last-child { text-align: right; font-weight: 700; }

  details { margin-top: 6px; }
  summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
  .formula-body { padding: 8px 2px; line-height: 1.8; font-size: 0.92em; }

  .note { border-left: 3px solid var(--accent); background: #eef4fd; padding: 8px 10px; border-radius: 6px; font-size: 0.86em; margin-top: 8px; line-height: 1.6; }

  body.projector button { padding: 12px 18px; }

    button { padding: 11px 14px; }
    input[type=range] { height: 26px; }

<script>
/* ============================ 시뮬레이션 코드 (레시피 입력 sim_js) ============================ */
/* ============ CCD 이미지 센서 — 물리 계산 (DOM 없음) ============ */
const E_G = 1.12, FW = 20000, E_CH = 1.602176634e-19;   // Si 밴드갭(eV), 최대 전하 용량(예시, 전자 수), 전자 전하(C)
const QE_PTS = [[300, .15], [400, .45], [550, .85], [700, .80], [900, .45], [1000, .15], [1107, 0]];
const CC = {
  E(nm) { return 1239.84 / nm; },
  cutoff() { return 1239.84 / E_G; },
  qe(nm) { if (nm >= 1107) return 0; if (nm <= 300) return .15; for (let i = 0; i < QE_PTS.length - 1; i++) { const [a, fa] = QE_PTS[i], [b, fb] = QE_PTS[i + 1]; if (nm <= b) return fa + (fb - fa) * (nm - a) / (b - a); } return 0; },
  collect(nm, flux, ms, scale = 1) { const raw = this.qe(nm) * flux * ms * scale; return { raw, q: Math.min(FW, raw), sat: raw > FW }; },
  /* 3상 전송: 게이트 g 에 전하 q[g]. 단계 s 마다 g%3 == s%3 인 게이트의 전하가 CTE 비율만큼 g+1 로 이동(나머지는 남는다) */
  step(q, s, cte) { const n = q.length; let out = 0; const mv = new Array(n).fill(0); for (let g = s % 3; g < n; g += 3) { mv[g] = q[g] * cte; } for (let g = 0; g < n; g++) if (mv[g]) { q[g] -= mv[g]; if (g + 1 < n) q[g + 1] += mv[g]; else out += mv[g]; } return out; },
  shift(q0, cte, pixels) { const q = q0.slice(); let out = 0; for (let s = 0; s < 3 * pixels; s++) out += this.step(q, s, cte); return { q, out }; },
  gain(cfd_fF, gsf = 0.85) { return E_CH / (cfd_fF * 1e-15) * gsf * 1e6; },               // µV/e⁻ (소스 팔로어 이득 포함)
  dn(qe_, cfd, bits) { const v = qe_ * this.gain(cfd), vfs = FW * this.gain(cfd); return Math.min(2 ** bits - 1, Math.round(v / vfs * 2 ** bits)); },
  readTime(npix, fMHz) { return npix / (fMHz * 1e6); },
};
const NI = 8;
function imgVal(x, y) { const dx = (x - 3.5) / 3.6, dy = (y - 3.5) / 3.6, r = Math.hypot(dx, dy); return Math.max(.08, Math.min(1, (1 - r * r) * 1.05 + (x > 4 && y < 3 ? .25 : 0))); }
const IMG = []; for (let y = 0; y < NI; y++) { IMG.push([]); for (let x = 0; x < NI; x++) IMG[y].push(imgVal(x, y)); }
/* 전체 프레임 읽기: 맨 아래 줄부터 수평 레지스터로 내리고(수직 전송), 수평 레지스터에서 한 화소씩 출력 */
function readoutOrder() { const o = []; for (let r = NI - 1; r >= 0; r--) { o.push({ k: 'v', r }); for (let c = 0; c < NI; c++) o.push({ k: 'h', r, c }); } return o; }
const ORDER = readoutOrder();
function readState(k) { // k 개의 이벤트가 끝난 상태
  const rows = []; let hreg = null, out = []; let next = NI - 1; for (let i = 0; i < NI; i++) rows.push(true);
  for (let i = 0; i < k && i < ORDER.length; i++) { const e = ORDER[i]; if (e.k === 'v') { rows[e.r] = false; hreg = { r: e.r, got: [] }; } else { hreg.got.push(e.c); out.push([e.r, e.c]); } }
  return { rows, hreg, out };
}

/* ============ 그리기 도우미 ============ */
const COL = { bg: '#0f1a33', text: '#e3ecff', dim: '#9db0d8', ok: '#5eead4', bad: '#ff5d73', e: '#7fd6ff', gate: '#ffb454', grid: 'rgba(160,190,255,.18)', pix: '#7aa9ff' };
const W0 = 1000, H0 = 625;
function begin(api) { const { ctx, width: w, height: h } = api; ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, w, h); const k = Math.min(w / W0, h / H0); ctx.save(); ctx.translate((w - W0 * k) / 2, (h - H0 * k) / 2); ctx.scale(k, k); return ctx; }
function txt(ctx, s, x, y, col, px, wt, al) { ctx.font = `${wt || 600} ${px || 18}px sans-serif`; ctx.fillStyle = col || COL.text; ctx.textAlign = al || 'left'; ctx.fillText(s, x, y); ctx.textAlign = 'left'; }
function arrow(ctx, x0, y0, x1, y1, col, lw = 3) {
  const len = Math.hypot(x1 - x0, y1 - y0); if (len < 3) return; const a = Math.atan2(y1 - y0, x1 - x0), hd = Math.min(12, len * .5);

/* ============ 1. 빛 → 전하 ============ */

  for (let y = 0; y < NI; y++) for (let x = 0; x < NI; x++) { const q = CC.collect(P.lw, flux, ex, IMG[y][x]), f = q.q / FW; const v = Math.round(255 * f); ctx.fillStyle = `rgb(${v},${v},${Math.min(255, v + 25)})`; ctx.fillRect(gx + x * cs, gy + y * cs, cs - 3, cs - 3); if (q.sat) { ctx.strokeStyle = COL.bad; ctx.lineWidth = 2; ctx.strokeRect(gx + x * cs + 1, gy + y * cs + 1, cs - 5, cs - 5); } }

  api.setReadout([['광자 에너지 hc/λ', E.toFixed(2) + ' eV'], ['Si 한계 파장', CC.cutoff().toFixed(0) + ' nm'], ['양자 효율 QE', (qe * 100).toFixed(0) + ' %'], ['생성 전자(포화 전)', Math.round(cl.raw).toLocaleString() + ' 개'], ['저장 전자', Math.round(cl.q).toLocaleString() + ' 개 (' + (100 * cl.q / FW).toFixed(0) + ' %)']]);

/* ============ 2. 수직 전송 (3상 버킷 브리게이드) ============ */
const VS = { q: null, step: 0, acc: 0, pix: 0, hold: 0, cte: null };
const VP0 = [0.25, 0.9, 0.5, 1.0, 0.35]; const NP = 5, NG = 3 * (NP + 3);
function vReset(cte) { VS.q = new Array(NG).fill(0); VP0.forEach((v, i) => VS.q[3 * i] = v); VS.step = 0; VS.acc = 0; VS.pix = 0; VS.hold = 0; VS.cte = cte; VS.out = 0; }
function drawVertical(api) {
  const P = api.P, ctx = begin(api); if (VS.cte !== P.cte || !VS.q) vReset(P.cte);

    const dpt = deep ? 150 : 60; ctx.strokeStyle = COL.pix; ctx.lineWidth = 2.5; ctx.strokeRect(x + 3, gy + 40, gw - 6, dpt);
    const h = Math.min(dpt, VS.q[g] * 150); if (h > .5) { ctx.fillStyle = 'rgba(127,214,255,.75)'; ctx.fillRect(x + 4, gy + 40 + dpt - h, gw - 8, h); }
  }
  for (let i = 0; i <= NP + 2; i++) { ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.setLineDash([4, 5]); ctx.beginPath(); ctx.moveTo(x0 + 3 * i * gw, gy - 10); ctx.lineTo(x0 + 3 * i * gw, gy + 210); ctx.stroke(); ctx.setLineDash([]); }

  txt(ctx, `원래 ${(VP0[3] * 100).toFixed(0)} 인 전하 묶음의 현재 크기 ${(VP0[3] * lead * 100).toFixed(0)} (이론 CTE^(3n) = ${(lead * 100).toFixed(1)} %)`, x0, 462, COL.ok, 17);
  txt(ctx, '게이트 전압을 φ₁→φ₂→φ₃ 순으로 켜면 깊은 우물이 한 칸씩 옮겨 가고, 전하가 따라간다 (양동이 릴레이)', x0, 520, COL.dim, 16);
  const tot = VS.q.reduce((a, b) => a + b, 0) + VS.out; txt(ctx, `총 전하 (읽은 것 포함) ${(tot * 100).toFixed(1)} — 보존됨`, x0, 560, COL.dim, 15);
  api.setStatus(`φ${act + 1} 가 깊다 · ${n} 화소 이동 · CTE ${P.cte.toFixed(3)}`);
  api.setReadout([['게이트당 전송 효율 CTE', P.cte.toFixed(3)], ['한 화소 이동(게이트 3번)', (Math.pow(P.cte, 3) * 100).toFixed(2) + ' %'], ['n 화소 이동 후 남는 비율', (lead * 100).toFixed(1) + ' %'], ['놓고 간 전하 (꼬리)', ((1 - lead) * 100).toFixed(1) + ' %'], ['이동한 화소 수', n]]);

}

/* ============ 3. 수평 전송과 출력 ============ */
const HS = { t: 0 };
const HROW = [0.25, 0.9, 0.5, 1.0, 0.35, 0.7, 0.15, 0.55];
function drawHoriz(api) {
  const P = api.P, ctx = begin(api), g = CC.gain(P.cfd), vmax = FW * g * 1e-6, per = 1.1, n = HROW.length, tt = HS.t / per, kk = Math.floor(tt) % (n + 2), fr = tt - Math.floor(tt);
  const x0 = 70, y0 = 150, cw = 80; txt(ctx, '수평 레지스터: 한 줄을 출력 쪽으로 밀어낸다', x0, 70, COL.dim, 18);
  // 패킷 위치: i 번째 패킷은 kk+fr 칸 이동 (출력은 오른쪽 끝)
  for (let c = 0; c < n; c++) { ctx.strokeStyle = COL.pix; ctx.lineWidth = 2; ctx.strokeRect(x0 + c * cw, y0, cw - 6, 80); }
  for (let i = 0; i < n; i++) { const posi = i + kk + fr; if (posi >= n) continue; const x = x0 + posi * cw; ctx.fillStyle = 'rgba(127,214,255,.8)'; const h = HROW[i] * 70; ctx.fillRect(x + 3, y0 + 76 - h, cw - 12, h); }
  // 출력 노드
  const ox = x0 + n * cw + 20; ctx.strokeStyle = COL.gate; ctx.lineWidth = 3; ctx.strokeRect(ox, y0 + 10, 70, 60); txt(ctx, '출력 노드', ox + 35, y0 - 8, COL.gate, 15, 700, 'center'); txt(ctx, `C = ${P.cfd} fF`, ox + 35, y0 + 45, COL.text, 14, 600, 'center');
  ctx.beginPath(); ctx.moveTo(ox + 70, y0 + 40); ctx.lineTo(ox + 110, y0 + 40); ctx.stroke(); ctx.beginPath(); ctx.moveTo(ox + 110, y0 + 20); ctx.lineTo(ox + 110, y0 + 60); ctx.lineTo(ox + 140, y0 + 40); ctx.closePath(); ctx.stroke(); txt(ctx, '증폭기', ox + 105, y0 + 82, COL.gate, 14, 600, 'center');
  // 파형
  const wx = 70, wy = 420, ww = 840, wh = 140; txt(ctx, '출력 전압 (영상 신호)', wx, 330, COL.dim, 18); ctx.strokeStyle = COL.grid; ctx.lineWidth = 1; ctx.strokeRect(wx, wy - wh, ww, wh);
  const done = Math.min(n, kk + (fr > .5 ? 1 : 0)); ctx.strokeStyle = COL.ok; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(wx, wy - 10);
  const slot = ww / n; for (let i = 0; i < done; i++) { const idx = n - 1 - i, v = HROW[idx], y = wy - 10 - v * (wh - 30); ctx.lineTo(wx + i * slot, y); ctx.lineTo(wx + (i + .9) * slot, y); ctx.lineTo(wx + (i + .95) * slot, wy - 10); ctx.lineTo(wx + (i + 1) * slot, wy - 10); }
  ctx.stroke();
  const dns = HROW.map(v => CC.dn(v * FW, P.cfd, P.bits));
  txt(ctx, '출력 순서 → ' + HROW.slice().reverse().map((v, i) => `${dns[n - 1 - i]}`).join(' · ') + ' (디지털 값)', wx, 590, COL.text, 17);
  api.setStatus(`${Math.min(done, n)} / ${n} 화소 출력`);
  api.setReadout([['변환 이득 (e⁻당 전압)', g.toFixed(1) + ' µV/e⁻'], ['최대 신호 전압', (vmax * 1000).toFixed(0) + ' mV'], ['ADC 비트', P.bits + ' bit'], ['전자/최소 단위(LSB)', (FW / 2 ** P.bits).toFixed(1) + ' 개'], ['가장 밝은 화소 디지털 값', Math.max(...dns)]]);
  api.setNote('전하를 전압으로 바꾸는 출력 노드 용량 C 가 작을수록 전자 하나당 전압(변환 이득 = q/C)이 커진다. CCD 는 센서 전체가 출력 증폭기 하나로 읽는 것이 특징이다(CMOS 는 화소마다 증폭기). 소스 팔로어 이득 0.85 와 최대 전하 20,000 개는 예시이다.');
  plot(api, { xmin: 0, xmax: FW, ymin: 0, ymax: 400, xt: [0, 5000, 10000, 15000, 20000], yt: [0, 100, 200, 300, 400], xl: '전하 (전자 수)', yl: '전압 (mV)', curves: [{ fn: q => q * g * 1e-3 }, { fn: q => q * CC.gain(Math.min(50, P.cfd * 2)) * 1e-3, col: COL.gate }], marks: [{ x: FW, y: vmax * 1000, lab: (vmax * 1000).toFixed(0) + ' mV' }] });
  ctx.restore();
}

/* ============ 4. 전체 프레임 읽기 ============ */
const IS = { t: 0 };
function drawImage(api) {
  const P = api.P, ctx = begin(api), k = Math.floor(IS.t * 6) % (ORDER.length + 8), st = readState(Math.min(k, ORDER.length)), cs = 44, x0 = 70, y0 = 120, sc = P.ex2 / 10;
  const val = (r, c) => Math.min(1, IMG[r][c] * sc);
  txt(ctx, '센서 (아래 줄부터 한 줄씩 수평 레지스터로)', x0, 70, COL.dim, 17);
  for (let r = 0; r < NI; r++) for (let c = 0; c < NI; c++) { const x = x0 + c * cs, y = y0 + r * cs; if (st.rows[r]) { const v = Math.round(255 * val(r, c)); ctx.fillStyle = `rgb(${v},${v},${Math.min(255, v + 25)})`; } else ctx.fillStyle = 'rgba(160,190,255,.07)'; ctx.fillRect(x, y, cs - 3, cs - 3); }
  const hy = y0 + NI * cs + 14; txt(ctx, '수평 레지스터', x0, hy + 38, COL.dim, 14);
  for (let c = 0; c < NI; c++) { const x = x0 + c * cs; ctx.strokeStyle = COL.gate; ctx.lineWidth = 2; ctx.strokeRect(x, hy, cs - 3, 30); if (st.hreg && !st.hreg.got.includes(c)) { const v = Math.round(255 * val(st.hreg.r, c)); ctx.fillStyle = `rgb(${v},${v},${Math.min(255, v + 25)})`; ctx.fillRect(x + 2, hy + 2, cs - 7, 26); } }
  arrow(ctx, x0 + NI * cs + 20, hy + 15, x0 + NI * cs + 70, hy + 15, COL.gate, 3); txt(ctx, '출력', x0 + NI * cs + 20, hy - 6, COL.gate, 14);
  const rx = 560; txt(ctx, '복원된 영상 (읽은 순서대로 채움)', rx, 70, COL.dim, 17);
  const got = {}; st.out.forEach(([r, c]) => got[r * NI + c] = 1);
  for (let r = 0; r < NI; r++) for (let c = 0; c < NI; c++) { const x = rx + c * cs, y = y0 + r * cs; if (got[r * NI + c]) { const v = Math.round(255 * val(r, c)); ctx.fillStyle = `rgb(${v},${v},${Math.min(255, v + 25)})`; } else ctx.fillStyle = 'rgba(160,190,255,.07)'; ctx.fillRect(x, y, cs - 3, cs - 3); }
  const n = NI * NI, tr = CC.readTime(n, P.fclk), real = CC.readTime(12e6, 100);
  txt(ctx, `이 센서(${n} 화소) 읽기 ${(tr * 1e6).toFixed(2)} µs · ${st.out.length} / ${n}`, x0, 590, COL.text, 17);
  api.setStatus(`${st.out.length} / ${n} 화소 읽음`);
  api.setReadout([['노출 배율', P.ex2 + ' ms'], ['화소 클럭', P.fclk + ' MHz'], ['이 센서 읽는 시간', (tr * 1e6).toFixed(2) + ' µs'], ['1200만 화소(100 MHz)', (real * 1000).toFixed(0) + ' ms'], ['포화된 화소', IMG.flat().filter(v => v * sc > 1).length + ' 개']]);
  api.setNote('한 줄씩 수직 전송 → 수평 레지스터에서 한 화소씩 출력 → 출력 순서대로 화면에 다시 배열하면 사진이 복원된다. 노출을 늘리면 밝은 화소부터 포화(흰색)된다. 읽는 시간 = 화소 수 ÷ 화소 클럭 (1200만 화소는 예시).');
  ctx.restore();
}

const DRAW = { photo: drawPhoto, vertical: drawVertical, horiz: drawHoriz, image: drawImage };
const SIM = {
  enter(api) { VS.q = null; HS.t = 0; IS.t = 0; api.setPlaying && api.setPlaying(!!{ vertical: 1, horiz: 1, image: 1 }[api.scenario.id]); },
  reset(api) { VS.q = null; HS.t = 0; IS.t = 0; api.refresh(); },
  update(api) { (DRAW[api.scenario.id] || drawPhoto)(api); },
  frame(api, dt) {
    const playing = typeof api.playing === 'function' ? api.playing() : api.playing; if (playing === false) return;
    dt = Math.min(dt, 1 / 30); const id = api.scenario.id, P = api.P;
    if (id === 'vertical') {
      if (VS.cte !== P.cte || !VS.q) vReset(P.cte);
      if (VS.hold > 0) { VS.hold -= dt; if (VS.hold <= 0) vReset(P.cte); }
      else { VS.acc += dt * P.clk; while (VS.acc >= 1) { VS.acc -= 1; VS.out += CC.step(VS.q, VS.step, P.cte); VS.step++; VS.pix = Math.floor(VS.step / 3); if (VS.pix >= NP + 2) { VS.hold = 1.5; break; } } }
    } else if (id === 'horiz') HS.t += dt; else if (id === 'image') IS.t += dt;
    (DRAW[id] || drawPhoto)(api);
  },
  tests() {
    const T = [], near = (a, b, e) => Math.abs(a / b - 1) < e;
    T.push(['Si 한계 파장 = hc/E_g ≈ 1107 nm', Math.abs(CC.cutoff() - 1107) < 1, CC.cutoff().toFixed(1)]);
    T.push(['QE: 한계 파장 이상 0, 가시광선(550 nm) 최대', CC.qe(1107) === 0 && CC.qe(1200) === 0 && CC.qe(550) >= CC.qe(450) && CC.qe(550) >= CC.qe(900), '']);
    const c1 = CC.collect(550, 1000, 5), c2 = CC.collect(550, 1000, 10); T.push(['전하량은 노출 시간에 비례 (포화 전)', near(c2.q, 2 * c1.q, 1e-12) && !c1.sat, c1.q.toFixed(0)]);
    const cs = CC.collect(550, 1e5, 50); T.push(['최대 전하 용량에서 포화 (넘침)', cs.q === FW && cs.sat, '']);
    const q0 = new Array(30).fill(0); q0[0] = 1; const r = CC.shift(q0, .99, 4); const lead = r.q[12];
    T.push(['3상 전송: 선두 묶음 = CTE^(3n)', near(lead, Math.pow(.99, 12), 1e-12), lead.toFixed(4)]);
    T.push(['3상 전송: 전하 보존 (읽은 양 포함)', Math.abs(r.q.reduce((a, b) => a + b, 0) + r.out - 1) < 1e-12, '']);
    const r1 = CC.shift(q0, 1, 5); T.push(['CTE = 1 이면 완벽 이동 (꼬리 없음)', Math.abs(r1.q[15] - 1) < 1e-12 && r1.q.filter((v, i) => i !== 15 && v > 1e-12).length === 0, '']);
    T.push(['변환 이득 = q/C: 10 fF → 16 µV/e⁻ (소스 팔로어 전)', near(CC.gain(10, 1), 16.02, 0.001), CC.gain(10, 1).toFixed(2)]);
    T.push(['C 를 절반으로 하면 이득 2배', near(CC.gain(5) / CC.gain(10), 2, 1e-12), '']);
    T.push(['ADC: 단조 증가, 최대 전하 = 최댓값', CC.dn(1000, 10, 12) < CC.dn(5000, 10, 12) && CC.dn(FW, 10, 12) === 2 ** 12 - 1 && CC.dn(0, 10, 12) === 0, '']);
    const rec = {}; for (let i = 0; i < ORDER.length; i++) { const e = ORDER[i]; if (e.k === 'h') rec[e.r * NI + e.c] = 1; } T.push(['프레임 읽기: 모든 화소를 한 번씩 읽는다 (복원 가능)', Object.keys(rec).length === NI * NI && ORDER.length === NI * (NI + 1), '']);
    T.push(['읽는 시간 = 화소 수 / 클럭: 1200만 화소, 100 MHz → 0.12 s', near(CC.readTime(12e6, 100), .12, 1e-12), '']);
    T.push(['슬라이더 양 끝값에서 NaN·Infinity 없음', [300, 1200].every(l => Number.isFinite(CC.qe(l))) && [1, 50].every(c => Number.isFinite(CC.gain(c)) && Number.isFinite(CC.dn(100, c, 8))), '']);
    return T;
  },
};

</script>
<script>
"use strict";
/* ============================ 공용 UI 프레임워크 (템플릿) ============================ */
(function () {
  const C = WS_CONFIG;
  const $ = (id) => document.getElementById(id);
  const P = {};
  const ui = { tab: C.tabs[0].id, scenarioId: null, playing: false };
  const lastScenarioOfTab = {};

  function addDefaults(params) { (params || []).forEach(p => { if (!(p.key in P)) P[p.key] = p.value; }); }
  C.scenarios.forEach(s => { addDefaults(s.params); addDefaults(s.choices); });
  if (C.common_params) addDefaults(C.common_params.params);

  function current() { return C.scenarios.find(s => s.id === ui.scenarioId); }
  function scenariosOfTab(tab) { return C.scenarios.filter(s => s.tab === tab); }
  function fmtVal(v, unit) {
    if (!unit) return String(v);
    return /^[°%′″]/.test(unit) ? v + unit : v + " " + unit;
  }

  function showError(where, e) {
    const box = $("simError");
    box.hidden = false;
    box.textContent = "시뮬레이션 오류 (" + where + "): " + (e && e.message ? e.message : e);
    console.error(e);
  }
  const SIMOBJ = (typeof SIM !== "undefined") ? SIM : null;
  function call(hook, ...args) {
    if (!SIMOBJ || typeof SIMOBJ[hook] !== "function") return undefined;
    try { return SIMOBJ[hook](api, ...args); } catch (e) { showError(hook, e); return undefined; }
  }

  /* ---------- 렌더러 ---------- */
  const wrap = $("sceneWrap");
  const api = {
    config: C, P,
    get scenario() { return current(); },
    get tab() { return ui.tab; },
    get playing() { return ui.playing; },
    setPlaying(b) { ui.playing = !!b; updatePlayButton(); },
    boxHalf: (C.scene && C.scene.box_half) || 16,
    sceneEl: wrap,
    THREE: window.THREE || null,
    scene: null, camera: null, renderer: null, controls: null,
    canvas: null, ctx: null, width: 0, height: 0,
    custom: $("customPanel"),
    chart: {
      canvas: $("chartCanvas"),
      ctx: $("chartCanvas").getContext("2d"),
      setHint(html) { $("chartHint").innerHTML = html; },
    },
    setReadout(rows) {
      const tbl = $("readout");
      tbl.innerHTML = "";
      (rows || []).forEach(r => {
        const tr = document.createElement("tr");
        const a = document.createElement("td"); a.textContent = r[0];
        const b = document.createElement("td"); b.textContent = r[1];
        tr.append(a, b); tbl.appendChild(tr);
      });
    },
    setNote(text) { $("readoutNote").textContent = text || ""; },
    setStatus(text) { const el = $("wsStatus"); if (el) el.textContent = text || ""; },
    setParam(key, v) {
      P[key] = v;
      const el = $("p_" + key); if (el) el.value = v;
      const vEl = $("p_" + key + "_val"); if (vEl) vEl.textContent = fmtVal(v, vEl.dataset.unit);
    },
    refresh() { call("update"); },
  };

  function initRenderer() {
    const sc = C.scene || {};
    if (C.renderer === "three") {
      if (!window.THREE) { showError("init", "Three.js를 불러오지 못했습니다 (인터넷 연결 확인)"); return false; }
      const T = window.THREE;
      api.scene = new T.Scene();
      api.camera = new T.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 500);
      const cp = sc.camera || [26, 20, 30];
      api.camera.position.set(cp[0], cp[1], cp[2]);
      api.renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
      api.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      wrap.insertBefore(api.renderer.domElement, wrap.firstChild);
      api.controls = new T.OrbitControls(api.camera, api.renderer.domElement);
      api.controls.enableDamping = true;
      api.controls.dampingFactor = 0.08;
      api.controls.target.set(0, 0, 0);
      api.scene.add(new T.AmbientLight(0xffffff, 0.55));
      const dl = new T.DirectionalLight(0xffffff, 0.9);
      dl.position.set(20, 30, 15);
      api.scene.add(dl);
      if (sc.grid !== false) api.scene.add(new T.GridHelper(api.boxHalf * 2, 16, 0x3a5a8a, 0x1f3352));
      if (sc.axes !== false) api.scene.add(new T.AxesHelper(api.boxHalf * 0.6));
    } else {
      api.canvas = document.createElement("canvas");
      wrap.insertBefore(api.canvas, wrap.firstChild);
      api.ctx = api.canvas.getContext("2d");
    }
    window.addEventListener("resize", onResize);
    onResize();
    return true;
  }

  function onResize() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    api.width = w; api.height = h;
    if (api.renderer) {
      api.camera.aspect = w / h;
      api.camera.updateProjectionMatrix();
      api.renderer.setSize(w, h);
    } else if (api.canvas) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      api.canvas.width = Math.round(w * dpr);
      api.canvas.height = Math.round(h * dpr);
      api.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (ui.scenarioId) call("update");
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    if (api.controls) api.controls.update();
    call("frame", 1 / 60);
    if (api.renderer) api.renderer.render(api.scene, api.camera);
  }

  /* ---------- UI ---------- */
  function renderTabs() {
    const box = $("tabs");
    box.innerHTML = "";
    box.hidden = C.tabs.length < 2;
    C.tabs.forEach(t => {
      const b = document.createElement("button");
      b.textContent = t.label;
      b.className = t.id === ui.tab ? "active" : "";
      b.addEventListener("click", () => switchTab(t.id));
      box.appendChild(b);
    });
  }

  function renderPicker() {
    const box = $("scenarioPicker");
    const list = scenariosOfTab(ui.tab);
    box.innerHTML = "";
    box.hidden = list.length < 2;
    list.forEach(s => {
      const b = document.createElement("button");
      b.textContent = s.name;
      b.className = s.id === ui.scenarioId ? "active" : "";
      b.addEventListener("click", () => selectScenario(s.id));
      box.appendChild(b);
    });
  }

  function sliderEl(p) {
    const div = document.createElement("div");
    div.className = "param";
    const label = document.createElement("label");
    label.textContent = p.label + " ";
    const val = document.createElement("span");
    val.className = "val"; val.id = "p_" + p.key + "_val"; val.dataset.unit = p.unit || "";
    val.textContent = fmtVal(P[p.key], p.unit);
    label.appendChild(val);
    const inp = document.createElement("input");
    inp.type = "range"; inp.id = "p_" + p.key;
    inp.min = p.min; inp.max = p.max; inp.step = p.step; inp.value = P[p.key];
    inp.addEventListener("input", () => {
      const v = parseFloat(inp.value);
      P[p.key] = v;
      val.textContent = fmtVal(v, p.unit);
      call("update");
    });
    div.append(label, inp);
    return div;
  }

  function choiceEl(c) {
    const row = document.createElement("div");
    row.className = "row"; row.style.marginBottom = "8px";
    if (c.label) { const l = document.createElement("b"); l.style.fontSize = "0.9em"; l.textContent = c.label; row.appendChild(l); }
    c.options.forEach(o => {
      const b = document.createElement("button");
      b.textContent = o.label;
      b.className = P[c.key] === o.value ? "primary" : "";
      b.addEventListener("click", () => {
        P[c.key] = o.value;
        row.querySelectorAll("button").forEach(x => x.className = "");
        b.className = "primary";
        call("update");
      });
      row.appendChild(b);
    });
    return row;
  }

  function renderControls() {
    const s = current();
    const body = $("scenarioBody");
    body.innerHTML = "";
    if (s.desc || s.section) {
      const p = document.createElement("p");
      p.className = "hint"; p.style.marginBottom = "10px";
      if (s.section) { const b = document.createElement("b"); b.textContent = s.section; p.appendChild(b); if (s.desc) p.appendChild(document.createTextNode(" — ")); }
      if (s.desc) p.appendChild(document.createTextNode(s.desc));
      body.appendChild(p);
    }
    (s.choices || []).forEach(c => body.appendChild(choiceEl(c)));
    (s.params || []).forEach(p => body.appendChild(sliderEl(p)));
    if (s.animated) {
      const st = document.createElement("div");
      st.className = "hint"; st.id = "wsStatus";
      st.textContent = s.status_hint || "";
      body.appendChild(st);
      const row = document.createElement("div");
      row.className = "controls-row";
      const play = document.createElement("button");
      play.id = "playBtn"; play.className = "primary";
      play.addEventListener("click", () => { ui.playing = !ui.playing; updatePlayButton(); });
      const reset = document.createElement("button");
      reset.textContent = "↺ 리셋";
      reset.addEventListener("click", () => { ui.playing = false; updatePlayButton(); call("reset"); call("update"); });
      row.append(play, reset);
      body.appendChild(row);
      updatePlayButton();
    }
    const cp = C.common_params;
    if (cp && s.use_common !== false) {
      const hr = document.createElement("hr");
      hr.style.cssText = "margin:10px 0;border:none;border-top:1px solid var(--border)";
      body.appendChild(hr);
      if (cp.title) { const b = document.createElement("b"); b.style.fontSize = "0.9em"; b.textContent = cp.title; body.appendChild(b); }
      cp.params.forEach(p => body.appendChild(sliderEl(p)));
    }
  }

  function updatePlayButton() {
    const b = $("playBtn");
    if (b) b.textContent = ui.playing ? "⏸ 일시정지" : "▶ 재생";
  }

  function renderFormula() {
    const s = current();
    const body = $("formulaBody");
    body.innerHTML = (s.formula || []).map(f =>
      (f.eq_html ? `<div class="eq">${f.eq_html}</div>` : "") + (f.text_html || "")
    ).join("");
  }

  function renderMisconception() {
    const s = current();
    const panel = $("misconceptionPanel");
    panel.innerHTML = "";
    panel.hidden = !s.misconception;
    if (!s.misconception) return;
    const box = document.createElement("div");
    box.className = "misconception";
    const b = document.createElement("b");
    b.textContent = s.misconception_title || "💡 흔한 오개념";
    box.append(b, document.createElement("br"), document.createTextNode(s.misconception));
    panel.appendChild(box);
  }

  function enterScenario() {
    ui.playing = false;
    const s = current();
    $("graphPanel").hidden = !s.chart;
    $("chartHint").innerHTML = "";
    api.custom.innerHTML = "";
    api.setReadout([]); api.setNote("");
    renderPicker(); renderControls(); renderFormula(); renderMisconception();
    call("enter");
    call("update");
  }

  function selectScenario(id) {
    ui.scenarioId = id;
    lastScenarioOfTab[ui.tab] = id;
    enterScenario();
  }

  function switchTab(tab) {
    ui.tab = tab;
    renderTabs();
    selectScenario(lastScenarioOfTab[tab] || scenariosOfTab(tab)[0].id);
  }

  function renderLegend() {
    const box = $("legend");
    (C.legend || []).forEach(l => {
      const span = document.createElement("span");
      const sw = document.createElement("i");
      sw.className = "swatch" + (l.shape === "bar" ? " bar" : "");
      sw.style.background = l.color;
      span.append(sw, document.createTextNode(l.label));
      box.appendChild(span);
    });
  }

  function runSelfTests() {
    if (!SIMOBJ || typeof SIMOBJ.tests !== "function") { console.log("물리 검증 항목 없음"); return; }
    let results = [];
    try { results = SIMOBJ.tests() || []; } catch (e) { showError("tests", e); return; }
    console.log("=== " + C.title + " 물리 검증 ===");
    let pass = 0;
    for (const [name, ok, detail] of results) {
      console.log(`[${ok ? "PASS" : "FAIL"}] ${name}${detail ? " — " + detail : ""}`);
      if (ok) pass++;
    }
    console.log(pass === results.length ? "모든 검증 통과" : "일부 검증 실패 — 콘솔 확인 필요");
    window.__wsSelfTest = { pass, total: results.length };
  }

  /* ---------- 시작 ---------- */
  $("readoutTitle").textContent = C.readout_title || "측정값";
  $("hoverHint").textContent = (C.scene && C.scene.hint != null) ? C.scene.hint
    : (C.renderer === "three" ? "마우스 드래그: 회전 · 휠: 확대/축소" : "");
  $("projectorBtn").addEventListener("click", () => document.body.classList.toggle("projector"));
  renderLegend();
  if (!SIMOBJ) showError("load", "sim_js에 SIM 객체가 정의되지 않았습니다");
  if (initRenderer()) {
    call("init");
    renderTabs();
    switchTab(ui.tab);
    animate();
  }
  runSelfTests();
})();
</script>
