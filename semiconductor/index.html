<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반도체·첨단과학 — 물리 시뮬레이션</title>
<style>
  :root { --bg:#f4f6fa; --panel:#fff; --ink:#1c2733; --sub:#5a6b7d; --accent:#1f6fd6; --ok:#1e8f4e; --border:#d7dee8; --radius:12px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); padding:20px; line-height:1.6; }
  .wrap { max-width:900px; margin:0 auto; }
  .home { display:inline-block; color:var(--sub); text-decoration:none; font-size:0.9em; margin-bottom:14px; }
  .home:hover { color:var(--accent); }
  header h1 { font-size:1.6em; }
  header p { color:var(--sub); margin-top:4px; }
  h2 { font-size:1.15em; margin:26px 0 12px; padding-bottom:6px; border-bottom:2px solid var(--border); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; text-decoration:none; color:inherit; display:block; transition:transform .1s, box-shadow .1s; }
  .card:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.08); border-color:var(--accent); }
  .card.disabled { opacity:.55; pointer-events:none; }
  .card .icon { font-size:2em; }
  .card .title { font-weight:700; font-size:1.1em; margin:6px 0 2px; }
  .card .desc { color:var(--sub); font-size:0.9em; }
  .badge { display:inline-block; font-size:0.75em; padding:2px 8px; border-radius:20px; margin-top:8px; }
  .badge.done { background:#e3f4ea; color:var(--ok); }
  .badge.cp { background:#eae6ff; color:#5b3fd6; }
  .badge.wip { background:#fdf1e0; color:#c07c00; }
  .card .thumb { display:block; width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:8px; border:1px solid #d7dee8; margin-bottom:10px; background:#eef2f7; }
  .card .thumb + .icon { display:none; }
  .card .try { margin-top:8px; font-size:0.82em; color:#5a6b7d; line-height:1.5; }
  .card .try b { color:#1f6fd6; font-weight:600; margin-right:4px; }
</style>
<link rel="stylesheet" href="../site.css?v=2">
</head>
<body>
<div class="wrap">
  <a class="home" href="../index.html">← 홈으로</a>
  <header>
    <h1>🔬 반도체·첨단과학</h1>
    <p>반도체 공정·이미지 센서·전자현미경</p>
  </header>

  <h2>시뮬레이션</h2>
  <div class="grid">
    <a class="card" href="photolithography/index.html">
      <img class="thumb" src="photolithography/thumb.jpg" alt="" loading="lazy" onerror="this.remove()">
      <div class="icon">🔬</div>
      <div class="title">포토리소그래피 7단계</div>
      <div class="desc">세정→산화→도포→노광→현상→식각→제거</div>
      <div class="try"><b>조절</b>← 이전 · 다음 → 단계 이동<br><b>관찰</b>웨이퍼 단면이 단계마다 바뀌는 모습</div>
      <span class="badge done">✔ 완료</span>
    </a>
    <a class="card" href="ccd-sensor/index.html">
      <img class="thumb" src="ccd-sensor/thumb.jpg" alt="" loading="lazy" onerror="this.remove()">
      <div class="icon">📷</div>
      <div class="title">CCD 이미지 센서</div>
      <div class="desc">전하 축적·버킷 브리게이드 전송·출력 앰프</div>
      <div class="try"><b>조절</b>빛의 세기(화면 안내 따라 진행)<br><b>관찰</b>전하 축적과 버킷 브리게이드 전송</div>
      <span class="badge done">✔ 완료</span>
    </a>
    <a class="card" href="electron-microscope/index.html">
      <img class="thumb" src="electron-microscope/thumb.jpg" alt="" loading="lazy" onerror="this.remove()">
      <div class="icon">🔭</div>
      <div class="title">전자현미경 (TEM/SEM)</div>
      <div class="desc">전자광학·결상 원리</div>
      <div class="try"><b>조절</b>원리·TEM·SEM·비교 탭 선택<br><b>관찰</b>전자 빔이 시료를 통과·주사하는 과정</div>
      <span class="badge done">✔ 완료</span>
    </a>
      <!-- AUTO:CARDS:END -->
</div>
</div>
<script src="../site-nav.js?v=2"></script>
</body>
</html>
