<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포토리소그래피 공정 7단계</title>
<style>
  :root {
    --bg: #f4f6fa; --panel: #ffffff; --ink: #1c2733; --sub: #5a6b7d;
    --accent: #1f6fd6; --accent2: #d64545; --ok: #1e8f4e;
    --border: #d7dee8; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink);
    padding: 12px; font-size: 15px;
  }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  header h1 { font-size: 1.25em; }
  header .spacer { flex: 1; }
  a.home { text-decoration:none; color:var(--sub); border:1px solid var(--border); padding:6px 12px; border-radius:8px; font-size:0.9em; white-space:nowrap; }

  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button { flex: 0 0 auto; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 1em; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .layout { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .sim-col { flex: 2 1 480px; display: flex; flex-direction: column; gap: 12px; }
  .side-col { flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px; }

  #sceneWrap { position: relative; width: 100%; aspect-ratio: 16/10; border-radius: 8px; overflow: hidden; background: radial-gradient(circle at 50% 30%, #16233a, #060a12 75%); }
  #sceneWrap canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hoverHint { position:absolute; left:8px; bottom:8px; color:#9fb3d9; font-size:0.78em; background:rgba(6,10,18,0.55); padding:4px 8px; border-radius:6px; pointer-events:none; }
  #hoverHint:empty { display: none; }
  #simError { position:absolute; left:8px; right:8px; top:8px; color:#fff; background:rgba(214,69,69,0.92); padding:6px 10px; border-radius:6px; font-size:0.82em; white-space:pre-wrap; }

  .scenario-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .scenario-picker button { flex: 1 1 30%; min-width: 120px; padding: 8px 6px; font-size: 0.86em; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  .scenario-picker button.active { background: #eaf1fd; border-color: var(--accent); color: var(--accent); font-weight: 700; }

  .param { margin-bottom: 10px; }
  .param label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; font-size: 0.92em; }
  .param label .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  .param input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--sub); font-size: 0.83em; margin-top: 2px; line-height: 1.5; }

  button { font-size: 1em; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.warn { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .controls-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.82em; color: var(--sub); margin-top: 8px; }
  .legend:empty { display: none; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .swatch.bar { border-radius: 2px; }

  table.readout { width: 100%; border-collapse: collapse; font-size: 0.92em; }
  table.readout td { padding: 4px 2px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  table.readout td:first-child { color: var(--sub); }
  table.readout td:last-child { text-align: right; font-weight: 700; }

  details { margin-top: 6px; }
  summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
  .formula-body { padding: 8px 2px; line-height: 1.8; font-size: 0.92em; }
  .formula-body .eq { font-size: 1.08em; text-align: center; margin: 6px 0; font-family: Georgia, serif; }
  .note { border-left: 3px solid var(--accent); background: #eef4fd; padding: 8px 10px; border-radius: 6px; font-size: 0.86em; margin-top: 8px; line-height: 1.6; }
  .note:empty { display: none; }
  .misconception { border-left: 3px solid var(--accent2); background: #fdeeee; padding: 8px 10px; border-radius: 6px; font-size: 0.86em; margin-top: 8px; line-height: 1.6; }

  canvas.chart { width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 6px; }

  body.projector { font-size: 19px; }
  body.projector button { padding: 12px 18px; }
  body.projector .scenario-picker button { font-size: 1em; padding: 12px 8px; }

  @media (max-width: 720px) {
    body { font-size: 16px; padding: 8px; }
    .layout { flex-direction: column; }
    .sim-col, .side-col { flex: 1 1 100%; }
    button { padding: 11px 14px; }
    input[type=range] { height: 26px; }
  }
/* ---- 레시피 입력 extra_css ---- */

</style>
</head>
<body>

<header>
  
  <h1>🔬 포토리소그래피 공정 7단계</h1>
  <span class="spacer"></span>
  <button id="projectorBtn" title="프로젝터용 큰 글씨 모드">🖥 큰 글씨 모드</button>
</header>

<div class="tabs" id="tabs"></div>

<div class="layout">

  <div class="sim-col">
    <div class="panel">
      <div id="sceneWrap">
        <div id="hoverHint"></div>
        <div id="simError" hidden></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="panel" id="graphPanel" hidden>
      <canvas id="chartCanvas" class="chart" width="440" height="220"></canvas>
      <div class="hint" id="chartHint"></div>
    </div>
  </div>

  <div class="side-col">

    <div class="panel" id="scenarioPanel">
      <div class="scenario-picker" id="scenarioPicker"></div>
      <div id="scenarioBody"></div>
      <div id="customPanel"></div>
    </div>

    <div class="panel" id="readoutPanel">
      <b id="readoutTitle"></b>
      <table class="readout" id="readout"></table>
      <div class="note" id="readoutNote"></div>
    </div>

    <div class="panel">
      <details id="formulaDetails">
        <summary>📐 관련 공식 보기</summary>
        <div class="formula-body" id="formulaBody"></div>
      </details>
    </div>

    <div class="panel" id="misconceptionPanel"></div>

  </div>
</div>

/* ============ 4. 노광 ============ */

/* ============ 5. 현상 ============ */

/* ============ 6. 식각 ============ */
const ES = { t: 0 };
function drawEtch(api) {
  const P = api.P, ctx = begin(api), dry = P.method === 'dry', iso = dry ? .05 : 1, S = P.sel, prInit = 600, e = PH.etch(P.ed, S, iso, prInit), sc = .2;

  if (e.prLeft <= 0) txt(ctx, '감광막이 다 닳았다 — 마스크 역할 상실 ⚠', SX, 590, COL.bad, 20, 700);
  api.setReadout([['방식', dry ? '건식 (이방성)' : '습식 (등방성)'], ['식각 깊이', P.ed + ' nm'], ['옆 방향 침식', e.under.toFixed(0) + ' nm'], ['선택비 (산화막:PR)', S + ' : 1'], ['남은 감광막', Math.max(0, e.prLeft).toFixed(0) + ' nm']]);
  api.setNote('두께·선택비·침식 비율(건식 5 %, 습식 100 %)은 개념 설명용 예시값이다. 산화막 300 nm, 감광막 600 nm 에서 시작한다고 가정했다. 깊이가 300 nm 를 넘으면 아래 Si 까지 파인다.');

/* ============ 7. 감광막 제거 ============ */

  txt(ctx, `O₂ 플라즈마 애싱 ${P.at.toFixed(1)} 분`, SX, 70, COL.text, 22, 700);
  if (left > 0) { for (let i = 0; i < 10; i++) { const x = SX + 40 + i * 70 + (i % 3) * 8; arrow(ctx, x, 150 + (i % 2) * 15, x, SYB - 300 * sc - left * sc - 6, COL.uv, 2.5); } txt(ctx, `남은 감광막 ${left.toFixed(0)} nm`, SX, 590, COL.pr, 20, 700); }

  api.setReadout([['애싱 시간', P.at.toFixed(1) + ' 분'], ['남은 감광막', left.toFixed(0) + ' nm'], ['완전 제거에 필요한 시간', clear.toFixed(1) + ' 분'], ['층 수', P.lay + ' 층'], ['누적 공정 단계', 7 * P.lay + ' 단계']]);
  api.setNote('제거 속도 300 nm/min 은 예시이다. 실제로는 시간이 모자라면 잔여물이 남아 다음 층의 불량이 된다. 이 7단계를 층마다 반복해 수십~수백 번 거친다.');
  plot(api, { xmin: 0, xmax: 6, ymin: 0, ymax: 600, xt: [0, 2, 4, 6], yt: [0, 300, 600], xl: '시간 (분)', yl: '남은 PR (nm)', curves: [{ fn: m => PH.ash(init, rate, m) }], marks: [{ x: P.at, y: left, lab: left.toFixed(0) + ' nm' }] });
  ctx.restore();
}

/* ============ 8. 7단계 한눈에 ============ */
const STEPS = ['시작: 맨 웨이퍼', '① 세정', '② 산화', '③ 감광막 도포', '④ 노광', '⑤ 현상', '⑥ 식각', '⑦ 감광막 제거'];
const PRIN = ['', '표면 오염 제거 (수율 e^(−DA))', 'Si + O₂ → SiO₂ (절연막)', '원심력으로 균일한 막 (두께 ∝ ω^(−1/2))', '빛(E = hc/λ)으로 PR 성질 변화, R = k₁λ/NA', '빛 받은 PR 이 씻겨 나가 패턴 드러남', '이온이 수직으로 PR 없는 곳만 제거', 'O₂ 플라즈마로 PR 제거 → 회로 패턴 완성'];
const FS = { t: 0, last: -1 };
function drawFlow(api) {
  const P = api.P, ctx = begin(api), k = Math.round(P.stp), neg = P.tone2 === 'neg', sc = .2, oxT = 300 * sc, prH = 120;
  txt(ctx, STEPS[k], SX, 60, COL.text, 26, 700); txt(ctx, PRIN[k] || '실리콘 웨이퍼에서 시작', SX, 95, COL.dim, 18);
  const o = { ox: null, pr: null };
  if (k >= 2) o.ox = { top: oxT, bot: 0 };
  if (k === 3) o.pr = { h: prH, mode: 'full' };
  if (k === 4) o.pr = { h: prH, mode: 'exp' };
  if (k === 5) o.pr = { h: prH, mode: neg ? 'neg' : 'pos', hw: neg ? prH : 0 };
  if (k === 6) { o.pr = { h: prH, mode: neg ? 'neg' : 'pos', hw: neg ? prH : 0 }; o.ox.etch = oxT; o.ox.under = 2; }
  if (k === 7) { o.ox.etch = oxT; o.ox.under = 2; }
  section(ctx, o);
  if (k === 4) { for (let i = 0; i < 9; i++) arrow(ctx, SX + 40 + i * 78, 130, SX + 40 + i * 78, SYB - oxT - prH - 60, COL.uv, 2.5); ctx.fillStyle = COL.mask; ctx.fillRect(SX, SYB - oxT - prH - 50, SW, 12); ctx.fillStyle = COL.bg; WIN.forEach(([a, b]) => ctx.fillRect(SX + a * SW, SYB - oxT - prH - 50, (b - a) * SW, 12)); txt(ctx, '마스크', SX + SW + 8, SYB - oxT - prH - 40, COL.text, 15); }
  if (k === 1) { for (let i = 0; i < 12; i++) { ctx.fillStyle = '#fff'; ctx.globalAlpha = .6 + .4 * Math.sin(FS.t * 4 + i); ctx.beginPath(); ctx.arc(SX + 30 + i * 55, SYB - 12 - (i % 3) * 6, 2.5, 0, 2 * Math.PI); ctx.fill(); ctx.globalAlpha = 1; } }
  if (k === 6) { for (let i = 0; i < 10; i++) { const wi = WIN[i % 3], fx = SX + (wi[0] + (wi[1] - wi[0]) * (((i * 37) % 100) / 100)) * SW, ph = (FS.t * .9 + i * .13) % 1, y = 150 + ph * (SYB - oxT - 150); ctx.fillStyle = COL.uv; ctx.beginPath(); ctx.arc(fx, y, 4, 0, 2 * Math.PI); ctx.fill(); } }
  for (let i = 0; i < 8; i++) { ctx.fillStyle = i === k ? COL.ok : (i < k ? 'rgba(94,234,212,.5)' : 'rgba(160,190,255,.25)'); ctx.beginPath(); ctx.arc(SX + 20 + i * 98, 585, i === k ? 11 : 8, 0, 2 * Math.PI); ctx.fill(); }
  api.setStatus(`${STEPS[k]} — ${PRIN[k] || ''}`);
  api.setReadout([['현재 단계', STEPS[k]], ['PR 종류', neg ? '음성(−)' : '양성(+)'], ['반복', '층마다 ①~⑦ 반복 → 수십~수백 번']]);
  api.setNote('▶ 를 누르면 7단계가 차례로 진행된다. 슬라이더로 원하는 단계를 직접 고를 수 있다. 막 두께 비율은 보기 좋게 과장했다.');
  ctx.restore();
}

const DRAW = { clean: drawClean, oxide: drawOxide, spin: drawSpin, expose: drawExpose, develop: drawDevelop, etch: drawEtch, strip: drawStrip, flow: drawFlow };
const SIM = {
  enter(api) { SS.t = 0; ES.t = 0; FS.t = 0; FS.last = -1; api.setPlaying && api.setPlaying(!!{ spin: 1, etch: 1, flow: 1 }[api.scenario.id]); },
  reset(api) { SS.t = 0; ES.t = 0; FS.t = 0; FS.last = -1; if (api.scenario.id === 'flow') api.setParam('stp', 0); api.refresh(); },
  update(api) { (DRAW[api.scenario.id] || drawFlow)(api); },
  frame(api, dt) {
    const playing = typeof api.playing === 'function' ? api.playing() : api.playing; if (playing === false) return;
    dt = Math.min(dt, 1 / 30); const id = api.scenario.id;
    if (id === 'spin') SS.t += dt; else if (id === 'etch') ES.t += dt;
    else if (id === 'flow') { FS.t += dt; const k = Math.floor(FS.t / 2.2) % 8; if (k !== FS.last) { FS.last = k; api.setParam('stp', k); } }
    (DRAW[id] || drawFlow)(api);
  },
  tests() {
    const T = [], near = (a, b, e) => Math.abs(a / b - 1) < e;
    T.push(['수율: D·A = 0 이면 1, D·A = 1 이면 1/e', PH.yieldPoisson(0, 1) === 1 && near(PH.yieldPoisson(1, 1), Math.E ** -1, 1e-12), '']);
    T.push(['수율: 칩 면적이 2배이면 수율은 제곱', near(PH.yieldPoisson(.8, 2), PH.yieldPoisson(.8, 1) ** 2, 1e-12), '']);
    let ok = true; for (const [Tc, mn] of [[900, 30], [1000, 60], [1100, 90], [1200, 120]]) { const x = PH.oxide(Tc, mn) / 1000, { A, B } = PH.dg(Tc); if (Math.abs(x * x + A * x - B * mn / 60) > 1e-9) ok = false; }
    T.push(['Deal–Grove: x² + A·x = B·t 를 만족', ok, '']);
    const x1 = PH.oxide(1000, 60); T.push(['건식 산화 1000 °C · 1시간 ≈ 50 nm (문헌 대략값 45~60)', x1 > 45 && x1 < 60, x1.toFixed(1) + ' nm']);
    const th = PH.oxide(1000, .6), { BA } = PH.dg(1000); T.push(['초기(얇을 때): x ≈ (B/A)·t', near(th / 1000, BA * (.6 / 60), 0.03), th.toFixed(2) + ' nm']);
    const tk = PH.oxide(1200, 6000) / 1000, { B: B2 } = PH.dg(1200); T.push(['오래 산화(두꺼울 때): x ≈ √(B·t)', near(tk, Math.sqrt(B2 * 100), 0.02), tk.toFixed(2) + ' µm']);
    T.push(['온도·시간이 클수록 산화막이 두껍다', PH.oxide(1100, 60) > PH.oxide(1000, 60) && PH.oxide(1000, 120) > PH.oxide(1000, 60), '']);
    T.push(['스핀 코팅: 회전 4배 → 두께 1/2, 점도 고 > 중 > 저', near(PH.spin(500, 'mid') / PH.spin(2000, 'mid'), 2, 1e-12) && PH.spin(2000, 'high') > PH.spin(2000, 'mid') && PH.spin(2000, 'mid') > PH.spin(2000, 'low'), '']);
    T.push(['광자 에너지: 193 nm → 6.42 eV, 13.5 nm → 91.8 eV', near(PH.E_eV(193), 6.424, 0.001) && near(PH.E_eV(13.5), 91.84, 0.001), PH.E_eV(193).toFixed(2) + ' / ' + PH.E_eV(13.5).toFixed(1)]);
    T.push(['레일리 선폭: ArF 액침(NA 1.35, k₁ 0.3) ≈ 42.9 nm, EUV(NA 0.33, k₁ 0.4) ≈ 16.4 nm', near(PH.rayleigh(193, 1.35, .3), 42.89, 0.002) && near(PH.rayleigh(13.5, .33, .4), 16.36, 0.002), '']);
    T.push(['MTF: f = 0 이면 1, 차단 주파수에서 0, 단조 감소', Math.abs(PH.mtf(0) - 1) < 1e-12 && Math.abs(PH.mtf(1)) < 1e-12 && PH.mtf(.3) > PH.mtf(.6) && PH.mtf(.6) > PH.mtf(.9), '']);
    const lam = 193, na = .85, k1 = .4, R = PH.rayleigh(lam, na, k1); T.push(['반피치 = R 일 때 대비가 요구 대비 MTF(0.25/k₁)와 같다', Math.abs(PH.contrast(R, lam, na) - PH.mtf(.25 / k1)) < 1e-12, PH.contrast(R, lam, na).toFixed(3)]);
    T.push(['초점 심도는 NA² 에 반비례', near(PH.dof(193, .5) / PH.dof(193, 1), 4, 1e-12), '']);
    T.push(['현상: 양성 D=0 → 1, D=D₀ → ½, 양성+음성 = 1', PH.remain(0, 30, 3, 'pos') === 1 && Math.abs(PH.remain(30, 30, 3, 'pos') - .5) < 1e-12 && Math.abs(PH.remain(17, 30, 3, 'pos') + PH.remain(17, 30, 3, 'neg') - 1) < 1e-12, '']);
    const dryE = PH.etch(100, 10, .05, 600), wetE = PH.etch(100, 10, 1, 600); T.push(['식각: 습식 옆 침식 = 깊이, 건식 ≪ 습식, PR 소모 = 깊이/선택비', wetE.under === 100 && dryE.under < wetE.under / 10 && Math.abs(dryE.prLeft - 590) < 1e-9, '']);
    T.push(['애싱: 600 nm 를 300 nm/min 으로 2분에 제거, 이후 0', PH.ash(600, 300, 2) === 0 && PH.ash(600, 300, 1) === 300 && PH.ash(600, 300, 5) === 0, '']);
    const fin = [[800, 5], [1200, 180]].every(([a, b]) => Number.isFinite(PH.oxide(a, b))) && [10, 450].every(l => Number.isFinite(PH.rayleigh(l, .1, .25)) && Number.isFinite(PH.contrast(5, l, 1.35)));
    T.push(['슬라이더 양 끝값에서 NaN·Infinity 없음', fin, '']);
    return T;
  },
};

</script>
<script>
"use strict";
/* ============================ 공용 UI 프레임워크 (템플릿) ============================ */
(function () {
  const C = WS_CONFIG;
  const $ = (id) => document.getElementById(id);
  const P = {};
  const ui = { tab: C.tabs[0].id, scenarioId: null, playing: false };
  const lastScenarioOfTab = {};

  function addDefaults(params) { (params || []).forEach(p => { if (!(p.key in P)) P[p.key] = p.value; }); }
  C.scenarios.forEach(s => { addDefaults(s.params); addDefaults(s.choices); });
  if (C.common_params) addDefaults(C.common_params.params);

  function current() { return C.scenarios.find(s => s.id === ui.scenarioId); }
  function scenariosOfTab(tab) { return C.scenarios.filter(s => s.tab === tab); }
  function fmtVal(v, unit) {
    if (!unit) return String(v);
    return /^[°%′″]/.test(unit) ? v + unit : v + " " + unit;
  }

  function showError(where, e) {
    const box = $("simError");
    box.hidden = false;
    box.textContent = "시뮬레이션 오류 (" + where + "): " + (e && e.message ? e.message : e);
    console.error(e);
  }
  const SIMOBJ = (typeof SIM !== "undefined") ? SIM : null;
  function call(hook, ...args) {
    if (!SIMOBJ || typeof SIMOBJ[hook] !== "function") return undefined;
    try { return SIMOBJ[hook](api, ...args); } catch (e) { showError(hook, e); return undefined; }
  }

  /* ---------- 렌더러 ---------- */
  const wrap = $("sceneWrap");
  const api = {
    config: C, P,
    get scenario() { return current(); },
    get tab() { return ui.tab; },
    get playing() { return ui.playing; },
    setPlaying(b) { ui.playing = !!b; updatePlayButton(); },
    boxHalf: (C.scene && C.scene.box_half) || 16,
    sceneEl: wrap,
    THREE: window.THREE || null,
    scene: null, camera: null, renderer: null, controls: null,
    canvas: null, ctx: null, width: 0, height: 0,
    custom: $("customPanel"),
    chart: {
      canvas: $("chartCanvas"),
      ctx: $("chartCanvas").getContext("2d"),
      setHint(html) { $("chartHint").innerHTML = html; },
    },
    setReadout(rows) {
      const tbl = $("readout");
      tbl.innerHTML = "";
      (rows || []).forEach(r => {
        const tr = document.createElement("tr");
        const a = document.createElement("td"); a.textContent = r[0];
        const b = document.createElement("td"); b.textContent = r[1];
        tr.append(a, b); tbl.appendChild(tr);
      });
    },
    setNote(text) { $("readoutNote").textContent = text || ""; },
    setStatus(text) { const el = $("wsStatus"); if (el) el.textContent = text || ""; },
    setParam(key, v) {
      P[key] = v;
      const el = $("p_" + key); if (el) el.value = v;
      const vEl = $("p_" + key + "_val"); if (vEl) vEl.textContent = fmtVal(v, vEl.dataset.unit);
    },
    refresh() { call("update"); },
  };

  function initRenderer() {
    const sc = C.scene || {};
    if (C.renderer === "three") {
      if (!window.THREE) { showError("init", "Three.js를 불러오지 못했습니다 (인터넷 연결 확인)"); return false; }
      const T = window.THREE;
      api.scene = new T.Scene();
      api.camera = new T.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 500);
      const cp = sc.camera || [26, 20, 30];
      api.camera.position.set(cp[0], cp[1], cp[2]);
      api.renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
      api.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      wrap.insertBefore(api.renderer.domElement, wrap.firstChild);
      api.controls = new T.OrbitControls(api.camera, api.renderer.domElement);
      api.controls.enableDamping = true;
      api.controls.dampingFactor = 0.08;
      api.controls.target.set(0, 0, 0);
      api.scene.add(new T.AmbientLight(0xffffff, 0.55));
      const dl = new T.DirectionalLight(0xffffff, 0.9);
      dl.position.set(20, 30, 15);
      api.scene.add(dl);
      if (sc.grid !== false) api.scene.add(new T.GridHelper(api.boxHalf * 2, 16, 0x3a5a8a, 0x1f3352));
      if (sc.axes !== false) api.scene.add(new T.AxesHelper(api.boxHalf * 0.6));
    } else {
      api.canvas = document.createElement("canvas");
      wrap.insertBefore(api.canvas, wrap.firstChild);
      api.ctx = api.canvas.getContext("2d");
    }
    window.addEventListener("resize", onResize);
    onResize();
    return true;
  }

  function onResize() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    api.width = w; api.height = h;
    if (api.renderer) {
      api.camera.aspect = w / h;
      api.camera.updateProjectionMatrix();
      api.renderer.setSize(w, h);
    } else if (api.canvas) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      api.canvas.width = Math.round(w * dpr);
      api.canvas.height = Math.round(h * dpr);
      api.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (ui.scenarioId) call("update");
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    if (api.controls) api.controls.update();
    call("frame", 1 / 60);
    if (api.renderer) api.renderer.render(api.scene, api.camera);
  }

  /* ---------- UI ---------- */
  function renderTabs() {
    const box = $("tabs");
    box.innerHTML = "";
    box.hidden = C.tabs.length < 2;
    C.tabs.forEach(t => {
      const b = document.createElement("button");
      b.textContent = t.label;
      b.className = t.id === ui.tab ? "active" : "";
      b.addEventListener("click", () => switchTab(t.id));
      box.appendChild(b);
    });
  }

  function renderPicker() {
    const box = $("scenarioPicker");
    const list = scenariosOfTab(ui.tab);
    box.innerHTML = "";
    box.hidden = list.length < 2;
    list.forEach(s => {
      const b = document.createElement("button");
      b.textContent = s.name;
      b.className = s.id === ui.scenarioId ? "active" : "";
      b.addEventListener("click", () => selectScenario(s.id));
      box.appendChild(b);
    });
  }

  function sliderEl(p) {
    const div = document.createElement("div");
    div.className = "param";
    const label = document.createElement("label");
    label.textContent = p.label + " ";
    const val = document.createElement("span");
    val.className = "val"; val.id = "p_" + p.key + "_val"; val.dataset.unit = p.unit || "";
    val.textContent = fmtVal(P[p.key], p.unit);
    label.appendChild(val);
    const inp = document.createElement("input");
    inp.type = "range"; inp.id = "p_" + p.key;
    inp.min = p.min; inp.max = p.max; inp.step = p.step; inp.value = P[p.key];
    inp.addEventListener("input", () => {
      const v = parseFloat(inp.value);
      P[p.key] = v;
      val.textContent = fmtVal(v, p.unit);
      call("update");
    });
    div.append(label, inp);
    return div;
  }

  function choiceEl(c) {
    const row = document.createElement("div");
    row.className = "row"; row.style.marginBottom = "8px";
    if (c.label) { const l = document.createElement("b"); l.style.fontSize = "0.9em"; l.textContent = c.label; row.appendChild(l); }
    c.options.forEach(o => {
      const b = document.createElement("button");
      b.textContent = o.label;
      b.className = P[c.key] === o.value ? "primary" : "";
      b.addEventListener("click", () => {
        P[c.key] = o.value;
        row.querySelectorAll("button").forEach(x => x.className = "");
        b.className = "primary";
        call("update");
      });
      row.appendChild(b);
    });
    return row;
  }

  function renderControls() {
    const s = current();
    const body = $("scenarioBody");
    body.innerHTML = "";
    if (s.desc || s.section) {
      const p = document.createElement("p");
      p.className = "hint"; p.style.marginBottom = "10px";
      if (s.section) { const b = document.createElement("b"); b.textContent = s.section; p.appendChild(b); if (s.desc) p.appendChild(document.createTextNode(" — ")); }
      if (s.desc) p.appendChild(document.createTextNode(s.desc));
      body.appendChild(p);
    }
    (s.choices || []).forEach(c => body.appendChild(choiceEl(c)));
    (s.params || []).forEach(p => body.appendChild(sliderEl(p)));
    if (s.animated) {
      const st = document.createElement("div");
      st.className = "hint"; st.id = "wsStatus";
      st.textContent = s.status_hint || "";
      body.appendChild(st);
      const row = document.createElement("div");
      row.className = "controls-row";
      const play = document.createElement("button");
      play.id = "playBtn"; play.className = "primary";
      play.addEventListener("click", () => { ui.playing = !ui.playing; updatePlayButton(); });
      const reset = document.createElement("button");
      reset.textContent = "↺ 리셋";
      reset.addEventListener("click", () => { ui.playing = false; updatePlayButton(); call("reset"); call("update"); });
      row.append(play, reset);
      body.appendChild(row);
      updatePlayButton();
    }
    const cp = C.common_params;
    if (cp && s.use_common !== false) {
      const hr = document.createElement("hr");
      hr.style.cssText = "margin:10px 0;border:none;border-top:1px solid var(--border)";
      body.appendChild(hr);
      if (cp.title) { const b = document.createElement("b"); b.style.fontSize = "0.9em"; b.textContent = cp.title; body.appendChild(b); }
      cp.params.forEach(p => body.appendChild(sliderEl(p)));
    }
  }

  function updatePlayButton() {
    const b = $("playBtn");
    if (b) b.textContent = ui.playing ? "⏸ 일시정지" : "▶ 재생";
  }

  function renderFormula() {
    const s = current();
    const body = $("formulaBody");
    body.innerHTML = (s.formula || []).map(f =>
      (f.eq_html ? `<div class="eq">${f.eq_html}</div>` : "") + (f.text_html || "")
    ).join("");
  }

  function renderMisconception() {
    const s = current();
    const panel = $("misconceptionPanel");
    panel.innerHTML = "";
    panel.hidden = !s.misconception;
    if (!s.misconception) return;
    const box = document.createElement("div");
    box.className = "misconception";
    const b = document.createElement("b");
    b.textContent = s.misconception_title || "💡 흔한 오개념";
    box.append(b, document.createElement("br"), document.createTextNode(s.misconception));
    panel.appendChild(box);
  }

  function enterScenario() {
    ui.playing = false;
    const s = current();
    $("graphPanel").hidden = !s.chart;
    $("chartHint").innerHTML = "";
    api.custom.innerHTML = "";
    api.setReadout([]); api.setNote("");
    renderPicker(); renderControls(); renderFormula(); renderMisconception();
    call("enter");
    call("update");
  }

  function selectScenario(id) {
    ui.scenarioId = id;
    lastScenarioOfTab[ui.tab] = id;
    enterScenario();
  }

  function switchTab(tab) {
    ui.tab = tab;
    renderTabs();
    selectScenario(lastScenarioOfTab[tab] || scenariosOfTab(tab)[0].id);
  }

  function renderLegend() {
    const box = $("legend");
    (C.legend || []).forEach(l => {
      const span = document.createElement("span");
      const sw = document.createElement("i");
      sw.className = "swatch" + (l.shape === "bar" ? " bar" : "");
      sw.style.background = l.color;
      span.append(sw, document.createTextNode(l.label));
      box.appendChild(span);
    });
  }

  function runSelfTests() {
    if (!SIMOBJ || typeof SIMOBJ.tests !== "function") { console.log("물리 검증 항목 없음"); return; }
    let results = [];
    try { results = SIMOBJ.tests() || []; } catch (e) { showError("tests", e); return; }
    console.log("=== " + C.title + " 물리 검증 ===");
    let pass = 0;
    for (const [name, ok, detail] of results) {
      console.log(`[${ok ? "PASS" : "FAIL"}] ${name}${detail ? " — " + detail : ""}`);
      if (ok) pass++;
    }
    console.log(pass === results.length ? "모든 검증 통과" : "일부 검증 실패 — 콘솔 확인 필요");
    window.__wsSelfTest = { pass, total: results.length };
  }

  /* ---------- 시작 ---------- */
  $("readoutTitle").textContent = C.readout_title || "측정값";
  $("hoverHint").textContent = (C.scene && C.scene.hint != null) ? C.scene.hint
    : (C.renderer === "three" ? "마우스 드래그: 회전 · 휠: 확대/축소" : "");
  $("projectorBtn").addEventListener("click", () => document.body.classList.toggle("projector"));
  renderLegend();
  if (!SIMOBJ) showError("load", "sim_js에 SIM 객체가 정의되지 않았습니다");
  if (initRenderer()) {
    call("init");
    renderTabs();
    switchTab(ui.tab);
    animate();
  }
  runSelfTests();
})();
</script>
