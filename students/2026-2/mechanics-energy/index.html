<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2학년 역학과 에너지 학생 제출작 · 2026학년도 2학기</title>
<style>
  :root{--paper:#f6f7f5;--panel:#fff;--ink:#1c2230;--muted:#6b7280;--line:#e2e4e0;--accent:#e0602a;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI","Malgun Gothic",sans-serif;}
  .wrap{max-width:960px;margin:0 auto;padding:48px 20px 80px;}
  a.home{color:var(--muted);text-decoration:none;font-size:.9em;}
  a.home:hover{color:var(--accent);}
  .eyebrow{font-family:monospace;font-size:.8em;letter-spacing:.1em;color:var(--accent);margin-top:14px;}
  h1{font-size:1.6em;margin:4px 0 8px;}
  .sub{color:var(--muted);font-size:.92em;max-width:640px;line-height:1.6;}
  .controls{margin:22px 0 4px;}
  .controls input{width:100%;max-width:360px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--panel);}
  .count{font-size:.85em;color:var(--muted);margin:14px 0 10px;}
  .count b{color:var(--ink);}
  .log{display:flex;flex-direction:column;gap:8px;}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:16px;}
  .row:hover{border-color:var(--accent);}
  .runid{font-family:monospace;font-weight:600;font-size:.9em;}
  .title{font-weight:600;font-size:.98em;line-height:1.4;}
  .date{font-family:monospace;font-size:.78em;color:var(--muted);margin-top:2px;}
  .go{font-size:.85em;font-weight:600;text-decoration:none;color:#fff;background:var(--accent);padding:8px 14px;border-radius:8px;white-space:nowrap;}
  .empty{text-align:center;padding:60px 20px;color:var(--muted);}
  footer{margin-top:36px;color:var(--muted);font-size:.82em;text-align:center;}
  @media (max-width:620px){.row{grid-template-columns:1fr auto;}.runid{grid-column:1/-1;font-size:.8em;color:var(--muted);}}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="../../index.html">← 학생 제출자료</a>
  <div class="eyebrow">2026학년도 2학기</div>
  <h1>🎓 2학년 역학과 에너지 · 학생 제출작</h1>
  <p class="sub">학생들이 과제방에 제출한 시뮬레이션입니다. 개인 식별 정보(이름·반)는 제외하고 순번으로 표시했습니다.
    같은 작품을 다시 제출한 경우 마지막 제출본만 실었습니다.</p>
  <div class="controls"><input id="q" type="search" placeholder="제목 검색" aria-label="제목 검색"></div>
  <div class="count" id="count"></div>
  <div class="log" id="log"></div>
  <div class="empty" id="empty" style="display:none;">표시할 작품이 없습니다.</div>
  <footer>과제방(board.crazyray.uk) 제출 데이터 기준</footer>
</div>
<script>
"use strict";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let items = [];
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const shown = items.filter((s) => !q || s.title.toLowerCase().includes(q));
  document.getElementById("count").innerHTML = `<b>${shown.length}</b>건 표시 중 (전체 ${items.length}건)`;
  document.getElementById("empty").style.display = shown.length ? "none" : "block";
  document.getElementById("log").innerHTML = shown.map((s) => `
    <div class="row">
      <div class="runid">학생-${String(s.no).padStart(2, "0")}</div>
      <div><div class="title">${esc(s.title)}</div><div class="date">${esc(s.date)}</div></div>
      <a class="go" href="${esc(s.run)}" target="_blank" rel="noopener">실행 →</a>
    </div>`).join("");
}
fetch("items.json").then((r) => r.json()).then((data) => {
  items = data; render();
  document.getElementById("q").addEventListener("input", render);
}).catch(() => { document.getElementById("empty").style.display = "block"; });
</script>
</body>
</html>
