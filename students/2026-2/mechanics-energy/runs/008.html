<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>h1 { color: #1f6fd6; }</style></head><body><!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>탁구공 포물선 운동 시뮬레이터 (정밀 입력)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }
        .top-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .controls {
            flex: 1;
            min-width: 280px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .control-group label {
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-row input[type="range"] {
            flex: 1;
        }
        .input-row input[type="number"] {
            width: 95px;
            padding: 6px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: right;
        }
        .results {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff7f0e;
            font-size: 14px;
            line-height: 1.8;
        }
        .results h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
            font-size: 16px;
        }
        .canvas-container {
            flex: 1.5;
            min-width: 350px;
            background: #fff;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .canvas-container h3 {
            margin-top: 0;
            font-size: 15px;
            color: #444;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        .energy-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .apex-energy-box {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            margin-top: 15px;
        }
        .energy-card {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            text-align: center;
        }
        .energy-card h4 {
            margin: 0 0 5px 0;
            font-size: 13px;
        }
        .energy-card span {
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>탁구공 포물선 운동 시뮬레이터 (탁구공 2.1g)</h1>

    <div class="container">
        <div class="top-section">
            <!-- 조작 패널 -->
            <div class="controls">
                <div class="control-group">
                    <label for="v0-range">초기 속력 ($v_0$, m/s):</label>
                    <div class="input-row">
                        <!-- 초기 속력: step="0.001" (소수점 셋째 자리까지) -->
                        <input type="range" id="v0-range" min="1" max="20" step="0.001" value="3">
                        <input type="number" id="v0-num" min="1" max="20" step="0.001" value="3">
                    </div>
                </div>

                <div class="control-group">
                    <label for="angle-range">발사 각도 ($\theta$, °):</label>
                    <div class="input-row">
                        <!-- 발사 각도: step="0.1" (소수점 첫째 자리까지) -->
                        <input type="range" id="angle-range" min="0" max="90" step="0.1" value="45">
                        <input type="number" id="angle-num" min="0" max="90" step="0.1" value="45">
                    </div>
                </div>

                <div class="control-group">
                    <label>고정 조건:</label>
                    <div style="font-size: 13px; color: #666; background: #f1f1f1; padding: 8px; border-radius: 4px;">
                        • 질량: 2.1 g (0.0021 kg)<br>
                        • 중력가속도 ($g$): 9.8 m/s²
                    </div>
                </div>

                <!-- 결과 표시 패널 -->
                <div class="results" id="result-box">
                    <h3>시뮬레이션 결과</h3>
                    <div id="result-text">계산 중...</div>
                </div>
            </div>

            <!-- 포물선 궤적 캔버스 -->
            <div class="canvas-container">
                <h3>운동 궤적 시각화</h3>
                <canvas id="simCanvas" width="500" height="300"></canvas>
            </div>
        </div>

        <!-- 역학적 에너지 그래프 영역 -->
        <div class="energy-section">
            <h3 style="margin-top: 0; font-size: 16px; color: #333;">역학적 에너지 그래프</h3>
            <canvas id="energyCanvas" width="860" height="220"></canvas>
            <div style="font-size: 13px; color: #555; margin-top: 8px; display: flex; gap: 20px;">
                <span><b style="color:#2ca02c;">■</b> 위치 에너지</span>
                <span><b style="color:#1f77b4;">■</b> 운동 에너지</span>
                <span><b style="color:#d62728;">■</b> 역학적 에너지</span>
            </div>

            <!-- 최고점에서의 운동에너지와 위치에너지 (소수점 셋째 자리) -->
            <div class="apex-energy-box">
                <div class="energy-card">
                    <h4 style="color: #1f77b4;">최고점에서의 운동 에너지</h4>
                    <span id="apex-ke-val" style="color: #1f77b4;">0.000 J</span>
                </div>
                <div class="energy-card">
                    <h4 style="color: #2ca02c;">최고점에서의 위치 에너지</h4>
                    <span id="apex-pe-val" style="color: #2ca02c;">0.000 J</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const v0Range = document.getElementById('v0-range');
        const v0Num = document.getElementById('v0-num');
        const angleRange = document.getElementById('angle-range');
        const angleNum = document.getElementById('angle-num');
        const resultText = document.getElementById('result-text');
        
        const apexKeVal = document.getElementById('apex-ke-val');
        const apexPeVal = document.getElementById('apex-pe-val');

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const energyCanvas = document.getElementById('energyCanvas');
        const eCtx = energyCanvas.getContext('2d');

        const g = 9.8;
        const mass = 0.0021; // kg (2.1g)

        function runSimulation() {
            const v0 = parseFloat(v0Num.value) || 0;
            const angleDeg = parseFloat(angleNum.value) || 0;

            const theta = (angleDeg * Math.PI) / 180;
            const v0x = v0 * Math.cos(theta);
            const v0y = v0 * Math.sin(theta);

            // 핵심 결과 계산
            const timeToMax = v0y / g;           
            const maxHeight = (v0y * v0y) / (2 * g); 
            const landingSpeed = v0;               
            const totalTime = 2 * timeToMax;       
            const maxDistance = v0x * totalTime;   

            // 최고점에서의 운동 에너지와 위치 에너지 계산 (소수점 셋째 자리까지)
            const apexKE = 0.5 * mass * (v0x * v0x);
            const apexPE = mass * g * maxHeight;

            apexKeVal.innerText = `${apexKE.toFixed(3)} J`;
            apexPeVal.innerText = `${apexPE.toFixed(3)} J`;

            // 결과 텍스트 업데이트 (소수점 2자리)
            resultText.innerHTML = `
                • 최고점 도달 시간: <b>${timeToMax.toFixed(2)} 초</b><br>
                • 최고점 높이: <b>${maxHeight.toFixed(2)} m</b><br>
                • 착지 시 속력: <b>${landingSpeed.toFixed(2)} m/s</b><br>
                • 최대 거리(수평): <b>${maxDistance.toFixed(2)} m</b><br>
                <hr style="border:0; border-top:1px solid #ddd; margin:6px 0;">
                <span style="font-size:12px; color:#666;">
                • 총 비행 시간: ${totalTime.toFixed(2)} 초
                </span>
            `;

            drawGraph(v0x, v0y, totalTime, timeToMax, maxHeight, maxDistance);
            drawUnifiedEnergyGraph(v0x, v0y, totalTime, apexPE + apexKE);
        }

        function drawGraph(v0x, v0y, totalTime, timeToMax, maxHeight, maxDistance) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const padding = 40;
            const drawWidth = canvas.width - padding * 2;
            const drawHeight = canvas.height - padding * 2;

            const maxX = Math.max(maxDistance * 1.15, 0.5);
            const maxY = Math.max(maxHeight * 1.3, 0.2);

            function toCanvasX(x) { return padding + (x / maxX) * drawWidth; }
            function toCanvasY(y) { return canvas.height - padding - (y / maxY) * drawHeight; }

            // 축
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padding, canvas.height - padding);
            ctx.lineTo(canvas.width - padding, canvas.height - padding);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, canvas.height - padding);
            ctx.stroke();

            // 눈금 레이블
            ctx.fillStyle = '#666';
            ctx.font = '10px sans-serif';
            ctx.fillText("0", padding - 10, canvas.height - padding + 12);
            ctx.fillText(`${maxX.toFixed(1)}m`, canvas.width - padding - 15, canvas.height - padding + 12);
            ctx.fillText(`${maxY.toFixed(1)}m`, padding - 30, padding + 5);

            // 궤적 곡선
            ctx.strokeStyle = '#ff7f0e';
            ctx.lineWidth = 3;
            ctx.beginPath();

            const steps = 150;
            for (let i = 0; i <= steps; i++) {
                const t = (i / steps) * totalTime;
                const x = v0x * t;
                const y = v0y * t - 0.5 * g * (t * t);

                const cx = toCanvasX(x);
                const cy = toCanvasY(y);

                if (i === 0) ctx.moveTo(cx, cy);
                else ctx.lineTo(cx, cy);
            }
            ctx.stroke();

            // 최고점 표시
            const apexX = v0x * timeToMax;
            const apexY = maxHeight;
            const acx = toCanvasX(apexX);
            const acy = toCanvasY(apexY);

            ctx.fillStyle = '#d9534f';
            ctx.beginPath();
            ctx.arc(acx, acy, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#d9534f';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`최고점 (${timeToMax.toFixed(2)}s)`, acx, acy - 10);
        }

        function drawUnifiedEnergyGraph(v0x, v0y, totalTime, totalE) {
            eCtx.clearRect(0, 0, energyCanvas.width, energyCanvas.height);

            const padding = 55;
            const drawWidth = energyCanvas.width - padding * 2;
            const drawHeight = energyCanvas.height - padding * 2;

            const steps = 150;
            let timeData = [];
            let peData = [];
            let keData = [];
            let totalEData = [];

            const maxEnergy = Math.max(totalE * 1.2, 0.001);

            for (let i = 0; i <= steps; i++) {
                const t = (i / steps) * totalTime;
                const y = v0y * t - 0.5 * g * (t * t);
                const vy = v0y - g * t;
                const speedSq = (v0x * v0x) + (vy * vy);

                const pe = mass * g * Math.max(y, 0);
                const ke = 0.5 * mass * speedSq;
                const tE = pe + ke;

                timeData.push(t);
                peData.push(pe);
                keData.push(ke);
                totalEData.push(tE);
            }

            function toEX(t) { return padding + (t / totalTime) * drawWidth; }
            function toEY(e) { return energyCanvas.height - padding - (e / maxEnergy) * drawHeight; }

            // 축
            eCtx.strokeStyle = '#ddd';
            eCtx.lineWidth = 1;
            eCtx.beginPath();
            eCtx.moveTo(padding, energyCanvas.height - padding);
            eCtx.lineTo(energyCanvas.width - padding, energyCanvas.height - padding);
            eCtx.stroke();

            eCtx.beginPath();
            eCtx.moveTo(padding, padding);
            eCtx.lineTo(padding, energyCanvas.height - padding);
            eCtx.stroke();

            // Y축 레이블 ("에너지"), X축 레이블 ("x")
            eCtx.fillStyle = '#333';
            eCtx.font = 'bold 12px sans-serif';
            eCtx.fillText("에너지", padding - 45, padding - 10);
            eCtx.fillText("x", energyCanvas.width - padding + 10, energyCanvas.height - padding + 4);

            // X축 눈금 (끝 시간)
            eCtx.fillStyle = '#666';
            eCtx.font = '10px sans-serif';
            eCtx.fillText("0", padding - 5, energyCanvas.height - padding + 12);
            eCtx.fillText(`${totalTime.toFixed(2)}`, energyCanvas.width - padding - 10, energyCanvas.height - padding + 12);

            // 곡선 그리기 함수
            function drawCurve(data, color) {
                eCtx.strokeStyle = color;
                eCtx.lineWidth = 2.5;
                eCtx.beginPath();
                for (let i = 0; i <= steps; i++) {
                    const cx = toEX(timeData[i]);
                    const cy = toEY(data[i]);
                    if (i === 0) eCtx.moveTo(cx, cy);
                    else eCtx.lineTo(cx, cy);
                }
                eCtx.stroke();
            }

            drawCurve(peData, '#2ca02c');     // 위치 에너지 (초록색)
            drawCurve(keData, '#1f77b4');     // 운동 에너지 (파란색)
            drawCurve(totalEData, '#d62728'); // 역학적 에너지 (빨간색)
        }

        // 이벤트 연결 (정밀 입력 처리)
        v0Range.addEventListener('input', () => { v0Num.value = v0Range.value; runSimulation(); });
        v0Num.addEventListener('input', () => { 
            let val = parseFloat(v0Num.value);
            if (!isNaN(val)) {
                v0Range.value = val;
                runSimulation(); 
            }
        });
        angleRange.addEventListener('input', () => { angleNum.value = angleRange.value; runSimulation(); });
        angleNum.addEventListener('input', () => { 
            let val = parseFloat(angleNum.value);
            if (!isNaN(val)) {
                angleRange.value = val;
                runSimulation(); 
            }
        });

        runSimulation();
    </script>
</body>
