<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>h1 { color: #1f6fd6; }</style></head><body><h1>안녕하세요</h1>
<p><!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎢 물리 선생님의 등가속도 운동 실습실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 폰트 지정 및 기본 스타일 설정 */
        body {
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
        }
        /* 캔버스 기본 테두리 및 둥근 모서리 설정 */
        canvas {
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="p-4 md:p-8 text-gray-800">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- 메인 제목 카드 -->
        <header class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-6 rounded-2xl shadow-lg">
            <h1 class="text-2xl md:text-3xl font-bold flex items-center gap-2">
                <span>🎢</span> 물리 선생님의 등가속도 운동 실습실
            </h1>
            <p class="mt-2 text-blue-100 text-sm md:text-base">
                유니버셜 스튜디오 재팬 놀이기구 영상에서 관찰한 속도 변화를 분석해봅시다!
            </p>
        </header>

        <!-- 입력 양식 및 설명 구역 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- 왼쪽: 데이터 입력 창 (1칸 차지) -->
            <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 space-y-4">
                <h2 class="text-lg font-bold text-gray-700 border-b pb-2 flex items-center gap-2">
                    📝 관찰 데이터 입력
                </h2>

                <!-- 상황 설명 참고 텍스트 -->
                <div class="bg-blue-50 p-3 rounded-lg text-xs text-blue-800">
                    <strong>📍 관찰 상황:</strong><br>
                    유니버셜 재팬 놀이기구 '더 라이드' 가속 구간
                </div>

                <!-- 처음 속도 입력 칸 -->
                <div>
                    <label for="v0" class="block text-sm font-semibold text-gray-600 mb-1">
                        처음 속도 $v_0$ (m/s)
                    </label>
                    <input type="number" id="v0" value="14" step="0.1"
                        class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>

                <!-- 나중 속도 입력 칸 -->
                <div>
                    <label for="v1" class="block text-sm font-semibold text-gray-600 mb-1">
                        나중 속도 $v$ (m/s)
                    </label>
                    <input type="number" id="v1" value="17" step="0.1"
                        class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>

                <!-- 걸린 시간 입력 칸 -->
                <div>
                    <label for="time" class="block text-sm font-semibold text-gray-600 mb-1">
                        걸린 시간 $t$ (초)
                    </label>
                    <input type="number" id="time" value="1" step="0.1" min="0.1"
                        class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>

                <!-- 가속도 계산 & 그래프 그리기 버튼 -->
                <button onclick="calculateAndDraw()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition transform active:scale-95 flex items-center justify-center gap-2">
                    <span>🚀</span> 가속도 계산 & 시뮬레이션 실행
                </button>
            </div>

            <!-- 오른쪽: 계산 결과 및 시뮬레이션 카드 (2칸 차지) -->
            <div class="md:col-span-2 space-y-6">
                
                <!-- 🎢 롤러코스터 실시간 모션 시뮬레이터 카드 -->
                <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-lg font-bold text-gray-700 flex items-center gap-2">
                            <span>🎢</span> 유니버셜 '더 라이드' 롤러코스터 주행 화면
                        </h2>
                        <button onclick="startAnimation()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition flex items-center gap-1">
                            <span>▶️</span> 열차 출발하기
                        </button>
                    </div>

                    <!-- 에러 메시지 표시 영역 -->
                    <div id="error-message" class="hidden mb-3 p-3 bg-red-100 border border-red-300 text-red-700 text-xs rounded-lg"></div>

                    <!-- 롤러코스터 애니메이션 캔버스 -->
                    <div class="w-full overflow-hidden bg-slate-900 rounded-lg border shadow-inner">
                        <canvas id="coasterCanvas" width="500" height="200" class="w-full h-auto block"></canvas>
                    </div>
                </div>

                <!-- 계산 결과 요약 카드 -->
                <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100">
                    <h2 class="text-lg font-bold text-gray-700 border-b pb-2 mb-4 flex items-center gap-2">
                        📊 계산 결과 분석
                    </h2>

                    <!-- 결과 수치 4가지 그리드 -->
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                        <!-- 가속도 -->
                        <div class="bg-indigo-50 p-4 rounded-xl text-center">
                            <span class="text-xs text-indigo-600 font-bold block mb-1">가속도 ($a$)</span>
                            <span id="result-acc" class="text-2xl font-extrabold text-indigo-900">3.00</span>
                            <span class="text-xs text-indigo-600">m/s²</span>
                        </div>

                        <!-- 평균 속도 -->
                        <div class="bg-emerald-50 p-4 rounded-xl text-center">
                            <span class="text-xs text-emerald-600 font-bold block mb-1">평균 속도 ($v_{avg}$)</span>
                            <span id="result-vavg" class="text-2xl font-extrabold text-emerald-900">15.50</span>
                            <span class="text-xs text-emerald-600">m/s</span>
                        </div>

                        <!-- 이동 거리 -->
                        <div class="bg-amber-50 p-4 rounded-xl text-center">
                            <span class="text-xs text-amber-600 font-bold block mb-1">이동 거리 ($s$)</span>
                            <span id="result-dist" class="text-2xl font-extrabold text-amber-900">15.50</span>
                            <span class="text-xs text-amber-600">m</span>
                        </div>

                        <!-- 속도 변화량 -->
                        <div class="bg-rose-50 p-4 rounded-xl text-center">
                            <span class="text-xs text-rose-600 font-bold block mb-1">속도 변화량 ($\Delta v$)</span>
                            <span id="result-dv" class="text-2xl font-extrabold text-rose-900">3.00</span>
                            <span class="text-xs text-rose-600">m/s</span>
                        </div>
                    </div>

                    <!-- 물리 공식 한눈에 보기 -->
<!-- ... existing code ... baseline JavaScript variable updates -->
    <!-- 자바스크립트(JavaScript) 로직 작성 구역 -->
    <script>
        // 애니메이션 관리를 위한 전역 변수들
        let animId = null;
        let animStartTime = null;
        let currentPhysicsData = { v0: 14, v1: 17, t: 1, a: 3, distance: 15.5 };

        /**
         * 웹페이지가 로드되었을 때 초기 계산 및 그래프를 그려줍니다.
         */
        window.onload = function() {
            calculateAndDraw();
        };

        /**
         * 입력값을 기반으로 물리학 수치를 계산하고 시뮬레이션을 갱신합니다.
         */
        function calculateAndDraw() {
            const v0Input = document.getElementById('v0');
            const v1Input = document.getElementById('v1');
            const timeInput = document.getElementById('time');
            const errorDiv = document.getElementById('error-message');

            if (!v0Input || !v1Input || !timeInput) {
                return;
            }

            const v0 = parseFloat(v0Input.value);
            const v1 = parseFloat(v1Input.value);
            const t = parseFloat(timeInput.value);

            // 입력값 검증 (시간은 0보다 커야 함)
            if (isNaN(v0) || isNaN(v1) || isNaN(t) || t <= 0) {
                errorDiv.innerText = '⚠️ 올바른 숫자 값을 입력해 주세요! (시간은 0보다 커야 합니다)';
                errorDiv.classList.remove('hidden');
                return;
            } else {
                errorDiv.classList.add('hidden');
            }

            // 등가속도 물리 공식 적용
            const dv = v1 - v0;
            const a = dv / t;
            const vAvg = (v0 + v1) / 2;
            const distance = vAvg * t;

            // 계산된 데이터 저장
            currentPhysicsData = { v0, v1, t, a, distance };

            // UI 텍스트 수치 업데이트
            document.getElementById('result-acc').innerText = a.toFixed(2);
            document.getElementById('result-vavg').innerText = vAvg.toFixed(2);
            document.getElementById('result-dist').innerText = distance.toFixed(2);
            document.getElementById('result-dv').innerText = dv.toFixed(2);

            // v-t 그래프 시각화
            drawGraph(v0, v1, t, a, distance);

            // 롤러코스터 애니메이션 실행
            startAnimation();
        }

        /**
         * 롤러코스터 애니메이션 시작 함수
         */
        function startAnimation() {
            if (animId) cancelAnimationFrame(animId);
            animStartTime = null;
            requestAnimationFrame(animateCoaster);
        }

        /**
         * STREAMING_CHUNK:Calculating track Bezier curve points...
         * 베지어 곡선 트랙 좌표와 접선 기울기 각도를 계산합니다.
         */
        function getTrackPoint(p) {
            const P0 = { x: 30, y: 150 };   // 출발점
            const P1 = { x: 180, y: 160 };  // 완만한 곡선 제어점
            const P2 = { x: 320, y: 50 };   // 상향 상승 구간 제어점
            const P3 = { x: 470, y: 90 };   // 도착점

            const oneMinusP = 1 - p;
            const x = Math.pow(oneMinusP, 3) * P0.x +
                      3 * Math.pow(oneMinusP, 2) * p * P1.x +
                      3 * oneMinusP * Math.pow(p, 2) * P2.x +
                      Math.pow(p, 3) * P3.x;

            const y = Math.pow(oneMinusP, 3) * P0.y +
                      3 * Math.pow(oneMinusP, 2) * p * P1.y +
                      3 * oneMinusP * Math.pow(p, 2) * P2.y +
                      Math.pow(p, 3) * P3.y;

            // 미세 위치 비교를 통한 차량 회전각 계산
            const delta = 0.001;
            const p2 = Math.min(1, p + delta);
            const x2 = Math.pow(1 - p2, 3) * P0.x + 3 * Math.pow(1 - p2, 2) * p2 * P1.x + 3 * (1 - p2) * Math.pow(p2, 2) * P2.x + Math.pow(p2, 3) * P3.x;
            const y2 = Math.pow(1 - p2, 3) * P0.y + 3 * Math.pow(1 - p2, 2) * p2 * P1.y + 3 * (1 - p2) * Math.pow(p2, 2) * P2.y + Math.pow(p2, 3) * P3.y;

            const angle = Math.atan2(y2 - y, x2 - x);

            return { x, y, angle };
        }

        /**
         * STREAMING_CHUNK:Handling physics animation loop...
         * 등가속도 변위 공식 s(t) = v0*t + 0.5*a*t^2 를 프레임별로 반영합니다.
         */
        function animateCoaster(timestamp) {
            if (!animStartTime) animStartTime = timestamp;
            const elapsedTimeSec = (timestamp - animStartTime) / 1000;

            const { v0, a, t, distance } = currentPhysicsData;

            let currentT = Math.min(elapsedTimeSec, t);
            let currentDist = v0 * currentT + 0.5 * a * currentT * currentT;
            let progress = distance > 0 ? Math.min(1, Math.max(0, currentDist / distance)) : 0;

            drawCoasterCanvas(progress, currentT);

            if (elapsedTimeSec < t) {
                animId = requestAnimationFrame(animateCoaster);
            }
        }

        /**
         * STREAMING_CHUNK:Rendering 5x5 coaster train and track visual assets...
         * 5행 5열 (총 25인승) 대형 롤러코스터 열차와 지지대 기둥을 캔버스에 그립니다.
         */
        function drawCoasterCanvas(progress, currentT) {
            const canvas = document.getElementById('coasterCanvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            ctx.clearRect(0, 0, width, height);

            // 1. 야경 그라데이션 배경
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#0f172a');
            bgGradient.addColorStop(1, '#1e293b');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // 2. 유니버셜 스튜디오 고유의 흰색 기둥 구조물
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 4;
            const pillarXs = [80, 200, 320, 420];
            pillarXs.forEach(px => {
                ctx.beginPath();
                ctx.moveTo(px, height);
                const point = getTrackPoint(px / width);
                ctx.lineTo(px, point.y + 10);
                ctx.stroke();

                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(px - 15, height);
                ctx.lineTo(px, point.y + 20);
                ctx.moveTo(px + 15, height);
                ctx.lineTo(px, point.y + 20);
                ctx.stroke();
            });

            // 3. 이중 레일 트랙 그리기
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ffffff';
            ctx.beginPath();
            for (let p = 0; p <= 1; p += 0.01) {
                const pt = getTrackPoint(p);
                if (p === 0) ctx.moveTo(pt.x, pt.y);
                else ctx.lineTo(pt.x, pt.y);
            }
            ctx.stroke();

            ctx.lineWidth = 2;
            ctx.strokeStyle = '#94a3b8';
            ctx.beginPath();
            for (let p = 0; p <= 1; p += 0.01) {
                const pt = getTrackPoint(p);
                if (p === 0) ctx.moveTo(pt.x, pt.y + 8);
                else ctx.lineTo(pt.x, pt.y + 8);
            }
            ctx.stroke();

            // 4. 5행 5열 (총 25인승) 5개의 관절 연결 열차 구동
            const numCars = 5;
            const carSpacing = 0.04;

            for (let i = numCars - 1; i >= 0; i--) {
                let carP = progress - (i * carSpacing);
                carP = Math.max(0, Math.min(1, carP));

                const cartPt = getTrackPoint(carP);

                ctx.save();
                ctx.translate(cartPt.x, cartPt.y);
                ctx.rotate(cartPt.angle);

                // 연결선
                if (i < numCars - 1) {
                    ctx.strokeStyle = '#94a3b8';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(12, -2);
                    ctx.lineTo(20, -2);
                    ctx.stroke();
                }

                // 각 열차 차체
                ctx.fillStyle = (i === 0) ? '#dc2626' : '#ef4444';
                ctx.beginPath();
                ctx.roundRect(-14, -12, 28, 12, [3, 5, 2, 2]);
                ctx.fill();
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 바퀴
                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.arc(-8, 2, 3, 0, Math.PI * 2);
                ctx.arc(8, 2, 3, 0, Math.PI * 2);
                ctx.fill();

                // 5열 인원 배치 표현 (승객 이모지)
                ctx.font = '9px sans-serif';
                ctx.fillText(i % 2 === 0 ? '🙋‍♂️' : '🙋‍♀️', -8, -13);
                ctx.fillText(i % 3 === 0 ? '🙋‍♀️' : '🙋‍♂️', 0, -13);

                // 행 표기
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 8px Pretendard, sans-serif';
                ctx.fillText(`${i + 1}행`, -7, -3);

                ctx.restore();
            }

            // 5. 오버레이 상태 정보
            const { v0, a } = currentPhysicsData;
            const currentSpeed = v0 + a * currentT;

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px Pretendard, sans-serif';
            ctx.fillText(`⏱️ 시간: ${currentT.toFixed(2)}초 / ${currentPhysicsData.t}초`, 15, 25);
            ctx.fillText(`🏎️ 현재 속도: ${currentSpeed.toFixed(2)} m/s`, 15, 45);
            ctx.fillText(`🎢 열차 정보: 5행 5열 (총 25인승) 대형 코스터`, 15, 65);
        }

        /**
         * STREAMING_CHUNK:Drawing speed-time (v-t) graph...
         * v-t 그래프 및 속도 변화 면적(이동거리) 시각화
         */
        function drawGraph(v0, v1, t, a, distance) {
            const canvas = document.getElementById('motionCanvas');
            const ctx = canvas.getContext('2d');

            const width = canvas.width;
            const height = canvas.height;

            const padding = { top: 30, right: 30, bottom: 40, left: 50 };
            const graphWidth = width - padding.left - padding.right;
            const graphHeight = height - padding.top - padding.bottom;

            ctx.clearRect(0, 0, width, height);

            const maxV = Math.max(v0, v1, 1) * 1.3;
            const maxT = t * 1.2;

            function getX(timeVal) {
                return padding.left + (timeVal / maxT) * graphWidth;
            }
            function getY(velVal) {
                return height - padding.bottom - (velVal / maxV) * graphHeight;
            }

            // A. 격자
            ctx.strokeStyle = '#e5e7eb';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 1; i <= 4; i++) {
                let yTemp = padding.top + (graphHeight / 4) * i;
                ctx.moveTo(padding.left, yTemp);
                ctx.lineTo(width - padding.right, yTemp);
            }
            ctx.stroke();

            // B. 이동거리 영역 (붉은 넓이)
            ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
            ctx.beginPath();
            ctx.moveTo(getX(0), getY(0));
            ctx.lineTo(getX(0), getY(v0));
            ctx.lineTo(getX(t), getY(v1));
            ctx.lineTo(getX(t), getY(0));
            ctx.closePath();
            ctx.fill();

            // C. 축
            ctx.strokeStyle = '#374151';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(padding.left, padding.top);
            ctx.lineTo(padding.left, height - padding.bottom);
            ctx.lineTo(width - padding.right, height - padding.bottom);
            ctx.stroke();

            // D. 속도선
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(getX(0), getY(v0));
            ctx.lineTo(getX(t), getY(v1));
            ctx.stroke();

            // E. 주요 데이터 포인트
            ctx.fillStyle = '#2563eb';
            ctx.beginPath();
            ctx.arc(getX(0), getY(v0), 5, 0, Math.PI * 2);
            ctx.arc(getX(t), getY(v1), 5, 0, Math.PI * 2);
            ctx.fill();

            // F. 가이드 점선
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(getX(t), getY(v1));
            ctx.lineTo(getX(t), getY(0));
            ctx.moveTo(getX(t), getY(v1));
            ctx.lineTo(getX(0), getY(v1));
            ctx.stroke();
            ctx.setLineDash([]);

            // G. 수치 텍스트
            ctx.fillStyle = '#1f2937';
            ctx.font = '12px sans-serif';
            ctx.fillText('속도 v (m/s)', padding.left - 40, padding.top - 10);
            ctx.fillText(v0.toFixed(1), padding.left - 30, getY(v0) + 4);
            ctx.fillText(v1.toFixed(1), padding.left - 30, getY(v1) + 4);

            ctx.fillText('시간 t (초)', width - padding.right - 20, height - padding.bottom + 30);
            ctx.fillText('0', getX(0) - 3, height - padding.bottom + 20);
            ctx.fillText(t.toFixed(1) + '초', getX(t) - 10, height - padding.bottom + 20);

            const midX = (getX(0) + getX(t)) / 2;
            const midY = (getY(0) + getY((v0 + v1) / 2)) / 2;
            ctx.fillStyle = '#dc2626';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(`면적(이동거리) = ${distance.toFixed(1)}m`, midX - 55, midY);
        }
    </script>
</body>
