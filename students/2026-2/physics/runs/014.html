<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>h1 { color: #1f6fd6; }</style></head><body><h1>안녕하세요</h1>
<p><!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9량 롤러코스터 시뮬레이션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 lg:p-6 flex flex-col justify-between">

    <!-- 상단 타이틀 -->
    <header class="mb-4 flex items-center justify-between bg-white px-6 py-3 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🎢</span>
            <h1 class="text-xl font-bold text-slate-900">9량 롤러코스터 열차 통과 시뮬레이션 (곡선 레일)</h1>
        </div>
        <div id="timeDisplay" class="text-sm font-semibold text-blue-600 bg-blue-50 px-4 py-1.5 rounded-full border border-blue-100">
            진행 시간: 0.0s
        </div>
    </header>

    <!-- 메인 가로 배치 컨테이너 (좌측: 시뮬+그래프, 우측: 물리 조건) -->
    <main class="grid grid-cols-1 xl:grid-cols-12 gap-6 flex-grow items-stretch">
        
        <!-- 좌측 영역: 시뮬레이션 & 그래프 (넓게 배치) -->
        <div class="xl:col-span-8 flex flex-col gap-6">
            
            <!-- 롤러코스터 시뮬레이션 카드 -->
            <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between relative overflow-hidden h-[340px]">
                <div class="flex justify-between items-center text-xs font-semibold text-slate-400 mb-2">
                    <span class="text-blue-500 font-bold">기준점 (0m)</span>
                    <span class="text-red-500 font-bold">통과 완료 (15m)</span>
                </div>
                
                <!-- 캔버스 영역 -->
                <div class="relative w-full flex-grow">
                    <canvas id="simCanvas" class="w-full h-full"></canvas>
                </div>
            </section>

            <!-- 실시간 속도-시간 그래프 (v-t 그래프) 카드 -->
            <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between h-[360px]">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-sm font-bold text-slate-700 flex items-center gap-2">
                        <span>📈</span> 실시간 속도-시간 그래프 (v-t 그래프)
                    </h2>
                    <span id="statusBadge" class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1 rounded-full">
                        대기 중 (시작 버튼을 누르세요)
                    </span>
                </div>
                
                <!-- 그래프 캔버스 영역 -->
                <div class="relative w-full flex-grow">
                    <canvas id="vtChart" class="w-full h-full"></canvas>
                </div>
            </section>

        </div>

        <!-- 우측 영역: 물리 계산 조건 및 컨트롤 패널 (컴팩트 & 직관적) -->
        <aside class="xl:col-span-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
            <div>
                <div class="flex items-center gap-2 mb-6 pb-3 border-b border-slate-100">
                    <span class="text-lg">📋</span>
                    <h2 class="text-base font-bold text-slate-900">물리 계산 조건</h2>
                </div>

                <div class="space-y-4">
                    <div class="flex justify-between items-center p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                        <span class="text-sm text-slate-600 font-medium">열차 규격</span>
                        <span class="text-sm font-bold text-blue-600">9량 하이퍼코스터</span>
                    </div>

                    <div class="flex justify-between items-center p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                        <span class="text-sm text-slate-600 font-medium">이동 거리 (S)</span>
                        <span class="text-sm font-bold text-slate-900">15.0 m</span>
                    </div>

                    <div class="flex justify-between items-center p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                        <span class="text-sm text-slate-600 font-medium">통과 시간 (t)</span>
                        <span class="text-sm font-bold text-slate-900">2.0 s</span>
                    </div>

                    <div class="flex justify-between items-center p-3.5 bg-blue-50/50 rounded-xl border border-blue-100">
                        <span class="text-sm text-blue-900 font-medium">산출 가속도 (a)</span>
                        <span class="text-sm font-bold text-blue-600">7.5 m/s²</span>
                    </div>

                    <div class="flex justify-between items-center p-3.5 bg-blue-50/50 rounded-xl border border-blue-100">
                        <span class="text-sm text-blue-900 font-medium">2초 후 속도 (v)</span>
                        <span class="text-sm font-bold text-blue-600">15.0 m/s</span>
                    </div>
                </div>
            </div>

            <!-- 하단 제어 버튼 -->
            <div class="mt-8 space-y-3">
                <button id="playBtn" class="w-full py-4 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <span>▶</span> 시뮬레이션 시작 (Play)
                </button>
                <button id="resetBtn" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <span>🔄</span> 처음으로 (Reset)
                </button>
            </div>
        </aside>

    </main>

    <!-- 스크립트 로직 -->
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('playBtn');
        const resetBtn = document.getElementById('resetBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const statusBadge = document.getElementById('statusBadge');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let vtChart;
        function initChart() {
            const ctxChart = document.getElementById('vtChart').getContext('2d');
            vtChart = new Chart(ctxChart, {
                type: 'line',
                data: {
                    datasets: [{
                        label: '속도 (v-t)',
                        data: [],
                        borderColor: '#ef4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.1,
                        pointRadius: 0,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        x: {
                            type: 'linear',
                            min: 0,
                            max: 2.5,
                            title: { display: true, text: '시간 (s)' },
                            grid: { color: '#f1f5f9' }
                        },
                        y: {
                            min: 0,
                            max: 20,
                            title: { display: true, text: '속도 (m/s)' },
                            grid: { color: '#f1f5f9' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }
        initChart();

        let isRunning = false;
        let currentTime = 0;
        const totalDuration = 2.0;
        const maxDisplayTime = 2.5;
        let animationId = null;
        let lastTimestamp = null;

        function getRailY(x, width) {
            const normalizedX = x / width;
            return canvas.height * 0.55 + Math.sin(normalizedX * Math.PI * 2.5) * 25;
        }

        function drawScene(progressTime) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const width = canvas.width;

            // 기둥 (Support Pillars)
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 4;
            const pillarCount = 9;
            for (let i = 0; i <= pillarCount; i++) {
                const px = (width / pillarCount) * i;
                const py = getRailY(px, width);
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(px, canvas.height - 20);
                ctx.stroke();
            }

            // 곡선 레일 그리기
            ctx.beginPath();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 6;
            for (let x = 0; x <= width; x += 2) {
                const y = getRailY(x, width);
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 기준점 및 통과 완료선
            const startX = 60;
            const endX = width - 100;

            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(startX, 20);
            ctx.lineTo(startX, canvas.height - 20);
            ctx.stroke();

            ctx.strokeStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(endX, 20);
            ctx.lineTo(endX, canvas.height - 20);
            ctx.stroke();
            ctx.setLineDash([]);

            // 열차 이동 계산 (9량)
            const trackLength = endX - startX;
            const distanceTraveled = (Math.min(progressTime, totalDuration) / totalDuration) * trackLength;
            const carCount = 9;
            const carSpacing = 16;

            for (let i = carCount - 1; i >= 0; i--) {
                const carDist = distanceTraveled - (i * carSpacing);
                if (carDist < 0) continue;

                const currentX = startX + carDist;
                const currentY = getRailY(currentX, width);

                // 객차 바디
                ctx.fillStyle = '#0284c7';
                ctx.beginPath();
                ctx.roundRect(currentX - 10, currentY - 14, 20, 12, 4);
                ctx.fill();

                // 창문
                ctx.fillStyle = '#e0f2fe';
                ctx.fillRect(currentX - 6, currentY - 11, 5, 5);
                ctx.fillRect(currentX + 1, currentY - 11, 5, 5);

                // 바퀴
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(currentX - 6, currentY - 2, 3, 0, Math.PI * 2);
                ctx.arc(currentX + 6, currentY - 2, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function updateSimulation(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const deltaTime = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            if (isRunning) {
                currentTime += deltaTime;
                if (currentTime >= totalDuration) {
                    currentTime = totalDuration;
                    isRunning = false;
                    playBtn.innerHTML = '<span>▶</span> 시뮬레이션 재시작';
                    statusBadge.className = 'text-xs font-semibold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full';
                    statusBadge.textContent = '통과 완료 (a = 7.5 m/s², v = 15.0 m/s)';
                }

                timeDisplay.textContent = `진행 시간: ${currentTime.toFixed(1)}s`;

                // 그래프 데이터 갱신
                const currentV = (7.5 * currentTime);
                const chartData = vtChart.data.datasets[0].data;
                if (!chartData.some(d => d.x === Number(currentTime.toFixed(1)))) {
                    chartData.push({ x: Number(currentTime.toFixed(1)), y: Number(currentV.toFixed(1)) });
                    vtChart.update();
                }
            }

            drawScene(currentTime);

            if (isRunning || currentTime <= totalDuration) {
                animationId = requestAnimationFrame(updateSimulation);
            }
        }

        playBtn.addEventListener('click', () => {
            if (currentTime >= totalDuration) {
                resetSimulation();
            }
            isRunning = !isRunning;
            if (isRunning) {
                playBtn.innerHTML = '<span>⏸</span> 일시정지 (Pause)';
                statusBadge.className = 'text-xs font-semibold text-blue-600 bg-blue-50 px-3 py-1 rounded-full';
                statusBadge.textContent = '시뮬레이션 진행 중...';
                lastTimestamp = performance.now();
                animationId = requestAnimationFrame(updateSimulation);
            } else {
                playBtn.innerHTML = '<span>▶</span> 이어서 시뮬레이션 (Play)';
                statusBadge.className = 'text-xs font-semibold text-amber-600 bg-amber-50 px-3 py-1 rounded-full';
                statusBadge.textContent = '일시 정지됨';
            }
        });

        function resetSimulation() {
            isRunning = false;
            cancelAnimationFrame(animationId);
            currentTime = 0;
            lastTimestamp = null;
            timeDisplay.textContent = '진행 시간: 0.0s';
            playBtn.innerHTML = '<span>▶</span> 시뮬레이션 시작 (Play)';
            statusBadge.className = 'text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1 rounded-full';
            statusBadge.textContent = '대기 중 (시작 버튼을 누르세요)';
            
            vtChart.data.datasets[0].data = [];
            vtChart.update();
            drawScene(0);
        }

        resetBtn.addEventListener('click', resetSimulation);
        drawScene(0);
    </script>
</body>
</html></p><script>// 여기에 JS 작성
